pan class=\"k\">from</span>  表名;"},{"note":"","sql":"select 字段1 [ as 别名1 ] , 字段2 [ as 别名2 ]  from  表名;","html":"<span class=\"k\">select</span> 字段1 [ <span class=\"k\">as</span> 别名1 ] , 字段2 [ <span class=\"k\">as</span> 别名2 ]  <span class=\"k\">from</span>  表名;"},{"note":"","sql":"select distinct 字段列表 from  表名;","html":"<span class=\"k\">select</span> <span class=\"k\">distinct</span> 字段列表 <span class=\"k\">from</span>  表名;"},{"note":"案例1：查询指定字段 name，entry_date并返回","sql":"select name,entry_date from emp;","html":"<span class=\"k\">select</span> name,entry_date <span class=\"k\">from</span> emp;"},{"note":"案例2：查询返回所有字段","sql":"select * from emp;","html":"<span class=\"k\">select</span> * <span class=\"k\">from</span> emp;"},{"note":"案例3：查询所有员工的 name, entry_date，并起别名(姓名、入职日期)","sql":"-- 方式1：\nselect name AS 姓名, entry_date AS 入职日期 from emp;\n-- 方式2： 别名中有特殊字符时，使用''或\"\"包含\nselect name AS '姓 名', entry_date AS '入职日期' from emp;\n-- 方式3：\nselect name AS \"姓名\", entry_date AS \"入职日期\" from emp;","html":"<span class=\"c\">-- 方式1：</span>\n<span class=\"k\">select</span> name <span class=\"k\">AS</span> 姓名, entry_date <span class=\"k\">AS</span> 入职日期 <span class=\"k\">from</span> emp;\n<span class=\"c\">-- 方式2： 别名中有特殊字符时，使用&#x27;&#x27;或&quot;&quot;包含</span>\n<span class=\"k\">select</span> name <span class=\"k\">AS</span> <span class=\"s\">&#x27;姓 名&#x27;</span>, entry_date <span class=\"k\">AS</span> <span class=\"s\">&#x27;入职日期&#x27;</span> <span class=\"k\">from</span> emp;\n<span class=\"c\">-- 方式3：</span>\n<span class=\"k\">select</span> name <span class=\"k\">AS</span> <span class=\"s\">&quot;姓名&quot;</span>, entry_date <span class=\"k\">AS</span> <span class=\"s\">&quot;入职日期&quot;</span> <span class=\"k\">from</span> emp;"},{"note":"案例4：查询已有的员工关联了哪几种职位(不要重复)","sql":"select distinct job from emp;","html":"<span class=\"k\">select</span> <span class=\"k\">distinct</span> job <span class=\"k\">from</span> emp;"}],"tips":[]},{"id":"pa3.3.4","label":"条件查询","text":["学习条件查询就是学习条件的构建方式，而在SQL语句当中构造条件的运算符分为两类：","比较运算符","逻辑运算符","常用的比较运算符如下:","常用的逻辑运算符如下:"],"code":[{"note":"","sql":"select  字段列表  from   表名   where   条件列表 ; -- 条件列表：意味着可以有多个条件","html":"<span class=\"k\">select</span>  字段列表  <span class=\"k\">from</span>   表名   <span class=\"k\">where</span>   条件列表 ; <span class=\"c\">-- 条件列表：意味着可以有多个条件</span>"},{"note":"案例1：查询 姓名 为 '杨逍' 的员工","sql":"select id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\nfrom emp\nwhere name = '杨逍'; -- 字符串使用''或\"\"包含","html":"<span class=\"k\">select</span> id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\n<span class=\"k\">from</span> emp\n<span class=\"k\">where</span> name = <span class=\"s\">&#x27;杨逍&#x27;</span>; <span class=\"c\">-- 字符串使用&#x27;&#x27;或&quot;&quot;包含</span>"},{"note":"案例2：查询 薪资小于等于 5000 的员工信息","sql":"select id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\nfrom emp\nwhere salary <=5000;","html":"<span class=\"k\">select</span> id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\n<span class=\"k\">from</span> emp\n<span class=\"k\">where</span> salary &lt;=<span class=\"n\">5000</span>;"},{"note":"案例3：查询 没有分配职位 的员工信息","sql":"select id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\nfrom emp\nwhere job is null ;","html":"<span class=\"k\">select</span> id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\n<span class=\"k\">from</span> emp\n<span class=\"k\">where</span> job <span class=\"k\">is</span> <span class=\"k\">null</span> ;"},{"note":"案例4：查询 有职位 的员工信息","sql":"select id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\nfrom emp\nwhere job is not null ;","html":"<span class=\"k\">select</span> id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\n<span class=\"k\">from</span> emp\n<span class=\"k\">where</span> job <span class=\"k\">is</span> <span class=\"k\">not</span> <span class=\"k\">null</span> ;"},{"note":"案例5：查询 密码不等于 '123456' 的员工信息","sql":"-- 方式1：\nselect id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\nfrom emp\nwhere password <> '123456';","html":"<span class=\"c\">-- 方式1：</span>\n<span class=\"k\">select</span> id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\n<span class=\"k\">from</span> emp\n<span class=\"k\">where</span> password &lt;&gt; <span class=\"s\">&#x27;123456&#x27;</span>;"},{"note":"","sql":"-- 方式2：\nselect id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\nfrom emp\nwhere password != '123456';","html":"<span class=\"c\">-- 方式2：</span>\n<span class=\"k\">select</span> id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\n<span class=\"k\">from</span> emp\n<span class=\"k\">where</span> password != <span class=\"s\">&#x27;123456&#x27;</span>;"},{"note":"案例6：查询 入职日期 在  '2000-01-01' (包含)  到  '2010-01-01'(包含) 之间的员工信息","sql":"-- 方式1：\nselect id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\nfrom emp\nwhere entry_date >= '2000-01-01' and entry_date <= '2010-01-01';\n-- 方式2： between...and\nselect id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\nfrom emp\nwhere entry_date between '2000-01-01' and '2010-01-01';","html":"<span class=\"c\">-- 方式1：</span>\n<span class=\"k\">select</span> id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\n<span class=\"k\">from</span> emp\n<span class=\"k\">where</span> entry_date &gt;= <span class=\"s\">&#x27;2000-01-01&#x27;</span> <span class=\"k\">and</span> entry_date &lt;= <span class=\"s\">&#x27;2010-01-01&#x27;</span>;\n<span class=\"c\">-- 方式2： between...and</span>\n<span class=\"k\">select</span> id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\n<span class=\"k\">from</span> emp\n<span class=\"k\">where</span> entry_date <span class=\"k\">between</span> <span class=\"s\">&#x27;2000-01-01&#x27;</span> <span class=\"k\">and</span> <span class=\"s\">&#x27;2010-01-01&#x27;</span>;"},{"note":"案例7：查询 入职时间 在 '2000-01-01' (包含) 到 '2010-01-01'(包含) 之间 且 性别为女 的员工信息","sql":"select id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\nfrom emp\nwhere entry_date between '2000-01-01' and '2010-01-01';\nand gender = 2;","html":"<span class=\"k\">select</span> id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\n<span class=\"k\">from</span> emp\n<span class=\"k\">where</span> entry_date <span class=\"k\">between</span> <span class=\"s\">&#x27;2000-01-01&#x27;</span> <span class=\"k\">and</span> <span class=\"s\">&#x27;2010-01-01&#x27;</span>;\n<span class=\"k\">and</span> gender = <span class=\"n\">2</span>;"},{"note":"案例8：查询 职位是 2 (讲师), 3 (学工主管), 4 (教研主管) 的员工信息","sql":"-- 方式1：使用or连接多个条件\nselect id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\nfrom emp\nwhere job=2 or job=3 or job=4;\n-- 方式2：in关键字\nselect id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\nfrom emp\nwhere job in (2,3,4);","html":"<span class=\"c\">-- 方式1：使用or连接多个条件</span>\n<span class=\"k\">select</span> id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\n<span class=\"k\">from</span> emp\n<span class=\"k\">where</span> job=<span class=\"n\">2</span> <span class=\"k\">or</span> job=<span class=\"n\">3</span> <span class=\"k\">or</span> job=<span class=\"n\">4</span>;\n<span class=\"c\">-- 方式2：in关键字</span>\n<span class=\"k\">select</span> id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\n<span class=\"k\">from</span> emp\n<span class=\"k\">where</span> job <span class=\"k\">in</span> (<span class=\"n\">2</span>,<span class=\"n\">3</span>,<span class=\"n\">4</span>);"},{"note":"案例9：查询 姓名 为两个字的员工信息","sql":"select id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\nfrom emp\nwhere name like '__';  # 通配符 \"_\" 代表任意1个字符","html":"<span class=\"k\">select</span> id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\n<span class=\"k\">from</span> emp\n<span class=\"k\">where</span> name <span class=\"k\">like</span> <span class=\"s\">&#x27;__&#x27;</span>;  <span class=\"c\"># 通配符 &quot;_&quot; 代表任意1个字符</span>"},{"note":"案例10：查询 姓 '张' 的员工信息","sql":"select id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\nfrom emp\nwhere name like '张%'; # 通配符 \"%\" 代表任意个字符（0个 ~ 多个）","html":"<span class=\"k\">select</span> id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\n<span class=\"k\">from</span> emp\n<span class=\"k\">where</span> name <span class=\"k\">like</span> <span class=\"s\">&#x27;张%&#x27;</span>; <span class=\"c\"># 通配符 &quot;%&quot; 代表任意个字符（0个 ~ 多个）</span>"},{"note":"案例11：查询 姓名中包含 '二'  的员工信息","sql":"select id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\nfrom emp\nwhere name like '%二%'; # 通配符 \"%\" 代表任意个字符（0个 ~ 多个）","html":"<span class=\"k\">select</span> id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\n<span class=\"k\">from</span> emp\n<span class=\"k\">where</span> name <span class=\"k\">like</span> <span class=\"s\">&#x27;%二%&#x27;</span>; <span class=\"c\"># 通配符 &quot;%&quot; 代表任意个字符（0个 ~ 多个）</span>"}],"tips":["注意：查询为NULL的数据时，不能使用 = null 或 ！=null 。得使用 is null 或 is not null。"]},{"id":"pa3.3.5","label":"聚合函数","text":["之前我们做的查询都是横向查询，就是根据条件一行一行的进行判断，而使用聚合函数查询就是纵向查询，它是对一列的值进行计算，然后返回一个结果值。（将一列数据作为一个整体，进行纵向计算）","常用聚合函数：","count ：按照列去统计有多少行数据。","在根据指定的列统计的时候，如果这一列中有null的行，该行不会被统计在其中。","sum ：计算指定列的数值和，如果不是数值类型，那么计算结果为0","max ：计算指定列的最大值","min ：计算指定列的最小值","avg ：计算指定列的平均值","案例演示:"],"code":[{"note":"案例1：统计该企业员工数量","sql":"-- count(字段)\nselect count(id) from emp;-- 结果：30\nselect count(job) from emp;-- 结果：29 （聚合函数对NULL值不做计算）\n-- count(常量)\nselect count(0) from emp;\nselect count('A') from emp;\n-- count(*)  推荐此写法（MySQL底层进行了优化）\nselect count(*) from emp;","html":"<span class=\"c\">-- count(字段)</span>\n<span class=\"k\">select</span> <span class=\"f\">count</span>(id) <span class=\"k\">from</span> emp;<span class=\"c\">-- 结果：30</span>\n<span class=\"k\">select</span> <span class=\"f\">count</span>(job) <span class=\"k\">from</span> emp;<span class=\"c\">-- 结果：29 （聚合函数对NULL值不做计算）</span>\n<span class=\"c\">-- count(常量)</span>\n<span class=\"k\">select</span> <span class=\"f\">count</span>(<span class=\"n\">0</span>) <span class=\"k\">from</span> emp;\n<span class=\"k\">select</span> <span class=\"f\">count</span>(<span class=\"s\">&#x27;A&#x27;</span>) <span class=\"k\">from</span> emp;\n<span class=\"c\">-- count(*)  推荐此写法（MySQL底层进行了优化）</span>\n<span class=\"k\">select</span> <span class=\"f\">count</span>(*) <span class=\"k\">from</span> emp;"},{"note":"案例2：统计该企业员工的平均薪资","sql":"select avg(salary) from  emp;","html":"<span class=\"k\">select</span> <span class=\"f\">avg</span>(salary) <span class=\"k\">from</span>  emp;"},{"note":"案例3：统计该企业员工的最低薪资","sql":"select min(salary) from emp;","html":"<span class=\"k\">select</span> <span class=\"f\">min</span>(salary) <span class=\"k\">from</span> emp;"},{"note":"案例4：统计该企业员工的最高薪资","sql":"select max(salary) from emp;","html":"<span class=\"k\">select</span> <span class=\"f\">max</span>(salary) <span class=\"k\">from</span> emp;"},{"note":"案例5：统计该企业每月要给员工发放的薪资总额(薪资之和)","sql":"select sum(salary) from emp;","html":"<span class=\"k\">select</span> <span class=\"f\">sum</span>(salary) <span class=\"k\">from</span> emp;"}],"tips":["注意 : 聚合函数会忽略空值，对NULL值不作为统计。"]},{"id":"pa3.3.6","label":"分组查询","text":["分组： 按照某一列或者某几列，把相同的数据进行合并输出。","分组其实就是按列进行分类(指定列下相同的数据归为一类)，然后可以对分类完的数据进行合并计算。","分组查询通常会使用聚合函数进行计算。","案例演示：","where与having区别（面试题） / 执行时机不同：where是分组之前进行过滤，不满足where条件，不参与分组；而having是分组之后对结果进行过滤。 / 判断条件不同：where不能对聚合函数进行判断，而having可以。"],"code":[{"note":"","sql":"select  字段列表  from  表名  [where 条件]  group by 分组字段名  [having 分组后过滤条件];","html":"<span class=\"k\">select</span>  字段列表  <span class=\"k\">from</span>  表名  [<span class=\"k\">where</span> 条件]  <span class=\"k\">group</span> <span class=\"k\">by</span> 分组字段名  [<span class=\"k\">having</span> 分组后过滤条件];"},{"note":"案例1：根据性别分组 , 统计男性和女性员工的数量","sql":"select gender, count(*)\nfrom emp\ngroup by gender; -- 按照gender字段进行分组（gender字段下相同的数据归为一组）","html":"<span class=\"k\">select</span> gender, <span class=\"f\">count</span>(*)\n<span class=\"k\">from</span> emp\n<span class=\"k\">group</span> <span class=\"k\">by</span> gender; <span class=\"c\">-- 按照gender字段进行分组（gender字段下相同的数据归为一组）</span>"},{"note":"案例2：查询入职时间在 '2015-01-01' (包含) 以前的员工 , 并对结果根据职位分组 , 获取员工数量大于等于2的职位","sql":"select job, count(*)\nfrom emp\nwhere entry_date <= '2015-01-01'   -- 分组前条件\ngroup by job                      -- 按照job字段分组\nhaving count(*) >= 2;             -- 分组后条件","html":"<span class=\"k\">select</span> job, <span class=\"f\">count</span>(*)\n<span class=\"k\">from</span> emp\n<span class=\"k\">where</span> entry_date &lt;= <span class=\"s\">&#x27;2015-01-01&#x27;</span>   <span class=\"c\">-- 分组前条件</span>\n<span class=\"k\">group</span> <span class=\"k\">by</span> job                      <span class=\"c\">-- 按照job字段分组</span>\n<span class=\"k\">having</span> <span class=\"f\">count</span>(*) &gt;= <span class=\"n\">2</span>;             <span class=\"c\">-- 分组后条件</span>"}],"tips":["注意事项: / 分组之后，查询的字段一般为聚合函数和分组字段，查询其他字段无任何意义 / 执行顺序：where > 聚合函数 > having"]},{"id":"pa3.3.7","label":"排查查询","text":["排序在日常开发中是非常常见的一个操作，有升序排序，也有降序排序。","排序方式：","ASC ：升序（默认值）","DESC：降序","案例演示："],"code":[{"note":"","sql":"select  字段列表\nfrom   表名\n[where  条件列表]\n[group by  分组字段 ]\norder  by  字段1  排序方式1 , 字段2  排序方式2 … ;","html":"<span class=\"k\">select</span>  字段列表\n<span class=\"k\">from</span>   表名\n[<span class=\"k\">where</span>  条件列表]\n[<span class=\"k\">group</span> <span class=\"k\">by</span>  分组字段 ]\n<span class=\"k\">order</span>  <span class=\"k\">by</span>  字段1  排序方式1 , 字段2  排序方式2 … ;"},{"note":"案例1：根据入职时间, 对员工进行升序排序","sql":"select id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\nfrom emp\norder by entry_date ASC; -- 按照entrydate字段下的数据进行升序排序\nselect id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\nfrom emp\norder by  entry_date; -- 默认就是ASC（升序）","html":"<span class=\"k\">select</span> id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\n<span class=\"k\">from</span> emp\n<span class=\"k\">order</span> <span class=\"k\">by</span> entry_date <span class=\"k\">ASC</span>; <span class=\"c\">-- 按照entrydate字段下的数据进行升序排序</span>\n<span class=\"k\">select</span> id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\n<span class=\"k\">from</span> emp\n<span class=\"k\">order</span> <span class=\"k\">by</span>  entry_date; <span class=\"c\">-- 默认就是ASC（升序）</span>"},{"note":"案例2：根据入职时间，对员工进行降序排序","sql":"select id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\nfrom emp\norder by entry_date DESC; -- 按照entrydate字段下的数据进行降序排序","html":"<span class=\"k\">select</span> id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\n<span class=\"k\">from</span> emp\n<span class=\"k\">order</span> <span class=\"k\">by</span> entry_date <span class=\"k\">DESC</span>; <span class=\"c\">-- 按照entrydate字段下的数据进行降序排序</span>"},{"note":"案例3：根据入职时间对公司的员工进行升序排序，入职时间相同，再按照更新时间进行降序排序","sql":"select id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\nfrom emp\norder by entry_date ASC , update_time DESC;","html":"<span class=\"k\">select</span> id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\n<span class=\"k\">from</span> emp\n<span class=\"k\">order</span> <span class=\"k\">by</span> entry_date <span class=\"k\">ASC</span> , update_time <span class=\"k\">DESC</span>;"}],"tips":["注意事项：如果是升序, 可以不指定排序方式ASC","注意事项：如果是多字段排序，当第一个字段值相同时，才会根据第二个字段进行排序"]},{"id":"pa3.3.8","label":"分页查询","text":["分页操作在业务系统开发时，也是非常常见的一个功能，日常我们在网站中看到的各种各样的分页条，后台也都需要借助于数据库的分页操作。","分页查询语法："],"code":[{"note":"","sql":"select  字段列表  from  表名  limit  起始索引, 查询记录数 ;","html":"<span class=\"k\">select</span>  字段列表  <span class=\"k\">from</span>  表名  <span class=\"k\">limit</span>  起始索引, 查询记录数 ;"},{"note":"案例1：从起始索引0开始查询员工数据, 每页展示5条记录","sql":"select id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\nfrom emp\nlimit 0 , 5; -- 从索引0开始，向后取5条记录","html":"<span class=\"k\">select</span> id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\n<span class=\"k\">from</span> emp\n<span class=\"k\">limit</span> <span class=\"n\">0</span> , <span class=\"n\">5</span>; <span class=\"c\">-- 从索引0开始，向后取5条记录</span>"},{"note":"案例2：查询 第1页 员工数据, 每页展示5条记录","sql":"select id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\nfrom emp\nlimit 5; -- 如果查询的是第1页数据，起始索引可以省略，直接简写为：limit 条数","html":"<span class=\"k\">select</span> id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\n<span class=\"k\">from</span> emp\n<span class=\"k\">limit</span> <span class=\"n\">5</span>; <span class=\"c\">-- 如果查询的是第1页数据，起始索引可以省略，直接简写为：limit 条数</span>"},{"note":"案例3：查询 第2页 员工数据, 每页展示5条记录","sql":"select id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\nfrom emp\nlimit 5 , 5; -- 从索引5开始，向后取5条记录","html":"<span class=\"k\">select</span> id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\n<span class=\"k\">from</span> emp\n<span class=\"k\">limit</span> <span class=\"n\">5</span> , <span class=\"n\">5</span>; <span class=\"c\">-- 从索引5开始，向后取5条记录</span>"},{"note":"案例4：查询 第3页 员工数据, 每页展示5条记录","sql":"select id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\nfrom emp\nlimit 10 , 5; -- 从索引10开始，向后取5条记录","html":"<span class=\"k\">select</span> id, username, password, name, gender, phone, salary, job, image, entry_date, create_time, update_time\n<span class=\"k\">from</span> emp\n<span class=\"k\">limit</span> <span class=\"n\">10</span> , <span class=\"n\">5</span>; <span class=\"c\">-- 从索引10开始，向后取5条记录</span>"}],"tips":["注意事项: / 起始索引从0开始。           计算公式 ：起始索引 = （查询页码 - 1）* 每页显示记录数 / 分页查询是数据库的方言，不同的数据库有不同的实现，MySQL中是LIMIT / 如果查询的是第一页数据，起始索引可"]}]}]},{"id":"cb1","label":"JDBC","groups":[{"id":"gb2.2","label":"查询数据","points":[{"id":"pb2.2.1","label":"需求","text":["需求：基于JDBC实现用户登录功能。","本质：其本质呢，其实就是基于JDBC程序，执行如下select语句，并将查询的结果输出到控制台。SQL语句："],"code":[{"note":"","sql":"select * from user where username = 'linchong' and password = '123456';","html":"<span class=\"k\">select</span> * <span class=\"k\">from</span> user <span class=\"k\">where</span> username = <span class=\"s\">&#x27;linchong&#x27;</span> <span class=\"k\">and</span> password = <span class=\"s\">&#x27;123456&#x27;</span>;"}],"tips":[]},{"id":"pb2.2.2","label":"准备工作","text":["1). 创建一个maven项目","2). 创建一个数据库 web，并在该数据库中创建user表"],"code":[{"note":"","sql":"create table user(\nid int unsigned primary key auto_increment comment 'ID,主键',\nusername varchar(20) comment '用户名',\npassword varchar(32) comment '密码',\nname varchar(10) comment '姓名',\nage tinyint unsigned comment '年龄'\n) comment '用户表';\ninsert into user(id, username, password, name, age) values (1, 'daqiao', '123456', '大乔', 22),\n(2, 'xiaoqiao', '123456', '小乔', 18),\n(3, 'diaochan', '123456', '貂蝉', 24),\n(4, 'lvbu', '123456', '吕布', 28),\n(5, 'zhaoyun', '12345678', '赵云', 27);","html":"<span class=\"k\">create</span> <span class=\"k\">table</span> user(\nid <span class=\"k\">int</span> unsigned <span class=\"k\">primary</span> <span class=\"k\">key</span> <span class=\"k\">auto_increment</span> <span class=\"k\">comment</span> <span class=\"s\">&#x27;ID,主键&#x27;</span>,\nusername <span class=\"k\">varchar</span>(<span class=\"n\">20</span>) <span class=\"k\">comment</span> <span class=\"s\">&#x27;用户名&#x27;</span>,\npassword <span class=\"k\">varchar</span>(<span class=\"n\">32</span>) <span class=\"k\">comment</span> <span class=\"s\">&#x27;密码&#x27;</span>,\nname <span class=\"k\">varchar</span>(<span class=\"n\">10</span>) <span class=\"k\">comment</span> <span class=\"s\">&#x27;姓名&#x27;</span>,\nage tinyint unsigned <span class=\"k\">comment</span> <span class=\"s\">&#x27;年龄&#x27;</span>\n) <span class=\"k\">comment</span> <span class=\"s\">&#x27;用户表&#x27;</span>;\n<span class=\"k\">insert</span> <span class=\"k\">into</span> user(id, username, password, name, age) <span class=\"k\">values</span> (<span class=\"n\">1</span>, <span class=\"s\">&#x27;daqiao&#x27;</span>, <span class=\"s\">&#x27;123456&#x27;</span>, <span class=\"s\">&#x27;大乔&#x27;</span>, <span class=\"n\">22</span>),\n(<span class=\"n\">2</span>, <span class=\"s\">&#x27;xiaoqiao&#x27;</span>, <span class=\"s\">&#x27;123456&#x27;</span>, <span class=\"s\">&#x27;小乔&#x27;</span>, <span class=\"n\">18</span>),\n(<span class=\"n\">3</span>, <span class=\"s\">&#x27;diaochan&#x27;</span>, <span class=\"s\">&#x27;123456&#x27;</span>, <span class=\"s\">&#x27;貂蝉&#x27;</span>, <span class=\"n\">24</span>),\n(<span class=\"n\">4</span>, <span class=\"s\">&#x27;lvbu&#x27;</span>, <span class=\"s\">&#x27;123456&#x27;</span>, <span class=\"s\">&#x27;吕布&#x27;</span>, <span class=\"n\">28</span>),\n(<span class=\"n\">5</span>, <span class=\"s\">&#x27;zhaoyun&#x27;</span>, <span class=\"s\">&#x27;12345678&#x27;</span>, <span class=\"s\">&#x27;赵云&#x27;</span>, <span class=\"n\">27</span>);"}],"tips":[]},{"id":"pb2.2.3","label":"代码实现","text":["AI提示词（prompt）： / 你是一名java开发工程师，帮我基于JDBC程序来操作数据库，执行如下SQL语句： / select * from user where username = 'daqiao' and password = '123456'","具体的代码为：","1). 在 pom.xml 文件中引入依赖","XML / <dependencies> /     <!-- MySQL JDBC driver --> /     <dependency> /         <groupId>mysql</groupId> /         <artifactId>mysql-connector-java</artifact","2). 在 src/main/test/java 目录下编写测试类，定义测试方法","Java / public class JDBCTest { /  /     /** /      * 编写JDBC程序, 查询数据 /      */ /     @Test /     public void testJdbc() throws Exception { /         // 获取连接 /   ","而上述的单元测试中，我们在SQL语句中，将将 用户名 和密码的值都写死了，而这两个值应该是动态的，是将来页面传递到服务端的。 那么，我们可以基于前面所讲解的JUnit中的参数化测试进行单元测试，代码改造如下：","Java / public class JDBCTest { /  /     /** /      * 编写JDBC程序, 查询数据 /      */ /     @ParameterizedTest /     @CsvSource({\"daqiao,123456\"}) /     public void tes","如果在测试时，需要传递一组参数，可以使用  @CsvSource 注解。"],"code":[],"tips":[]},{"id":"pb2.2.4.1","label":"代码剖析 · ResultSet","text":["ResultSet（结果集对象）：封装了DQL查询语句查询的结果。","next()：将光标从当前位置向前移动一行，并判断当前行是否为有效行，返回值为boolean。","true：有效行，当前行有数据","false：无效行，当前行没有数据","getXxx(…)：获取数据，可以根据列的编号获取，也可以根据列名获取（推荐）。","结果解析步骤："],"code":[],"tips":[]},{"id":"pb2.2.4.2","label":"代码剖析 · 预编译SQL","text":["其实我们在编写SQL语句的时候，有两种风格：","静态SQL（参数硬编码）","Java / conn.prepareStatement(\"SELECT * FROM user WHERE username = 'daqiao' AND password = '123456'\"); / ResultSet resultSet = pstmt.executeQuery();","这种呢，就是参数值，直接拼接在SQL语句中，参数值是写死的。","预编译SQL（参数动态传递）","Java / conn.prepareStatement(\"SELECT * FROM user WHERE username = ? AND password = ?\"); / pstmt.setString(1, \"daqiao\"); / pstmt.setString(2, \"123456\"); / Result","这种呢，并未将参数值在SQL语句中写死，而是使用 ？ 进行占位，然后再指定每一个占位符对应的值是多少，而最终在执行SQL语句的时候，程序会将SQL语句（SELECT * FROM user WHERE username = ? AND password = ?），以及参数值（\"daqiao\", \"123456\"）都发送","那这种预编译的SQL，也是在项目开发中推荐使用的SQL语句。主要的作用有两个：","防止SQL注入","性能更高","那接下来，我们就来介绍一下这两点。","2.2.4.2.1 SQL注入","SQL注入：通过控制输入来修改事先定义好的SQL语句，以达到执行代码对服务器进行攻击的方法。","SQL注入最典型的场景，就是用户登录功能。","注入演示：","1). 打开课程资料中的文件夹 资料/02. SQL注入演示，运行其中的jar包 sql_Injection_demo-0.0.1-SNAPSHOT.jar，进入该目录后，执行命令：","Java / java -jar sql_Injection_demo-0.0.1-SNAPSHOT.jar","2). 打开浏览器访问  ，必须登录后才能访问到系统。我们先测试正常的用户名和密码","3). 接下来，我们再来测试一下错误的用户名和密码 。","我们看到，如果用户名密码错误，是不能进入到系统中进行访问的，会提示 用户名和密码错误。","4). 那接下来，我们就要演示一下SQL注入现象，我们可以通过控制表单输入，来修改事先定义好的SQL语句的含义。 从而来攻击服务器。","点击登录后，我们看到居然可以成功进入到系统中。","为什么会出现这种现象呢？","在进行登录操作时，怎么样才算登录成功呢？ 如果我们查询到了数据，就说明用户名密码是对的。 如果没有查询到数据，就说明用户名或密码错误。","而出现上述现象，原因就是因为，我们我们编写的SQL语句是基于字符串进行拼接的 。 我们输入的用户名无所谓，比如：shfhsjfhja ，而密码呢，就是我们精心设计的，如：' or '1' = '1 。","那最终拼接的SQL语句，如下所示：","我们知道，or 连接的条件，是或的关系，两者满足其一就可以。 所以，虽然用户名密码输入错误，也是可以查询返回结果的，而只要查询到了数据，就说明用户名和密码是正确的。","2.2.4.2.2 SQL注入解决","而通过预编译SQL（select * from user where username = ? and password = ?），就可以直接解决上述SQL注入的问题。 接下来，我们再来演示一下，通过预编译SQL是否能够解决SQL注入问题。","1). 打开课程资料中的文件夹 资料/02. SQL注入演示，运行其中的jar包 sql_prepared_demo-0.0.1-SNAPSHOT.jar，进入该目录后，执行命令：","Java / java -jar sql_prepared_demo-0.0.1-SNAPSHOT.jar","2). 打开浏览器访问  ，必须登录后才能访问到系统 。我们先测试正常的用户名和密码","3). 那接下来，我们就要演示一下是否可以基于上述的密码 ' or '1' = '1，来完成SQL注入 。","通过控制台，可以看到输入的SQL语句，是预编译SQL语句。","而在预编译SQL语句中，当我们执行的时候，会把整个' or '1'='1作为一个完整的参数，赋值给第2个问号（' or '1'='1进行了转义，只当做字符串使用）","那么此时再查询时，就查询不到对应的数据了，登录失败。","2.2.4.2.3 性能更高"],"code":[],"tips":["注意：在以后的项目开发中，我们使用的基本全部都是预编译SQL语句。"]}]},{"id":"gb2.3","label":"增删改数据","points":[{"id":"pb2.3.1","label":"需求","text":["需求：基于JDBC程序，执行如下update语句。","SQL：","Java / update user set password = '123456', gender = 2 where id = 1;"],"code":[],"tips":[]},{"id":"pb2.3.2","label":"代码实现","text":["AI提示词（prompt）： / 你是一名java开发工程师，帮我基于JDBC程序来操作数据库，执行如下SQL语句： / update user set password = '123456', gender = 2 where id = 1;","代码实现如下：","Java / @ParameterizedTest / @CsvSource({\"1,123456,25\"}) / public void testUpdate(int userId, String newPassword, int newAge) throws Exception { /     // 建立数据库连接","JDBC程序执行DML语句：int rowsUpdated = pstmt.executeUpdate();  //返回值是影响的记录数 / JDBC程序执行DQL语句：ResultSet resultSet = pstmt.executeQuery(); //返回值是查询结果集"],"code":[],"tips":[]}]}]},{"id":"cb2","label":"Mybatis","groups":[{"id":"gb3.1","label":"介绍","points":[{"id":"pb3.1.1","label":"快速入门","text":["需求：使用Mybatis查询所有用户数据 。","1). 创建springboot工程，并导入 mybatis的起步依赖、mysql的驱动包、lombok。","项目工程创建完成后，自动在pom.xml文件中，导入Mybatis依赖和MySQL驱动依赖。如下所示：","2). 数据准备：创建用户表user，并创建对应的实体类User。","用户表 user（如果已经存在，就不用创建了）","Java / create table user( /     id int unsigned primary key auto_increment comment 'ID,主键', /     username varchar(20) comment '用户名', /     password varchar(32)","实体类：实体类的属性名与表中的字段名一一对应。 实体类放在 com.itheima.pojo 包下。","Java / @Data / @NoArgsConstructor / @AllArgsConstructor / public class User { /     private Integer id; //ID /     private String username; //用户名 /     private ","3). 配置Mybatis","在 application.properties 中配置数据库的连接信息。","Properties / #数据库访问的url地址 / spring.datasource.url=jdbc:mysql://localhost:3306/web / #数据库驱动类类名 / spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver / #","上述的配置，可以直接复制过去，不要敲错了。 全部都是 spring.datasource.xxxx 开头。","4). 编写Mybatis程序：编写Mybatis的持久层接口，定义SQL语句（注解）","在创建出来的springboot工程中，在引导类所在包下，在创建一个包 mapper 。在 mapper 包下创建一个接口 UserMapper ，这是一个持久层接口（Mybatis的持久层接口规范一般都叫 XxxMapper）。","UserMapper接口的内容如下：","Java / import com.itheima.pojo.User; / import org.apache.ibatis.annotations.Mapper; / import org.apache.ibatis.annotations.Select; / import java.util.List; /  /","注解说明： / @Mapper注解：表示是mybatis中的Mapper接口 / 程序运行时，框架会自动生成接口的实现类对象(代理对象)，并给交Spring的IOC容器管理 / @Select注解：代表的就是select查询，用于书写select查询语句","5). 单元测试","在创建出来的SpringBoot工程中，在src下的test目录下，已经自动帮我们创建好了测试类 ，并且在测试类上已经添加了注解 @SpringBootTest，代表该测试类已经与SpringBoot整合。","该测试类在运行时，会自动通过引导类加载Spring的环境（IOC容器）。我们要测试那个bean对象，就可以直接通过@Autowired注解直接将其注入进行，然后就可以测试了。","测试类代码如下：","Java / @SpringBootTest / class SpringbootMybatisQuickstartApplicationTests { /  /     @Autowired /     private UserMapper userMapper; /  /     @Test /     publi","运行结果："],"code":[],"tips":["注意：测试类所在包，需要与引导类所在包相同。"]},{"id":"pb3.1.2.1","label":"辅助配置 · 配置SQL提示","text":["默认我们在UserMapper接口上加的 @Select 注解中编写SQL语句是没有提示的。 如果想让idea给我们提示对应的SQL语句，我们需要在IDEA中配置与MySQL数据库的链接。","默认我们在UserMapper接口上的 @Select 注解中编写SQL语句是没有提示的。如果想让idea给出提示，可以做如下配置：","配置完成之后，发现SQL语句中的关键字有提示了，但还存在不识别表名(列名)的情况：","产生原因：Idea和数据库没有建立连接，不识别表信息","解决方案：在Idea中配置MySQL数据库连接","按照如下方如下方式，来配置当前IDEA关联的MySQL数据库（必须要指定连接的是哪个数据库）。","在配置的时候指定连接那个数据库，如上图所示连接的就是mybatis数据库（自己的数据库名是什么就指定什么）。"],"code":[],"tips":["注意：该配置的目的，仅仅是为了在编写SQL语句时，有语法提示（写错了会报错），不会影响运行，即使不配置也是可以的。"]},{"id":"pb3.1.2.2","label":"辅助配置 · 配置Mybatis日志输出","text":["默认情况下，在Mybatis中，SQL语句执行时，我们并看不到SQL语句的执行日志。 在application.properties加入如下配置，即可查看日志：","Properties / #mybatis的配置 / mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl","打开上述开关之后，再次运行单元测试，就可以看到控制台输出的SQL语句是什么样子的。"],"code":[],"tips":[]},{"id":"pb3.1.3","label":"JDBC VS  Mybatis","text":["JDBC程序的缺点：","url、username、password 等相关参数全部硬编码在java代码中。","查询结果的解析、封装比较繁琐。","每一次操作数据库之前，先获取连接，操作完毕之后，关闭连接。 频繁的获取连接、释放连接造成资源浪费。","分析了JDBC的缺点之后，我们再来看一下在mybatis中，是如何解决这些问题的：","数据库连接四要素(驱动、链接、用户名、密码)，都配置在springboot默认的配置文件 application.properties中","查询结果的解析及封装，由mybatis自动完成映射封装，我们无需关注","在mybatis中使用了数据库连接池技术，从而避免了频繁的创建连接、销毁连接而带来的资源浪费。","使用SpringBoot+Mybatis的方式操作数据库，能够提升开发效率、降低资源浪费","而对于Mybatis来说，我们在开发持久层程序操作数据库时，需要重点关注以下两个方面：","application.properties","Properties / #驱动类名称 / spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver / #数据库连接的url / spring.datasource.url=jdbc:mysql://localhost:3306/web01 / #连接数","Mapper接口（编写SQL语句）","Java / @Mapper / public interface UserMapper { /     @Select(\"select * from user\") /     public List<User> list(); / }"],"code":[],"tips":[]},{"id":"pb3.1.4","label":"数据库连接池","text":["在前面我们所讲解的mybatis中，使用了数据库连接池技术，避免频繁的创建连接、销毁连接而带来的资源浪费。","下面我们就具体的了解下数据库连接池。"],"code":[],"tips":[]},{"id":"pb3.1.4.1","label":"数据库连接池 · 介绍","text":["1). 没有数据库连接池的情况","客户端执行SQL语句：要先创建一个新的连接对象，然后执行SQL语句，SQL语句执行后又需要关闭连接对象从而释放资源，每次执行SQL时都需要创建连接、销毁链接，这种频繁的重复创建销毁的过程是比较耗费计算机的性能。","2). 有数据库连接池的情况","数据库连接池是个容器，负责分配、管理数据库连接(Connection)","程序在启动时，会在数据库连接池(容器)中，创建一定数量的Connection对象","允许应用程序重复使用一个现有的数据库连接，而不是再重新建立一个","客户端在执行SQL时，先从连接池中获取一个Connection对象，然后在执行SQL语句，SQL语句执行完之后，释放Connection时就会把Connection对象归还给连接池（Connection对象可以复用）","释放空闲时间超过最大空闲时间的连接，来避免因为没有释放连接而引起的数据库连接遗漏","客户端获取到Connection对象了，但是Connection对象并没有去访问数据库(处于空闲)，数据库连接池发现Connection对象的空闲时间 > 连接池中预设的最大空闲时间，此时数据库连接池就会自动释放掉这个连接对象","数据库连接池的好处：","资源重用","提升系统响应速度","避免数据库连接遗漏"],"code":[],"tips":[]},{"id":"pb3.1.4.2","label":"数据库连接池 · 产品","text":["要怎么样实现数据库连接池呢？","官方(sun)提供了数据库连接池标准（javax.sql.DataSource接口）","功能：获取连接","Java / public Connection getConnection() throws SQLException;","第三方组织必须按照DataSource接口实现","常见的数据库连接池：C3P0 、DBCP 、Druid 、Hikari (springboot默认)","现在使用更多的是：Hikari、Druid  （性能更优越）","1). Hikari（追光者） [默认的连接池]","从控制台输出的日志，我们也可以看出，springboot底层默认使用的数据库连接池就是 Hikari。","2). Druid（德鲁伊）","Druid连接池是阿里巴巴开源的数据库连接池项目","功能强大，性能优秀，是Java语言最好的数据库连接池之一","如果我们想把默认的数据库连接池切换为Druid数据库连接池，只需要完成以下两步操作即可：","参考官方地址：","①. 在pom.xml文件中引入依赖","XML / <dependency> /     <!-- Druid连接池依赖 --> /     <groupId>com.alibaba</groupId> /     <artifactId>druid-spring-boot-starter</artifactId> /     <version>1.2.19","②. 在application.properties中引入数据库连接配置","Properties / spring.datasource.type=com.alibaba.druid.pool.DruidDataSource / spring.datasource.druid.driver-class-name=com.mysql.cj.jdbc.Driver / spring.datasou","配置完毕之后，我们再次运行单元测试，大家会看到控制台输出的日志中，已经将连接池切换为了 Druid连接池。"],"code":[],"tips":[]},{"id":"pb3.1.5.1","label":"增删改查操作 · 删除","text":["需求：根据ID删除用户信息","SQL：delete from user where id = 5;","Mapper接口方法：","方式一：","Java / /** /  * 根据id删除 /  */ / @Delete(\"delete from user where id = 5\") / public void deleteById();","这种方式执行删除操作，调用deleteById方法只能删除id为5的用户信息，因为将id直接写死在代码中了，不可取。","方式二：","Java / /** /  * 根据id删除 /  */ / @Delete(\"delete from user where id = #{id}\") / public void deleteById(Integer id);","在Mybatis中，我们可以通过参数占位符号 #{...} 来占位，在调用deleteById方法时，传递的参数值，最终会替换占位符。","编写单元测试方法进行测试","在单元测试类中,增加如下测试方法.","Java / @Test / public void testDeleteById(){ /     userMapper.deleteById(36); / }","运行单元测试，结果如下：","运行之后，我们发现，#{...} 占位符，其实最终被替换成了 ？占位符，生成的是预编译的SQL语句。【推荐】","DML语句执行完毕，是有返回值的，我们可以为Mapper接口方法定义返回值来接收，如下：","Java / /** /  * 根据id删除 /  */ / @Delete(\"delete from user where id = #{id}\") / public Integer deleteById(Integer id);","Integer类型的返回值，表示DML语句执行完毕影响的记录数。","Mybatis的提供的符号，有两个，一个是 #{...}，另一个是 ${...}，区别如下：","那在企业项目开发中，强烈建议使用 #{...} 。"],"code":[],"tips":[]},{"id":"pb3.1.5.2","label":"增删改查操作 · 新增","text":["需求：添加一个用户","SQL：insert into user(username,password,name,age) values('zhouyu','123456','周瑜',20);","Mapper接口：","Java / /** /  * 添加用户 /  */ / @Insert(\"insert into user(username,password,name,age) values(#{username},#{password},#{name},#{age})\") / public void insert(User us","如果在SQL语句中，我们需要传递多个参数，我们可以把多个参数封装到一个对象中。然后在SQL语句中，我们可以通过#{对象属性名}的方式，获取到对象中封装的属性值。","单元测试：","在测试类中添加测试方法，代码如下：","Java / @Test / public void testInsert(){ /     User user = new User(); /     user.setUsername(\"admin\"); /     user.setPassword(\"123456\"); /     user.setName(\"管理","运行结果如下："],"code":[],"tips":[]},{"id":"pb3.1.5.3","label":"增删改查操作 · 修改","text":["需求：根据ID更新用户信息","SQL：update user set username = 'zhouyu', password = '123456', name = '周瑜', age = 20 where id = 1；","Mapper接口方法：","Java / /** /  * 根据id更新用户信息 /  */ / @Update(\"update user set username = #{username},password = #{password},name = #{name},age = #{age} where id = #{id}\") / publi","单元测试：","在测试类中添加测试方法，代码如下：","Java / @Test / public void testUpdate(){ /     User user = new User(); /     user.setId(6); /     user.setUsername(\"admin666\"); /     user.setPassword(\"123456\")","运行结果如下："],"code":[],"tips":[]},{"id":"pb3.1.5.4","label":"增删改查操作 · 查询","text":["需求：根据用户名和密码查询用户信息","SQL：select* fromuser whereusername = 'zhouyu' and password = '123456'","Mapper接口方法：","Java / /** /  * 根据用户名和密码查询用户信息 /  */ / @Select(\"select * from user where username = #{username} and password = #{password}\") / public User findByUsernameAndPass","@param注解的作用是为接口的方法形参起名字的。（由于用户名唯一的，所以查询返回的结果最多只有一个，可以直接封装到一个对象中）","单元测试：","在测试类中添加测试方法，代码如下：","Java / @Test / public void testFindByUsernameAndPassword(){ /     User user = userMapper.findByUsernameAndPassword(\"admin666\", \"123456\"); /     System.out.print","运行结果如下："],"code":[],"tips":["说明：基于官方骨架创建的springboot项目中，接口编译时会保留方法形参名，@Param注解可以省略 (#{形参名})。"]},{"id":"pb3.1.6","label":"XML映射配置","text":["Mybatis的开发有两种方式："],"code":[],"tips":[]},{"id":"pb3.1.6.1","label":"XML映射配置 · XML配置文件规范","text":["使用Mybatis的注解方式，主要是来完成一些简单的增删改查功能。如果需要实现复杂的SQL功能，建议使用XML来配置映射语句，也就是将SQL语句写在XML配置文件中。","在Mybatis中使用XML映射文件方式开发，需要符合一定的规范： / XML映射文件的名称与Mapper接口名称一致，并且将XML映射文件和Mapper接口放置在相同包下（同包同名） / XML映射文件的namespace属性为Mapper接口全限定名一致 / XML映射文件中sql语句的id与Mapper接口中的方","<select>标签：就是用于编写select查询语句的。 / resultType属性，指的是查询返回的单条记录所封装的类型。"],"code":[],"tips":[]},{"id":"pb3.1.6.2","label":"XML映射配置 · XML配置文件实现","text":["第1步： 创建XML映射文件","第2步：编写XML映射文件","xml映射文件中的dtd约束，直接从mybatis官网复制即可; 或者直接AI生成。","XML / <?xml version=\"1.0\" encoding=\"UTF-8\" ?> / <!DOCTYPE mapper /   PUBLIC \"-//mybatis.org//DTD Mapper 3.0//EN\" /   \" / <mapper namespace=\"\"> /   / </mapper>","第3步：配置","a. XML映射文件的namespace属性为Mapper接口全限定名","XML / <?xml version=\"1.0\" encoding=\"UTF-8\" ?> / <!DOCTYPE mapper /         PUBLIC \"-//mybatis.org//DTD Mapper 3.0//EN\" /         \" / <mapper namespace=\"com.ithe","b. XML映射文件中sql语句的id与Mapper接口中的方法名一致，并保持返回类型一致","XML / <?xml version=\"1.0\" encoding=\"UTF-8\" ?> / <!DOCTYPE mapper /         PUBLIC \"-//mybatis.org//DTD Mapper 3.0//EN\" /         \" / <mapper namespace=\"com.ithe","resultType 属性的值，与查询返回的单条记录封装的类型一致。","运行测试类，执行结果："],"code":[],"tips":["注意：一个接口方法对应的SQL语句，要么使用注解配置，要么使用XML配置，切不可同时配置。"]},{"id":"pb3.1.6.3","label":"XML映射配置 · MybatisX的使用","text":["MybatisX是一款基于IDEA的快速开发Mybatis的插件，为效率而生。","MybatisX的安装：","可以通过MybatisX快速定位：","MybatisX的使用在后续学习中会继续分享。","学习了Mybatis中XML配置文件的开发方式了，大家可能会存在一个疑问：到底是使用注解方式开发还是使用XML方式开发？","官方说明："],"code":[],"tips":["结论：使用Mybatis的注解，主要是来完成一些简单的增删改查功能。如果需要实现复杂的SQL功能，建议使用XML来配置映射语句。"]}]}]},{"id":"cadv","label":"MySQL 进阶（补充）","chapter":"MySQL 进阶","groups":[{"id":"gadv1","label":"索引原理","points":[{"id":"padv61083177","label":"为什么用 B+ 树","text":["非叶子节点只存键值、一页能放几百个键，所以树很矮（千万级数据 3~4 层）；叶子节点用双向链表串起来，范围查询和排序不用回表遍历。"],"code":[{"note":"","sql":"-- 一次 B+ 树查找大致是 3~4 次磁盘 IO\nexplain select * from emp where id = 100;","html":"<span class=\"c\">-- 一次 B+ 树查找大致是 3~4 次磁盘 IO</span>\n<span class=\"k\">explain</span> <span class=\"k\">select</span> * <span class=\"k\">from</span> emp <span class=\"k\">where</span> id = <span class=\"n\">100</span>;"}],"tips":["注意：索引不是越多越好，每个索引都要占空间、拖慢写入"]},{"id":"padv3240541","label":"聚簇索引与二级索引","text":["InnoDB 的主键索引就是聚簇索引，叶子节点存的是整行数据；二级索引的叶子只存主键值，所以查其它列要「回表」。","一张表只能有一个聚簇索引，没主键时用第一个非空唯一索引，都没有就隐式生成 row_id。"],"code":[{"note":"","sql":"-- 主键查询：一次 B+ 树\nselect * from emp where id = 1;\n-- 二级索引查询：先查 name 索引拿到 id，再回表\nselect * from emp where name = '张三';","html":"<span class=\"c\">-- 主键查询：一次 B+ 树</span>\n<span class=\"k\">select</span> * <span class=\"k\">from</span> emp <span class=\"k\">where</span> id = <span class=\"n\">1</span>;\n<span class=\"c\">-- 二级索引查询：先查 name 索引拿到 id，再回表</span>\n<span class=\"k\">select</span> * <span class=\"k\">from</span> emp <span class=\"k\">where</span> name = <span class=\"s\">&#x27;张三&#x27;</span>;"}],"tips":[]},{"id":"padv83261379","label":"回表与覆盖索引","text":["要查的列全在索引里就不用回表，执行计划里会显示 Using index。把常用查询列放进联合索引，是性价比最高的一招。"],"code":[{"note":"","sql":"create index idx_dept_hire on emp(dept_id, hire_date);\n-- 覆盖索引：Extra 显示 Using index\nexplain select dept_id, hire_date from emp where dept_id = 1;","html":"<span class=\"k\">create</span> <span class=\"k\">index</span> idx_dept_hire <span class=\"k\">on</span> emp(dept_id, hire_date);\n<span class=\"c\">-- 覆盖索引：Extra 显示 Using index</span>\n<span class=\"k\">explain</span> <span class=\"k\">select</span> dept_id, hire_date <span class=\"k\">from</span> emp <span class=\"k\">where</span> dept_id = <span class=\"n\">1</span>;"}],"tips":["注意：select * 几乎一定会回表"]},{"id":"padv26642346","label":"联合索引与最左前缀","text":["索引 (a,b,c) 能命中 a、a,b、a,b,c；跳过 a 直接用 b 用不上索引。范围查询（>、<、between、like）会让后面的列失效。"],"code":[{"note":"","sql":"-- 能用到索引\nselect * from emp where dept_id = 1 and hire_date > '2020-01-01';\n-- 用不到（跳过了最左列）\nselect * from emp where hire_date > '2020-01-01';","html":"<span class=\"c\">-- 能用到索引</span>\n<span class=\"k\">select</span> * <span class=\"k\">from</span> emp <span class=\"k\">where</span> dept_id = <span class=\"n\">1</span> <span class=\"k\">and</span> hire_date &gt; <span class=\"s\">&#x27;2020-01-01&#x27;</span>;\n<span class=\"c\">-- 用不到（跳过了最左列）</span>\n<span class=\"k\">select</span> * <span class=\"k\">from</span> emp <span class=\"k\">where</span> hire_date &gt; <span class=\"s\">&#x27;2020-01-01&#x27;</span>;"}],"tips":[]},{"id":"padv51661149","label":"索引失效的常见场景","text":["字段上做函数或运算、隐式类型转换（字符串列传数字）、前导模糊 like '%张'、or 连接非索引列、!= 或 is not null 大范围、范围条件之后的列。"],"code":[{"note":"","sql":"-- 失效：字段上用了函数\nselect * from emp where year(hire_date) = 2020;\n-- 改写：范围条件\nselect * from emp where hire_date >= '2020-01-01' and hire_date < '2021-01-01';","html":"<span class=\"c\">-- 失效：字段上用了函数</span>\n<span class=\"k\">select</span> * <span class=\"k\">from</span> emp <span class=\"k\">where</span> year(hire_date) = <span class=\"n\">2020</span>;\n<span class=\"c\">-- 改写：范围条件</span>\n<span class=\"k\">select</span> * <span class=\"k\">from</span> emp <span class=\"k\">where</span> hire_date &gt;= <span class=\"s\">&#x27;2020-01-01&#x27;</span> <span class=\"k\">and</span> hire_date &lt; <span class=\"s\">&#x27;2021-01-01&#x27;</span>;"}],"tips":[]},{"id":"padv83675534","label":"EXPLAIN 怎么看","text":["重点看四列：type（性能 all<index<range<ref<eq_ref<const）、key（实际用到的索引）、rows（预估扫描行数）、Extra（Using index 好，Using filesort / Using temporary 要警惕）。"],"code":[{"note":"","sql":"explain select * from emp where dept_id = 1 order by hire_date desc;","html":"<span class=\"k\">explain</span> <span class=\"k\">select</span> * <span class=\"k\">from</span> emp <span class=\"k\">where</span> dept_id = <span class=\"n\">1</span> <span class=\"k\">order</span> <span class=\"k\">by</span> hire_date <span class=\"k\">desc</span>;"}],"tips":[]},{"id":"padv27048519","label":"前缀索引","text":["长字符串（如 url、邮箱）可以只索引前 N 个字符，省空间；代价是不能做覆盖索引，也无法用于 order by。"],"code":[{"note":"","sql":"alter table emp add index idx_email(email(10));","html":"<span class=\"k\">alter</span> <span class=\"k\">table</span> emp add <span class=\"k\">index</span> idx_email(email(<span class=\"n\">10</span>));"}],"tips":[]},{"id":"padv92828585","label":"索引下推 ICP","text":["MySQL 5.6+ 把 where 里能用索引判断的条件下推到存储引擎层，减少回表次数，Extra 里显示 Using index condition。"],"code":[{"note":"","sql":"explain select * from emp where name like '张%' and age = 20;","html":"<span class=\"k\">explain</span> <span class=\"k\">select</span> * <span class=\"k\">from</span> emp <span class=\"k\">where</span> name <span class=\"k\">like</span> <span class=\"s\">&#x27;张%&#x27;</span> <span class=\"k\">and</span> age = <span class=\"n\">20</span>;"}],"tips":[]}]},{"id":"gadv2","label":"事务与并发","points":[{"id":"padv49454076","label":"ACID 四个特性","text":["原子性（undo log 回滚）、一致性（约束与业务规则）、隔离性（锁 + MVCC）、持久性（redo log 刷盘）。"],"code":[],"tips":[]},{"id":"padv90176500","label":"四种隔离级别","text":["读未提交 / 读已提交 / 可重复读（InnoDB 默认）/ 串行化。级别越高越安全，并发越低。"],"code":[{"note":"","sql":"select @@transaction_isolation;\nset session transaction isolation level read committed;","html":"<span class=\"k\">select</span> @@transaction_isolation;\n<span class=\"k\">set</span> session <span class=\"k\">transaction</span> isolation level read committed;"}],"tips":["注意：多数互联网业务用「读已提交」，可减少间隙锁与死锁"]},{"id":"padv37777230","label":"脏读、不可重复读、幻读","text":["脏读=读到别人未提交的数据；不可重复读=同一事务两次读同一行结果不同；幻读=同一事务两次范围查询多出行。","可重复读靠 MVCC 解决前两个，靠间隙锁（当前读时）压制幻读。"],"code":[],"tips":["注意：快照读（普通 select）不会幻读，当前读（for update）才需要间隙锁"]},{"id":"padv53739133","label":"MVCC 怎么实现的","text":["每行有隐藏列 trx_id 和 roll_pointer，配合 undo log 组成版本链；事务开始时生成 ReadView，沿着版本链找到自己可见的那个版本。"],"code":[{"note":"","sql":"-- 快照读：不加锁，走 MVCC\nselect * from emp where id = 1;","html":"<span class=\"c\">-- 快照读：不加锁，走 MVCC</span>\n<span class=\"k\">select</span> * <span class=\"k\">from</span> emp <span class=\"k\">where</span> id = <span class=\"n\">1</span>;"}],"tips":[]},{"id":"padv64472095","label":"redo / undo / binlog 三种日志","text":["redo log 是 InnoDB 的物理日志，循环写，用于崩溃恢复；undo log 是逻辑日志，用于回滚和 MVCC；binlog 是 server 层的逻辑日志，用于归档和主从复制。"],"code":[],"tips":["注意：redo 保证持久性，undo 保证原子性，binlog 保证可复制"]},{"id":"padv60983048","label":"两阶段提交","text":["写 redo（prepare）→ 写 binlog → 写 redo（commit）。中间崩溃时，用 binlog 是否完整来决定提交还是回滚，保证两份日志一致。"],"code":[],"tips":["注意：这就是为什么 binlog 和 redo 的写入顺序不能反"]},{"id":"padv17593896","label":"长事务的危害","text":["undo log 不能及时清理导致版本链过长、占用大量空间；锁持有时间长；主从延迟变大。"],"code":[{"note":"","sql":"select * from information_schema.innodb_trx where time_to_sec(timediff(now(), trx_started)) > 60;","html":"<span class=\"k\">select</span> * <span class=\"k\">from</span> information_schema.innodb_trx <span class=\"k\">where</span> time_to_sec(timediff(<span class=\"f\">now</span>(), trx_started)) &gt; <span class=\"n\">60</span>;"}],"tips":[]}]},{"id":"gadv3","label":"锁","points":[{"id":"padv99819303","label":"锁的粒度","text":["全局锁（FTWRL，做全库逻辑备份）、表锁（MyISAM 常用）、行锁（InnoDB 默认，加在索引上）。"],"code":[],"tips":["注意：行锁加不到索引上会退化为表锁"]},{"id":"padv17782490","label":"共享锁与排他锁","text":["S 锁（读锁）之间兼容，X 锁（写锁）与任何锁都不兼容。普通 select 不加锁，for update 加 X 锁，lock in share mode 加 S 锁。"],"code":[{"note":"","sql":"-- 排他锁\nselect * from emp where id = 1 for update;\n-- 共享锁\nselect * from emp where id = 1 lock in share mode;","html":"<span class=\"c\">-- 排他锁</span>\n<span class=\"k\">select</span> * <span class=\"k\">from</span> emp <span class=\"k\">where</span> id = <span class=\"n\">1</span> <span class=\"k\">for</span> <span class=\"k\">update</span>;\n<span class=\"c\">-- 共享锁</span>\n<span class=\"k\">select</span> * <span class=\"k\">from</span> emp <span class=\"k\">where</span> id = <span class=\"n\">1</span> <span class=\"k\">lock</span> <span class=\"k\">in</span> <span class=\"k\">share</span> <span class=\"k\">mode</span>;"}],"tips":[]},{"id":"padv9812088","label":"间隙锁与临键锁","text":["可重复读下，范围更新会对区间加临键锁（记录锁 + 前面的间隙），用来防幻读；代价是并发写入容易互相阻塞。"],"code":[{"note":"","sql":"-- 会锁住 (5, 10) 这个区间\nupdate emp set salary = 1 where id between 6 and 9;","html":"<span class=\"c\">-- 会锁住 (5, 10) 这个区间</span>\n<span class=\"k\">update</span> emp <span class=\"k\">set</span> salary = <span class=\"n\">1</span> <span class=\"k\">where</span> id <span class=\"k\">between</span> <span class=\"n\">6</span> <span class=\"k\">and</span> <span class=\"n\">9</span>;"}],"tips":[]},{"id":"padv24466542","label":"死锁怎么排查","text":["两个事务互相等对方持有的锁。用 SHOW ENGINE INNODB STATUS 看 LATEST DETECTED DEADLOCK 段；预防手段：小事务、固定加锁顺序、命中索引缩小锁范围。"],"code":[{"note":"","sql":"show engine innodb status;","html":"<span class=\"k\">show</span> <span class=\"k\">engine</span> innodb status;"}],"tips":[]},{"id":"padv99552589","label":"乐观锁与悲观锁","text":["乐观锁用版本号字段在 update 时校验，失败重试；悲观锁直接 select ... for update 锁住再改。冲突少用乐观，冲突多用悲观。"],"code":[{"note":"","sql":"-- 乐观锁：带上 version 条件\nupdate emp set salary = salary + 100, version = version + 1\nwhere id = 1 and version = 3;","html":"<span class=\"c\">-- 乐观锁：带上 version 条件</span>\n<span class=\"k\">update</span> emp <span class=\"k\">set</span> salary = salary + <span class=\"n\">100</span>, version = version + <span class=\"n\">1</span>\n<span class=\"k\">where</span> id = <span class=\"n\">1</span> <span class=\"k\">and</span> version = <span class=\"n\">3</span>;"}],"tips":[]}]},{"id":"gadv4","label":"引擎与调优","points":[{"id":"padv96266953","label":"InnoDB 与 MyISAM","text":["InnoDB 支持事务、行锁、外键、MVCC、崩溃恢复；MyISAM 只有表锁、不支持事务。MySQL 5.5 之后默认 InnoDB。"],"code":[],"tips":["注意：MyISAM 已被淘汰，别再选它"]},{"id":"padv21620879","label":"主键为什么用自增 bigint","text":["自增保证顺序写入，不会造成页分裂；UUID 随机插入会频繁分裂、产生碎片。bigint 是给未来留余量。"],"code":[{"note":"","sql":"create table emp (\n  id bigint primary key auto_increment,\n  name varchar(20) not null\n) engine = InnoDB default charset = utf8mb4;","html":"<span class=\"k\">create</span> <span class=\"k\">table</span> emp (\n  id <span class=\"k\">bigint</span> <span class=\"k\">primary</span> <span class=\"k\">key</span> <span class=\"k\">auto_increment</span>,\n  name <span class=\"k\">varchar</span>(<span class=\"n\">20</span>) <span class=\"k\">not</span> <span class=\"k\">null</span>\n) <span class=\"k\">engine</span> = InnoDB <span class=\"k\">default</span> <span class=\"k\">charset</span> = utf8mb4;"}],"tips":[]},{"id":"padv56629296","label":"字符集 utf8 与 utf8mb4","text":["MySQL 的 utf8 实际是 utf8mb3（最多 3 字节），存不了 emoji；一律用 utf8mb4。"],"code":[{"note":"","sql":"create database demo default charset = utf8mb4;","html":"<span class=\"k\">create</span> <span class=\"k\">database</span> demo <span class=\"k\">default</span> <span class=\"k\">charset</span> = utf8mb4;"}],"tips":[]},{"id":"padv84966722","label":"慢查询日志","text":["打开 slow_query_log 并设置 long_query_time，用 mysqldumpslow 或 pt-query-digest 找最耗时的 SQL。"],"code":[{"note":"","sql":"set global slow_query_log = on;\nset global long_query_time = 1;\n-- 查看当前慢查询条数\nshow global status like 'Slow_queries';","html":"<span class=\"k\">set</span> global slow_query_log = <span class=\"k\">on</span>;\n<span class=\"k\">set</span> global long_query_time = <span class=\"n\">1</span>;\n<span class=\"c\">-- 查看当前慢查询条数</span>\n<span class=\"k\">show</span> global status <span class=\"k\">like</span> <span class=\"s\">&#x27;Slow_queries&#x27;</span>;"}],"tips":[]},{"id":"padv52813304","label":"深分页优化","text":["limit 100000, 10 会先扫 10 万行再丢弃。两种解法：延迟关联（先用覆盖索引取 id 再 join）或游标分页（where id > 上次最大 id）。"],"code":[{"note":"","sql":"-- 延迟关联\nselect e.* from emp e join (select id from emp order by id limit 100000, 10) t on e.id = t.id;\n-- 游标分页（推荐）\nselect * from emp where id > 100000 order by id limit 10;","html":"<span class=\"c\">-- 延迟关联</span>\n<span class=\"k\">select</span> e.* <span class=\"k\">from</span> emp e <span class=\"k\">join</span> (<span class=\"k\">select</span> id <span class=\"k\">from</span> emp <span class=\"k\">order</span> <span class=\"k\">by</span> id <span class=\"k\">limit</span> <span class=\"n\">100000</span>, <span class=\"n\">10</span>) t <span class=\"k\">on</span> e.id = t.id;\n<span class=\"c\">-- 游标分页（推荐）</span>\n<span class=\"k\">select</span> * <span class=\"k\">from</span> emp <span class=\"k\">where</span> id &gt; <span class=\"n\">100000</span> <span class=\"k\">order</span> <span class=\"k\">by</span> id <span class=\"k\">limit</span> <span class=\"n\">10</span>;"}],"tips":[]},{"id":"padv45824763","label":"批量插入优化","text":["一次 insert 多个 values、用事务包住、关闭自动提交、大批量用 load data，都比逐条插入快一个量级。"],"code":[{"note":"","sql":"insert into emp(name, dept_id) values ('a',1), ('b',2), ('c',3);\n-- 文件导入\nload data local infile '/tmp/emp.csv' into table emp fields terminated by ',';","html":"<span class=\"k\">insert</span> <span class=\"k\">into</span> emp(name, dept_id) <span class=\"k\">values</span> (<span class=\"s\">&#x27;a&#x27;</span>,<span class=\"n\">1</span>), (<span class=\"s\">&#x27;b&#x27;</span>,<span class=\"n\">2</span>), (<span class=\"s\">&#x27;c&#x27;</span>,<span class=\"n\">3</span>);\n<span class=\"c\">-- 文件导入</span>\nload data local infile <span class=\"s\">&#x27;/tmp/emp.csv&#x27;</span> <span class=\"k\">into</span> <span class=\"k\">table</span> emp fields terminated <span class=\"k\">by</span> <span class=\"s\">&#x27;,&#x27;</span>;"}],"tips":[]}]},{"id":"gadv5","label":"复制与高可用","points":[{"id":"padv22737114","label":"binlog 三种格式","text":["STATEMENT 记录 SQL、ROW 记录行变化、MIXED 混合。生产一般用 ROW，最安全、可精确还原。"],"code":[{"note":"","sql":"show variables like 'binlog_format';","html":"<span class=\"k\">show</span> variables <span class=\"k\">like</span> <span class=\"s\">&#x27;binlog_format&#x27;</span>;"}],"tips":[]},{"id":"padv10755302","label":"主从复制原理","text":["主库写 binlog → dump 线程推给从库 → 从库 IO 线程写 relay log → SQL 线程重放。从库默认是延迟的。"],"code":[{"note":"","sql":"-- 8.0 之前\nshow master status;\nchange master to master_host='192.168.1.10', master_user='repl', master_password='xxx', master_log_file='mysql-bin.000001', master_log_pos=154;\nstart slave; show slave status\\G","html":"<span class=\"c\">-- 8.0 之前</span>\n<span class=\"k\">show</span> master status;\nchange master to master_host=<span class=\"s\">&#x27;192.168.1.10&#x27;</span>, master_user=<span class=\"s\">&#x27;repl&#x27;</span>, master_password=<span class=\"s\">&#x27;xxx&#x27;</span>, master_log_file=<span class=\"s\">&#x27;mysql-bin.000001&#x27;</span>, master_log_pos=<span class=\"n\">154</span>;\n<span class=\"k\">start</span> slave; <span class=\"k\">show</span> slave status\\G"}],"tips":[]},{"id":"padv87169291","label":"读写分离与主从延迟","text":["主库写、从库读能扛读多写少，但主从延迟会导致「刚写完查不到」。解决办法：强制走主库、半同步复制、或用缓存兜住。"],"code":[],"tips":["注意：写后立刻读的场景不要走从库"]},{"id":"padv87673610","label":"分库分表的取舍","text":["垂直拆（按业务）/ 水平拆（按分片键）。能靠索引、缓存、读写分离解决的，先别拆；拆了就要面对分布式事务和跨库 join。"],"code":[],"tips":["注意：分片键选错，后期几乎无法改"]}]}]}]};
