const MYSQL = {"meta":{"title":"MySQL","chapters":5,"groups":13,"points":84,"withCode":101,"source":"课件 05/06 + 笔记 day6~7；「进阶（补充）」为通用知识，不在课件内","note":"进阶章节不是课件内容，是补齐的知识体系"},"chapters":[{"id":"ca1","label":"MySQL概述","groups":[{"id":"ga2.2","label":"连接","points":[{"id":"pa2.2.1","label":"介绍","text":["MySQL服务器启动完毕后，然后再使用如下指令，来连接MySQL服务器：","Java / mysql -u用户名 -p密码 [-h数据库服务器的IP地址 -P端口号]","-h  参数不加，默认连接的是本地 127.0.0.1 的MySQL服务器","-P  参数不加，默认连接的端口号是 3306","上述指令，可以有两种形式：","密码直接在-p参数之后直接指定 （这种方式不安全，密码直接以明文形式出现在命令行）","密码在-p回车之后，在命令行中输入密码，然后回车"],"code":[],"tips":[]},{"id":"pa2.2.2","label":"企业使用方式(了解)","text":["上述的MySQL服务器我们是安装在本地的，这个仅仅是在我们学习阶段，在真实的企业开发中，MySQL数据库服务器是不会在我们本地安装的，是在公司的服务器上安装的，而服务器还需要放置在专门的IDC机房中的，IDC机房呢，就需要保证恒温、恒湿、恒压，而且还要保证网络、电源的可靠性(备用电源及网络)。","那我们要想使用服务器上的这台MySQL服务器，就需要在我们的电脑上去远程连接这台MySQL 。 而服务器上安装的MySQL数据库呢，并不是你一个人在访问，我们项目组的其他开发人员也是需要访问这台MySQL的。","接下来，就来演示一下，通过MySQL的客户端命令行，如何来连接服务器上部署的MySQL ：","Java / mysql [-h数据库服务器的IP地址 -P端口号] -u用户名 -p密码"],"code":[],"tips":[]}]},{"id":"ga2.3","label":"数据模型","points":[{"id":"pa2.3.1","label":"关系型数据库（RDBMS）","text":["二维表的优点：","使用表存储数据，格式统一，便于维护","使用SQL语言操作，标准统一，使用方便，可用于复杂查询","我们之前提到的MySQL、Oracle、DB2、SQLServer这些都是属于关系型数据库，里面都是基于二维表存储数据的。 / 结论：基于二维表存储数据的数据库就成为关系型数据库，不是基于二维表存储数据的数据库，就是非关系型数据库（比如大家后面要学习的Redis，就属于非关系型数据库）。"],"code":[],"tips":["概念：建立在关系模型基础上，由多张相互连接的二维表组成的数据库。而所谓二维表，指的是由行和列组成的表，如下图："]},{"id":"pa2.3.2","label":"数据模型","text":["介绍完了关系型数据库之后，接下来我们再来看一看在Mysql数据库当中到底是如何来存储数据的，也就是Mysql 的数据模型。","MySQL是关系型数据库，是基于二维表进行数据存储的，具体的结构图下:","通过MySQL客户端连接数据库管理系统DBMS，然后通过DBMS操作数据库。","使用MySQL客户端，向数据库管理系统发送一条SQL语句，由数据库管理系统根据SQL语句指令去操作数据库中的表结构及数据。","一个数据库服务器中可以创建多个数据库，一个数据库中也可以包含多张表，而一张表中又可以包含多行记录。","在Mysql数据库服务器当中存储数据，你需要： / 先去创建数据库（可以创建多个数据库，之间是相互独立的） / 在数据库下再去创建数据表（一个数据库下可以创建多张表） / 再将数据存放在数据表中（一张表可以存储多行数据）"],"code":[],"tips":[]}]}]},{"id":"ca2","label":"SQL语句","groups":[{"id":"ga3.1","label":"DDL语句","points":[{"id":"pa3.1.1","label":"数据库操作","text":["我们在进行数据库设计，需要使用到刚才所介绍SQL分类中的DDL语句。","DDL英文全称是Data Definition Language(数据定义语言)，用来定义数据库对象(数据库、表)。","DDL中数据库的常见操作：查询、创建、使用、删除。"],"code":[],"tips":[]},{"id":"pa3.1.1.1","label":"数据库操作 · 查询数据库","text":["命令行中执行效果如下：","命令行中执行效果如果：","我们要操作某一个数据库，必须要切换到对应的数据库中。  / 通过指令：select  database() ，就可以查询到当前所处的数据库"],"code":[{"note":"查询所有数据库","sql":"show databases;","html":"<span class=\"k\">show</span> databases;"},{"note":"查询当前数据库","sql":"select database();","html":"<span class=\"k\">select</span> <span class=\"k\">database</span>();"}],"tips":[]},{"id":"pa3.1.1.2","label":"数据库操作 · 创建数据库","text":["创建数据库时，可以不指定字符集。 因为在MySQL8版本之后，默认的字符集就是 utf8mb4。","命令行执行效果如下：","可以使用if not exists来避免这个问题","命令行执行效果如下："],"code":[{"note":"","sql":"create database [ if not exists ] 数据库名  [default charset utf8mb4];","html":"<span class=\"k\">create</span> <span class=\"k\">database</span> [ <span class=\"k\">if</span> <span class=\"k\">not</span> <span class=\"k\">exists</span> ] 数据库名  [<span class=\"k\">default</span> <span class=\"k\">charset</span> utf8mb4];"},{"note":"案例： 创建一个itcast数据库。","sql":"create database itcast;","html":"<span class=\"k\">create</span> <span class=\"k\">database</span> itcast;"},{"note":"","sql":"-- 数据库不存在,则创建该数据库；如果存在则不创建\ncreate database if not exists itcast;","html":"<span class=\"c\">-- 数据库不存在,则创建该数据库；如果存在则不创建</span>\n<span class=\"k\">create</span> <span class=\"k\">database</span> <span class=\"k\">if</span> <span class=\"k\">not</span> <span class=\"k\">exists</span> itcast;"}],"tips":["注意：在同一个数据库服务器中，不能创建两个名称相同的数据库，否则将会报错。"]},{"id":"pa3.1.1.3","label":"数据库操作 · 使用数据库","text":["我们要操作某一个数据库下的表时，就需要通过该指令，切换到对应的数据库下，否则不能操作。","命令执行效果如下："],"code":[{"note":"","sql":"use 数据库名 ;","html":"<span class=\"k\">use</span> 数据库名 ;"},{"note":"案例：切换到itcast数据","sql":"use itcast;","html":"<span class=\"k\">use</span> itcast;"}],"tips":[]},{"id":"pa3.1.1.4","label":"数据库操作 · 删除数据库","text":["如果删除一个不存在的数据库，将会报错。","可以加上参数 if exists ，如果数据库存在，再执行删除，否则不执行删除。","命令执行效果如下："],"code":[{"note":"","sql":"drop database [ if exists ] 数据库名 ;","html":"<span class=\"k\">drop</span> <span class=\"k\">database</span> [ <span class=\"k\">if</span> <span class=\"k\">exists</span> ] 数据库名 ;"},{"note":"案例：删除itcast数据库","sql":"drop database if exists itcast; -- itcast数据库存在时删除","html":"<span class=\"k\">drop</span> <span class=\"k\">database</span> <span class=\"k\">if</span> <span class=\"k\">exists</span> itcast; <span class=\"c\">-- itcast数据库存在时删除</span>"}],"tips":["说明：上述语法中的database，也可以替换成 schema / 如：create schema db01; / 如：show schemas;"]},{"id":"pa3.1.2.1","label":"图形化工具 · 介绍","text":["前面我们讲解了DDL中关于数据库操作的SQL语句，在我们编写这些SQL时，都是在命令行当中完成的。大家在练习的时候应该也感受到了，在命令行当中来敲这些SQL语句很不方便，主要的原因有以下 3 点：","没有任何代码提示。（全靠记忆，容易敲错字母造成执行报错）","操作繁琐，影响开发效率。（所有的功能操作都是通过SQL语句来完成的）","编写过的SQL代码无法保存。","在项目开发当中，通常为了提高开发效率，都会借助于现成的图形化管理工具来操作数据库。","目前MySQL主流的图形化界面工具有以下几种：","DataGrip是JetBrains旗下的一款数据库管理工具，是管理和开发MySQL、Oracle、PostgreSQL的理想解决方案。"],"code":[],"tips":[]},{"id":"pa3.1.2.2","label":"图形化工具 · 安装","text":["安装： 参考资料中提供的《DataGrip安装手册》"],"code":[],"tips":["说明：DataGrip这款工具可以不用安装，因为Jetbrains公司已经将DataGrip这款工具的功能已经集成到了 IDEA当中，所以我们就可以使用IDEA来作为一款图形化界面工具来操作Mysql数据库。"]},{"id":"pa3.1.2.3","label":"图形化工具 · 连接数据库","text":["1). 创建Project","2). 创建连接","下载驱动, 可能会比较耗时, 耐心等待一会儿。","3). 测试连接","下载完驱动之后，可以点击 Test Connection 来测试一下是否可以正常的连接数据库。","然后点击 OK ， 就已经连接上了MySQL数据库了。","默认情况下，连接上了MySQL数据库之后， 数据库并没有全部展示出来。 需要选择要展示哪些数据库。具体操作如下："],"code":[],"tips":[]},{"id":"pa3.1.3","label":"表操作","text":["学习完了DDL语句当中关于数据库的操作之后，接下来我们继续学习DDL语句当中关于表结构的操作。","关于表结构的操作也是包含四个部分：创建表、查询表、修改表、删除表。"],"code":[],"tips":[]},{"id":"pa3.1.3.1","label":"表操作 · 创建","text":["案例：创建tb_user表","对应的结构如下：","建表语句：","数据表创建完成，接下来我们还需要测试一下是否可以往这张表结构当中来存储数据。","双击打开tb_user表结构，大家会发现里面没有数据：","添加数据：","此时我们再插入一条数据：","我们之前提到过：id字段是一行数据的唯一标识，不能有重复值。但是现在数据表中有两个相同的id值，这是为什么呢？","其实我们现在创建表结构的时候， id这个字段我们只加了一个备注信息说明它是一个唯一标识，但是在数据库层面呢，并没有去限制字段存储的数据。所以id这个字段没有起到唯一标识的作用。","想要限制字段所存储的数据，就需要用到数据库中的约束。"],"code":[{"note":"","sql":"create table  表名(\n字段1  字段1类型 [约束]  [comment  字段1注释 ],\n字段2  字段2类型 [约束]  [comment  字段2注释 ],\n......\n字段n  字段n类型 [约束]  [comment  字段n注释 ]\n) [ comment  表注释 ] ;","html":"<span class=\"k\">create</span> <span class=\"k\">table</span>  表名(\n字段1  字段1类型 [约束]  [<span class=\"k\">comment</span>  字段1注释 ],\n字段2  字段2类型 [约束]  [<span class=\"k\">comment</span>  字段2注释 ],\n......\n字段n  字段n类型 [约束]  [<span class=\"k\">comment</span>  字段n注释 ]\n) [ <span class=\"k\">comment</span>  表注释 ] ;"},{"note":"","sql":"create table tb_user (\nid int comment 'ID,唯一标识',   # id是一行数据的唯一标识（不能重复）\nusername varchar(20) comment '用户名',\nname varchar(10) comment '姓名',\nage int comment '年龄',\ngender char(1) comment '性别'\n) comment '用户表';","html":"<span class=\"k\">create</span> <span class=\"k\">table</span> tb_user (\nid <span class=\"k\">int</span> <span class=\"k\">comment</span> <span class=\"s\">&#x27;ID,唯一标识&#x27;</span>,   <span class=\"c\"># id是一行数据的唯一标识（不能重复）</span>\nusername <span class=\"k\">varchar</span>(<span class=\"n\">20</span>) <span class=\"k\">comment</span> <span class=\"s\">&#x27;用户名&#x27;</span>,\nname <span class=\"k\">varchar</span>(<span class=\"n\">10</span>) <span class=\"k\">comment</span> <span class=\"s\">&#x27;姓名&#x27;</span>,\nage <span class=\"k\">int</span> <span class=\"k\">comment</span> <span class=\"s\">&#x27;年龄&#x27;</span>,\ngender <span class=\"k\">char</span>(<span class=\"n\">1</span>) <span class=\"k\">comment</span> <span class=\"s\">&#x27;性别&#x27;</span>\n) <span class=\"k\">comment</span> <span class=\"s\">&#x27;用户表&#x27;</span>;"}],"tips":["注意： [ ] 中的内容为可选参数； 最后一个字段后面没有逗号"]},{"id":"pa3.1.3.2","label":"表操作 · 约束","text":["在MySQL数据库当中，提供了以下5种约束：","案例：创建tb_user表，对应的结构如下：","在上述的表结构中:","id 是一行数据的 唯一标识","username 用户名字段是非空且唯一的","name 姓名字段是不允许存储空值的","gender 性别字段是有默认值，默认为男","建表语句：","数据表创建完成，接下来测试一下表中字段上的约束是否生效","大家有没有发现一个问题：id字段下存储的值，如果由我们自己来维护会比较麻烦(必须保证值的唯一性)。MySQL数据库为了解决这个问题，给我们提供了一个关键字：auto_increment（自动增长）","主键自增：auto_increment / 每次插入新的行记录时，数据库自动生成id字段(主键)下的值 / 具有auto_increment的数据列是一个正数序列开始增长(从1开始自增)","测试主键自增："],"code":[{"note":"","sql":"create table tb_user (\nid int primary key comment 'ID,唯一标识',\nusername varchar(20) not null unique comment '用户名',\nname varchar(10) not null comment '姓名',\nage int comment '年龄',\ngender char(1) default '男' comment '性别'\n) comment '用户表';","html":"<span class=\"k\">create</span> <span class=\"k\">table</span> tb_user (\nid <span class=\"k\">int</span> <span class=\"k\">primary</span> <span class=\"k\">key</span> <span class=\"k\">comment</span> <span class=\"s\">&#x27;ID,唯一标识&#x27;</span>,\nusername <span class=\"k\">varchar</span>(<span class=\"n\">20</span>) <span class=\"k\">not</span> <span class=\"k\">null</span> <span class=\"k\">unique</span> <span class=\"k\">comment</span> <span class=\"s\">&#x27;用户名&#x27;</span>,\nname <span class=\"k\">varchar</span>(<span class=\"n\">10</span>) <span class=\"k\">not</span> <span class=\"k\">null</span> <span class=\"k\">comment</span> <span class=\"s\">&#x27;姓名&#x27;</span>,\nage <span class=\"k\">int</span> <span class=\"k\">comment</span> <span class=\"s\">&#x27;年龄&#x27;</span>,\ngender <span class=\"k\">char</span>(<span class=\"n\">1</span>) <span class=\"k\">default</span> <span class=\"s\">&#x27;男&#x27;</span> <span class=\"k\">comment</span> <span class=\"s\">&#x27;性别&#x27;</span>\n) <span class=\"k\">comment</span> <span class=\"s\">&#x27;用户表&#x27;</span>;"},{"note":"","sql":"create table tb_user (\nid int primary key auto_increment comment 'ID,唯一标识', #主键自动增长\nusername varchar(20) not null unique comment '用户名',\nname varchar(10) not null comment '姓名',\nage int comment '年龄',\ngender char(1) default '男' comment '性别'\n) comment '用户表';","html":"<span class=\"k\">create</span> <span class=\"k\">table</span> tb_user (\nid <span class=\"k\">int</span> <span class=\"k\">primary</span> <span class=\"k\">key</span> <span class=\"k\">auto_increment</span> <span class=\"k\">comment</span> <span class=\"s\">&#x27;ID,唯一标识&#x27;</span>, <span class=\"c\">#主键自动增长</span>\nusername <span class=\"k\">varchar</span>(<span class=\"n\">20</span>) <span class=\"k\">not</span> <span class=\"k\">null</span> <span class=\"k\">unique</span> <span class=\"k\">comment</span> <span class=\"s\">&#x27;用户名&#x27;</span>,\nname <span class=\"k\">varchar</span>(<span class=\"n\">10</span>) <span class=\"k\">not</span> <span class=\"k\">null</span> <span class=\"k\">comment</span> <span class=\"s\">&#x27;姓名&#x27;</span>,\nage <span class=\"k\">int</span> <span class=\"k\">comment</span> <span class=\"s\">&#x27;年龄&#x27;</span>,\ngender <span class=\"k\">char</span>(<span class=\"n\">1</span>) <span class=\"k\">default</span> <span class=\"s\">&#x27;男&#x27;</span> <span class=\"k\">comment</span> <span class=\"s\">&#x27;性别&#x27;</span>\n) <span class=\"k\">comment</span> <span class=\"s\">&#x27;用户表&#x27;</span>;"}],"tips":["概念：所谓约束就是作用在表中字段上的规则，用于限制存储在表中的数据。","作用：就是来保证数据库当中数据的正确性、有效性和完整性。（后面的学习会验证这些）","注意：约束是作用于表中字段上的，可以在创建表/修改表的时候添加约束。"]},{"id":"pa3.1.3.3","label":"表操作 · 数据类型","text":["在上面建表语句中，我们在指定字段的数据类型时，用到了int 、varchar、char，那么在MySQL中除了以上的数据类型，还有哪些常见的数据类型呢？ 接下来,我们就来详细介绍一下MySQL的数据类型。","MySQL中的数据类型有很多，主要分为三类：数值类型、字符串类型、日期时间类型。","1). 数值类型","2). 字符串类型","char 与 varchar 都可以描述字符串，char是定长字符串，指定长度多长，就占用多少个字符，和字段值的长度无关 。而varchar是变长字符串，指定的长度为最大占用长度 。相对来说，char的性能会更高些。","3). 日期时间类型"],"code":[{"note":"","sql":"-- 年龄字段 ---不会出现负数, 而且人的年龄不会太大\nage tinyint unsigned\n-- 分数 ---总分100分, 最多出现一位小数\nscore double(4,1)","html":"<span class=\"c\">-- 年龄字段 ---不会出现负数, 而且人的年龄不会太大</span>\nage tinyint unsigned\n<span class=\"c\">-- 分数 ---总分100分, 最多出现一位小数</span>\nscore double(<span class=\"n\">4</span>,<span class=\"n\">1</span>)"},{"note":"","sql":"示例：\n用户名 username ---长度不定, 最长不会超过50\nusername varchar(50)\n手机号 phone ---固定长度为11\nphone char(11)","html":"示例：\n用户名 username <span class=\"c\">---长度不定, 最长不会超过50</span>\nusername <span class=\"k\">varchar</span>(<span class=\"n\">50</span>)\n手机号 phone <span class=\"c\">---固定长度为11</span>\nphone <span class=\"k\">char</span>(<span class=\"n\">11</span>)"},{"note":"","sql":"示例:\n生日字段  birthday ---生日只需要年月日\nbirthday date\n创建时间 createtime --- 需要精确到时分秒\ncreatetime  datetime","html":"示例:\n生日字段  birthday <span class=\"c\">---生日只需要年月日</span>\nbirthday date\n创建时间 createtime <span class=\"c\">--- 需要精确到时分秒</span>\ncreatetime  <span class=\"k\">datetime</span>"}],"tips":[]},{"id":"pa3.1.3.4","label":"表操作 · 表结构设计-案例","text":["需求：根据产品原型/需求创建表((设计合理的数据类型、长度、约束)","参考资料中提供的《黑马-tlias智能学习辅助系统》页面原型，设计员工管理模块的表结构。  暂不考虑所属部门及工作经历字段。","产品原型及需求如下：","1). 列表展示","2). 新增员工","3). 需求说明及字段限制","阅读产品原型及需求文档，看看里面涉及到哪些字段。","查看需求文档说明，确认各个字段的类型以及字段存储数据的长度限制。","在页面原型中描述的基础字段的基础上，再增加额外的基础字段。","使用SQL创建表：","除了使用SQL语句创建表外，我们还可以借助于图形化界面来创建表结构，这种创建方式会更加直观、更加方便。","设计表流程： / 阅读页面原型及需求文档 / 基于页面原则和需求文档，确定原型字段(类型、长度限制、约束) / 再增加表设计所需要的业务基础字段(id、create_time、update_time) / create_time：记录的是当前这条数据插入的时间。  / update_time：记录当前这条数据最后更新的"],"code":[{"note":"","sql":"create table emp(\nid int unsigned primary key auto_increment comment 'ID,主键',\nusername varchar(20) not null unique comment '用户名',\npassword varchar(32) not null comment '密码',\nname varchar(10) not null comment '姓名',\ngender tinyint unsigned not null comment '性别, 1:男, 2:女',\nphone char(11) not null unique comment '手机号',\njob tinyint unsigned comment '职位, 1:班主任,2:讲师,3:学工主管,4:教研主管,5:咨询师',\nsalary int unsigned comment '薪资',\nimage varchar(255) comment '头像',\nentry_date date comment '入职日期',\ncreate_time datetime comment '创建时间',\nupdate_time datetime comment '修改时间'\n) comment '员工表';","html":"<span class=\"k\">create</span> <span class=\"k\">table</span> emp(\nid <span class=\"k\">int</span> unsigned <span class=\"k\">primary</span> <span class=\"k\">key</span> <span class=\"k\">auto_increment</span> <span class=\"k\">comment</span> <span class=\"s\">&#x27;ID,主键&#x27;</span>,\nusername <span class=\"k\">varchar</span>(<span class=\"n\">20</span>) <span class=\"k\">not</span> <span class=\"k\">null</span> <span class=\"k\">unique</span> <span class=\"k\">comment</span> <span class=\"s\">&#x27;用户名&#x27;</span>,\npassword <span class=\"k\">varchar</span>(<span class=\"n\">32</span>) <span class=\"k\">not</span> <span class=\"k\">null</span> <span class=\"k\">comment</span> <span class=\"s\">&#x27;密码&#x27;</span>,\nname <span class=\"k\">varchar</span>(<span class=\"n\">10</span>) <span class=\"k\">not</span> <span class=\"k\">null</span> <span class=\"k\">comment</span> <span class=\"s\">&#x27;姓名&#x27;</span>,\ngender tinyint unsigned <span class=\"k\">not</span> <span class=\"k\">null</span> <span class=\"k\">comment</span> <span class=\"s\">&#x27;性别, 1:男, 2:女&#x27;</span>,\nphone <span class=\"k\">char</span>(<span class=\"n\">11</span>) <span class=\"k\">not</span> <span class=\"k\">null</span> <span class=\"k\">unique</span> <span class=\"k\">comment</span> <span class=\"s\">&#x27;手机号&#x27;</span>,\njob tinyint unsigned <span class=\"k\">comment</span> <span class=\"s\">&#x27;职位, 1:班主任,2:讲师,3:学工主管,4:教研主管,5:咨询师&#x27;</span>,\nsalary <span class=\"k\">int</span> unsigned <span class=\"k\">comment</span> <span class=\"s\">&#x27;薪资&#x27;</span>,\nimage <span class=\"k\">varchar</span>(<span class=\"n\">255</span>) <span class=\"k\">comment</span> <span class=\"s\">&#x27;头像&#x27;</span>,\nentry_date date <span class=\"k\">comment</span> <span class=\"s\">&#x27;入职日期&#x27;</span>,\ncreate_time <span class=\"k\">datetime</span> <span class=\"k\">comment</span> <span class=\"s\">&#x27;创建时间&#x27;</span>,\nupdate_time <span class=\"k\">datetime</span> <span class=\"k\">comment</span> <span class=\"s\">&#x27;修改时间&#x27;</span>\n) <span class=\"k\">comment</span> <span class=\"s\">&#x27;员工表&#x27;</span>;"}],"tips":[]},{"id":"pa3.1.3.5","label":"表操作 · 表操作-其他操作","text":["上面讲解了表结构的创建、数据类型、设计表的流程，接下来，再来讲解表结构的查询、修改、删除操作 。","修改数据库表结构的具体语法：","添加字段","关于表结构的查看、修改、删除操作，工作中一般都是直接基于图形化界面操作。"],"code":[{"note":"查询数据库表的具体的语法：","sql":"-- 查询当前数据库的所有表\nshow tables;\n-- 查看指定的表结构\ndesc 表名 ;   -- 可以查看指定表的字段、字段的类型、是否可以为NULL、是否存在默认值等信息\n-- 查询指定表的建表语句\nshow create table 表名 ;","html":"<span class=\"c\">-- 查询当前数据库的所有表</span>\n<span class=\"k\">show</span> tables;\n<span class=\"c\">-- 查看指定的表结构</span>\n<span class=\"k\">desc</span> 表名 ;   <span class=\"c\">-- 可以查看指定表的字段、字段的类型、是否可以为NULL、是否存在默认值等信息</span>\n<span class=\"c\">-- 查询指定表的建表语句</span>\n<span class=\"k\">show</span> <span class=\"k\">create</span> <span class=\"k\">table</span> 表名 ;"},{"note":"","sql":"-- 添加字段\nalter table 表名 add  字段名  类型(长度)  [comment 注释]  [约束];\n-- 比如： 为tb_emp表添加字段qq，字段类型为 varchar(11)\nalter table tb_emp add  qq  varchar(11) comment 'QQ号码';","html":"<span class=\"c\">-- 添加字段</span>\n<span class=\"k\">alter</span> <span class=\"k\">table</span> 表名 add  字段名  类型(长度)  [<span class=\"k\">comment</span> 注释]  [约束];\n<span class=\"c\">-- 比如： 为tb_emp表添加字段qq，字段类型为 varchar(11)</span>\n<span class=\"k\">alter</span> <span class=\"k\">table</span> tb_emp add  qq  <span class=\"k\">varchar</span>(<span class=\"n\">11</span>) <span class=\"k\">comment</span> <span class=\"s\">&#x27;QQ号码&#x27;</span>;"},{"note":"修改字段","sql":"-- 修改字段类型\nalter table 表名 modify  字段名  新数据类型(长度);\n-- 比如： 修改qq字段的字段类型，将其长度由11修改为13\nalter table tb_emp modify qq varchar(13) comment 'QQ号码';","html":"<span class=\"c\">-- 修改字段类型</span>\n<span class=\"k\">alter</span> <span class=\"k\">table</span> 表名 modify  字段名  新数据类型(长度);\n<span class=\"c\">-- 比如： 修改qq字段的字段类型，将其长度由11修改为13</span>\n<span class=\"k\">alter</span> <span class=\"k\">table</span> tb_emp modify qq <span class=\"k\">varchar</span>(<span class=\"n\">13</span>) <span class=\"k\">comment</span> <span class=\"s\">&#x27;QQ号码&#x27;</span>;"},{"note":"","sql":"-- 修改字段名，字段类型\nalter table 表名 change  旧字段名  新字段名  类型(长度)  [comment 注释]  [约束];\n-- 比如： 修改qq字段名为 qq_num，字段类型varchar(13)\nalter table tb_emp change qq qq_num varchar(13) comment 'QQ号码';","html":"<span class=\"c\">-- 修改字段名，字段类型</span>\n<span class=\"k\">alter</span> <span class=\"k\">table</span> 表名 change  旧字段名  新字段名  类型(长度)  [<span class=\"k\">comment</span> 注释]  [约束];\n<span class=\"c\">-- 比如： 修改qq字段名为 qq_num，字段类型varchar(13)</span>\n<span class=\"k\">alter</span> <span class=\"k\">table</span> tb_emp change qq qq_num <span class=\"k\">varchar</span>(<span class=\"n\">13</span>) <span class=\"k\">comment</span> <span class=\"s\">&#x27;QQ号码&#x27;</span>;"},{"note":"删除字段","sql":"-- 删除字段\nalter table 表名 drop 字段名;\n-- 比如： 删除tb_emp表中的qq_num字段\nalter table tb_emp drop qq_num;","html":"<span class=\"c\">-- 删除字段</span>\n<span class=\"k\">alter</span> <span class=\"k\">table</span> 表名 <span class=\"k\">drop</span> 字段名;\n<span class=\"c\">-- 比如： 删除tb_emp表中的qq_num字段</span>\n<span class=\"k\">alter</span> <span class=\"k\">table</span> tb_emp <span class=\"k\">drop</span> qq_num;"},{"note":"修改表名","sql":"-- 修改表名\nrename table 表名 to  新表名;\n-- 比如: 将当前的emp表的表名修改为tb_emp\nrename table emp to tb_emp;","html":"<span class=\"c\">-- 修改表名</span>\nrename <span class=\"k\">table</span> 表名 to  新表名;\n<span class=\"c\">-- 比如: 将当前的emp表的表名修改为tb_emp</span>\nrename <span class=\"k\">table</span> emp to tb_emp;"},{"note":"删除表结构","sql":"-- 删除表\ndrop  table [ if exists ]  表名;\n-- 比如：如果tb_emp表存在，则删除tb_emp表\ndrop table if exists tb_emp;  -- 在删除表时，表中的全部数据也会被删除。","html":"<span class=\"c\">-- 删除表</span>\n<span class=\"k\">drop</span>  <span class=\"k\">table</span> [ <span class=\"k\">if</span> <span class=\"k\">exists</span> ]  表名;\n<span class=\"c\">-- 比如：如果tb_emp表存在，则删除tb_emp表</span>\n<span class=\"k\">drop</span> <span class=\"k\">table</span> <span class=\"k\">if</span> <span class=\"k\">exists</span> tb_emp;  <span class=\"c\">-- 在删除表时，表中的全部数据也会被删除。</span>"}],"tips":[]}]},{"id":"ga3.2","label":"DML语句","points":[{"id":"pa3.2.1.1","label":"增加 · 语法","text":["向指定字段添加数据","全部字段添加数据","批量添加数据（指定字段）","批量添加数据（全部字段）"],"code":[{"note":"","sql":"insert into 表名 (字段名1, 字段名2) values (值1, 值2);","html":"<span class=\"k\">insert</span> <span class=\"k\">into</span> 表名 (字段名1, 字段名2) <span class=\"k\">values</span> (值1, 值2);"},{"note":"","sql":"insert into 表名 values (值1, 值2, ...);","html":"<span class=\"k\">insert</span> <span class=\"k\">into</span> 表名 <span class=\"k\">values</span> (值1, 值2, ...);"},{"note":"","sql":"insert into 表名 (字段名1, 字段名2) values (值1, 值2), (值1, 值2);","html":"<span class=\"k\">insert</span> <span class=\"k\">into</span> 表名 (字段名1, 字段名2) <span class=\"k\">values</span> (值1, 值2), (值1, 值2);"},{"note":"","sql":"insert into 表名 values (值1, 值2, ...), (值1, 值2, ...);","html":"<span class=\"k\">insert</span> <span class=\"k\">into</span> 表名 <span class=\"k\">values</span> (值1, 值2, ...), (值1, 值2, ...);"}],"tips":[]},{"id":"pa3.2.1.2","label":"增加 · 案例演示","text":["insert操作的注意事项： / 插入数据时，指定的字段顺序需要与值的顺序是一一对应的。 / 字符串和日期型数据应该包含在引号中。 / 插入的数据大小，应该在字段的规定范围内。"],"code":[{"note":"案例1：向emp表的username, name, gender, phone, create_time, update_time字段插入数据","sql":"-- 因为设计表时create_time, update_time两个字段不能为NULL，所以也做为要插入的字段\ninsert into emp(username, name, gender, phone, create_time, update_time)\nvalues ('wuji', '张无忌', 1, '13309091231', now(), now());","html":"<span class=\"c\">-- 因为设计表时create_time, update_time两个字段不能为NULL，所以也做为要插入的字段</span>\n<span class=\"k\">insert</span> <span class=\"k\">into</span> emp(username, name, gender, phone, create_time, update_time)\n<span class=\"k\">values</span> (<span class=\"s\">&#x27;wuji&#x27;</span>, <span class=\"s\">&#x27;张无忌&#x27;</span>, <span class=\"n\">1</span>, <span class=\"s\">&#x27;13309091231&#x27;</span>, <span class=\"f\">now</span>(), <span class=\"f\">now</span>());"},{"note":"案例2：向temp表的所有字段插入数据","sql":"insert into emp2(id, username, password, name, gender, phone, job, salary, image, entry_date, create_time, update_time)\nvalues (1,'shinaian','123456','施耐庵',1,'13309090001',4,15000,'1.jpg','2000-01-01',now(),now()),","html":"<span class=\"k\">insert</span> <span class=\"k\">into</span> emp2(id, username, password, name, gender, phone, job, salary, image, entry_date, create_time, update_time)\n<span class=\"k\">values</span> (<span class=\"n\">1</span>,<span class=\"s\">&#x27;shinaian&#x27;</span>,<span class=\"s\">&#x27;123456&#x27;</span>,<span class=\"s\">&#x27;施耐庵&#x27;</span>,<span class=\"n\">1</span>,<span class=\"s\">&#x27;13309090001&#x27;</span>,<span class=\"n\">4</span>,<span class=\"n\">15000</span>,<span class=\"s\">&#x27;1.jpg&#x27;</span>,<span class=\"s\">&#x27;2000-01-01&#x27;</span>,<span class=\"f\">now</span>(),<span class=\"f\">now</span>()),"},{"note":"案例3：批量向emp表的username、name、gender字段插入数据","sql":"insert into emp(username, name, gender, phone, create_time, update_time)\nvalues ('Tom1', '汤姆1', 1, '13309091231', now(), now()),\n('Tom2', '汤姆2', 1, '13309091232', now(), now());","html":"<span class=\"k\">insert</span> <span class=\"k\">into</span> emp(username, name, gender, phone, create_time, update_time)\n<span class=\"k\">values</span> (<span class=\"s\">&#x27;Tom1&#x27;</span>, <span class=\"s\">&#x27;汤姆1&#x27;</span>, <span class=\"n\">1</span>, <span class=\"s\">&#x27;13309091231&#x27;</span>, <span class=\"f\">now</span>(), <span class=\"f\">now</span>()),\n(<span class=\"s\">&#x27;Tom2&#x27;</span>, <span class=\"s\">&#x27;汤姆2&#x27;</span>, <span class=\"n\">1</span>, <span class=\"s\">&#x27;13309091232&#x27;</span>, <span class=\"f\">now</span>(), <span class=\"f\">now</span>());"}],"tips":[]},{"id":"pa3.2.2.1","label":"修改 · 语法","text":[],"code":[{"note":"","sql":"update 表名 set 字段名1 = 值1 , 字段名2 = 值2 , .... [where 条件] ;","html":"<span class=\"k\">update</span> 表名 <span class=\"k\">set</span> 字段名1 = 值1 , 字段名2 = 值2 , .... [<span class=\"k\">where</span> 条件] ;"}],"tips":[]},{"id":"pa3.2.2.2","label":"修改 · 案例演示","text":[],"code":[{"note":"案例1：将emp表中id为1的员工，姓名name字段更新为'张三'","sql":"update emp set name='张三', update_time=now() where id=1;","html":"<span class=\"k\">update</span> emp <span class=\"k\">set</span> name=<span class=\"s\">&#x27;张三&#x27;</span>, update_time=<span class=\"f\">now</span>() <span class=\"k\">where</span> id=<span class=\"n\">1</span>;"},{"note":"案例2：将emp表的所有员工入职日期更新为'2010-01-01'","sql":"update emp set entry_date='2010-01-01', update_time=now();","html":"<span class=\"k\">update</span> emp <span class=\"k\">set</span> entry_date=<span class=\"s\">&#x27;2010-01-01&#x27;</span>, update_time=<span class=\"f\">now</span>();"}],"tips":["注意事项: / 修改语句的条件可以有，也可以没有，如果没有条件，则会修改整张表的所有数据。 / 在修改数据时，一般需要同时修改公共字段update_time，将其修改为当前操作时间。"]},{"id":"pa3.2.3.1","label":"删除 · 语法","text":[],"code":[{"note":"","sql":"delete from 表名  [where  条件] ;","html":"<span class=\"k\">delete</span> <span class=\"k\">from</span> 表名  [<span class=\"k\">where</span>  条件] ;"}],"tips":[]},{"id":"pa3.2.3.2","label":"删除 · 案例演示","text":[],"code":[{"note":"案例1：删除emp表中id为1的员工","sql":"delete from emp where id = 1;","html":"<span class=\"k\">delete</span> <span class=\"k\">from</span> emp <span class=\"k\">where</span> id = <span class=\"n\">1</span>;"},{"note":"案例2：删除emp表中所有员工","sql":"delete from tb_emp;","html":"<span class=\"k\">delete</span> <span class=\"k\">from</span> tb_emp;"}],"tips":["注意事项: / DELETE 语句的条件可以有，也可以没有，如果没有条件，则会删除整张表的所有数据。 / DELETE 语句不能删除某一个字段的值(可以使用UPDATE，将该字段值置为NULL即可)。 / 当进行删除全部数据操作时，会提示询"]}]},{"id":"ga3.3","label":"DQL语句","points":[{"id":"pa3.3.1","label":"介绍","text":["DQL英文全称是Data Query Language(数据查询语言)，用来查询数据库表中的记录。","查询关键字：SELECT","查询操作是所有SQL语句当中最为常见，也是最为重要的操作。在一个正常的业务系统中，查询操作的使用频次是要远高于增删改操作的。当我们打开某个网站或APP所看到的展示信息，都是通过从数据库中查询得到的，而在这个查询过程中，还会涉及到条件、排序、分页等操作。"],"code":[],"tips":[]},{"id":"pa3.3.2","label":"语法","text":["DQL查询语句，语法结构如下：","我们今天会将上面的完整语法拆分为以下几个部分学习：","基本查询（不带任何条件）","条件查询（where）","分组查询（group by）","排序查询（order by）","分页查询（limit）","准备一些测试数据用于查询操作："],"code":[{"note":"","sql":"SELECT\n字段列表\nFROM\n表名列表\nWHERE\n条件列表\nGROUP  BY\n分组字段列表\nHAVING\n分组后条件列表\nORDER BY\n排序字段列表\nLIMIT\n分页参数","html":"<span class=\"k\">SELECT</span>\n字段列表\n<span class=\"k\">FROM</span>\n表名列表\n<span class=\"k\">WHERE</span>\n条件列表\n<span class=\"k\">GROUP</span>  <span class=\"k\">BY</span>\n分组字段列表\n<span class=\"k\">HAVING</span>\n分组后条件列表\n<span class=\"k\">ORDER</span> <span class=\"k\">BY</span>\n排序字段列表\n<span class=\"k\">LIMIT</span>\n分页参数"},{"note":"","sql":"create table emp(\nid int unsigned primary key auto_increment comment 'ID,主键',\nusername varchar(20) not null unique comment '用户名',\npassword varchar(32) not null comment '密码',\nname varchar(10) not null comment '姓名',\ngender tinyint unsigned not null comment '性别, 1:男, 2:女',\nphone char(11) not null unique comment '手机号',\njob tinyint unsigned comment '职位, 1:班主任,2:讲师,3:学工主管,4:教研主管,5:咨询师',\nsalary int unsigned comment '薪资',\nimage varchar(300) comment '头像',\nentry_date date comment '入职日期',\ncreate_time datetime comment '创建时间',\nupdate_time datetime comment '修改时间'\n) comment '员工表';\n-- 准备测试数据\nINSERT INTO emp(id, username, password, name, gender, phone, job, salary, image, entry_date, create_time, update_time)\nVALUES (1,'shinaian','123456','施耐庵',1,'13309090001',4,15000,'1.jpg','2000-01-01','2024-04-11 16:35:33','2024-04-11 16:35:35'),\n(2,'songjiang','123456','宋江',1,'13309090002',2,8600,'2.jpg','2015-01-01','2024-04-11 16:35:33','2024-04-11 16:35:37'),\n(3,'lujunyi','123456','卢俊义',1,'13309090003',2,8900,'3.jpg','2008-05-01','2024-04-11 16:35:33','2024-04-11 16:35:39'),\n(4,'wuyong','123456','吴用',1,'13309090004',2,9200,'4.jpg','2007-01-01','2024-04-11 16:35:33','2024-04-11 16:35:41'),\n(5,'gongsunsheng','123456','公孙胜',1,'13309090005',2,9500,'5.jpg','2012-12-05','2024-04-11 16:35:33','2024-04-11 16:35:43'),\n(6,'huosanniang','123456','扈三娘',2,'13309090006',3,6500,'6.jpg','2013-09-05','2024-04-11 16:35:33','2024-04-11 16:35:45'),\n(7,'chaijin','123456','柴进',1,'13309090007',1,4700,'7.jpg','2005-08-01','2024-04-11 16:35:33','2024-04-11 16:35:47'),\n(8,'likui','123456','李逵',1,'13309090008',1,4800,'8.jpg','2014-11-09','2024-04-11 16:35:33','2024-04-11 16:35:49'),\n(9,'wusong','123456','武松',1,'13309090009',1,4900,'9.jpg','2011-03-11','2024-04-11 16:35:33','2024-04-11 16:35:51'),\n(10,'lichong','123456','林冲',1,'13309090010',1,5000,'10.jpg','2013-09-05','2024-04-11 16:35:33','2024-04-11 16:35:53'),\n(11,'huyanzhuo','123456','呼延灼',1,'13309090011',2,9700,'11.jpg','2007-02-01','2024-04-11 16:35:33','2024-04-11 16:35:55'),\n(12,'xiaoliguang','123456','小李广',1,'13309090012',2,10000,'12.jpg','2008-08-18','2024-04-11 16:35:33','2024-04-11 16:35:57'),\n(13,'yangzhi','123456','杨志',1,'13309090013',1,5300,'13.jpg','2012-11-01','2024-04-11 16:35:33','2024-04-11 16:35:59'),\n(14,'shijin','123456','史进',1,'13309090014',2,10600,'14.jpg','2002-08-01','2024-04-11 16:35:33','2024-04-11 16:36:01'),\n(15,'sunerniang','123456','孙二娘',2,'13309090015',2,10900,'15.jpg','2011-05-01','2024-04-11 16:35:33','2024-04-11 16:36:03'),\n(16,'luzhishen','123456','鲁智深',1,'13309090016',2,9600,'16.jpg','2010-01-01','2024-04-11 16:35:33','2024-04-11 16:36:05'),\n(17,'liying','12345678','李应',1,'13309090017',1,5800,'17.jpg','2015-03-21','2024-04-11 16:35:33','2024-04-11 16:36:07'),\n(18,'shiqian','123456','时迁',1,'13309090018',2,10200,'18.jpg','2015-01-01','2024-04-11 16:35:33','2024-04-11 16:36:09'),\n(19,'gudasao','123456','顾大嫂',2,'13309090019',2,10500,'19.jpg','2008-01-01','2024-04-11 16:35:33','2024-04-11 16:36:11'),\n(20,'ruanxiaoer','123456','阮小二',1,'13309090020',2,10800,'20.jpg','2018-01-01','2024-04-11 16:35:33','2024-04-11 16:36:13'),\n(21,'ruanxiaowu','123456','阮小五',1,'13309090021',5,5200,'21.jpg','2015-01-01','2024-04-11 16:35:33','2024-04-11 16:36:15'),\n(22,'ruanxiaoqi','123456','阮小七',1,'13309090022',5,5500,'22.jpg','2016-01-01','2024-04-11 16:35:33','2024-04-11 16:36:17'),\n(23,'ruanji','123456','阮籍',1,'13309090023',5,5800,'23.jpg','2012-01-01','2024-04-11 16:35:33','2024-04-11 16:36:19'),\n(24,'tongwei','123456','童威',1,'13309090024',5,5000,'24.jpg','2006-01-01','2024-04-11 16:35:33','2024-04-11 16:36:21'),\n(25,'tongmeng','123456','童猛',1,'13309090025',5,4800,'25.jpg','2002-01-01','2024-04-11 16:35:33','2024-04-11 16:36:23'),\n(26,'yanshun','123456','燕顺',1,'13309090026',5,5400,'26.jpg','2011-01-01','2024-04-11 16:35:33','2024-04-11 16:36:25'),\n(27,'lijun','123456','李俊',1,'13309090027',5,6600,'27.jpg','2004-01-01','2024-04-11 16:35:33','2024-04-11 16:36:27'),\n(28,'lizhong','123456','李忠',1,'13309090028',5,5000,'28.jpg','2007-01-01','2024-04-11 16:35:33','2024-04-11 16:36:29'),\n(29,'songqing','123456','宋清',1,'13309090029',5,5100,'29
