<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>二阶魔方 DQN · 技术细节版（10 层知识树）</title>
<style>
  :root{
    --bg:#faf9f6; --ink:#111827; --muted:#6b7280;
    --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",system-ui,-apple-system,"Segoe UI",sans-serif;
    --shadow:0 1px 2px rgba(17,24,39,.05),0 10px 30px rgba(17,24,39,.07);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font);
    background-image:radial-gradient(circle at 1px 1px,#e6e3dc 1px,transparent 0);
    background-size:24px 24px;
  }
  #app{position:fixed;inset:0}

  .topbar{
    position:fixed;top:0;left:0;right:0;height:60px;z-index:20;
    display:flex;align-items:center;gap:16px;padding:0 20px;
    background:linear-gradient(180deg,rgba(250,249,246,.97),rgba(250,249,246,.80));
    backdrop-filter:blur(10px); border-bottom:1px solid #e8e5de;
  }
  .brand{display:flex;align-items:baseline;gap:9px}
  .brand h1{margin:0;font-size:15.5px;font-weight:800;letter-spacing:.3px}
  .brand .sub{font-size:11px;color:var(--muted);letter-spacing:.4px}
  .spacer{flex:1}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  button{
    font-family:inherit;font-size:12px;font-weight:600;color:#374151;
    background:#fff;border:1px solid #dedad2;padding:6px 10px;border-radius:7px;
    cursor:pointer;transition:.14s;box-shadow:0 1px 1px rgba(17,24,39,.03);
  }
  button:hover{background:#f2efe9;border-color:#c9c4ba}
  .zoom{display:flex;align-items:center;border:1px solid #dedad2;border-radius:7px;overflow:hidden;background:#fff}
  .zoom button{border:0;border-radius:0;box-shadow:none;padding:6px 9px}
  .zoom .val{font-size:11px;color:var(--muted);padding:0 7px;min-width:42px;text-align:center}

  svg#map{width:100%;height:100%;display:block;cursor:grab}
  svg#map.dragging{cursor:grabbing}
  .node text{font-family:var(--font);dominant-baseline:middle;pointer-events:none}
  .node{cursor:pointer}

  .hint{
    position:fixed;left:20px;bottom:14px;z-index:20;font-size:11px;color:var(--muted);
    background:rgba(255,255,255,.88);border:1px solid #e8e5de;padding:6px 11px;
    border-radius:8px;box-shadow:var(--shadow);
  }
  .hint b{color:#374151}
  .legend{
    position:fixed;right:20px;bottom:14px;z-index:20;display:flex;gap:11px;flex-wrap:wrap;
    max-width:56vw;font-size:10.5px;color:var(--muted);background:rgba(255,255,255,.88);
    border:1px solid #e8e5de;padding:6px 11px;border-radius:8px;box-shadow:var(--shadow);
  }
  .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
  /* 学习状态 */
  .stats{display:flex;gap:11px;align-items:center;font-size:11.5px;color:var(--muted);white-space:nowrap}
  .stats b{color:#374151;font-weight:700}
  .stats .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
  .mark{cursor:pointer}
  .mark:hover circle{stroke-width:2.4}
  /* 视图切换 */
  .seg{display:flex;background:#efece6;border:1px solid #dedad2;border-radius:8px;padding:2px;gap:2px}
  .seg a{font-size:12px;font-weight:600;color:#6b7280;text-decoration:none;padding:5px 11px;border-radius:6px;transition:.15s;white-space:nowrap}
  .seg a:hover{color:#374151;background:rgba(255,255,255,.6)}
  .seg a.on{background:#fff;color:#111827;box-shadow:0 1px 3px rgba(17,24,39,.14)}

  /* ============ 响应式：窄屏工具栏 ============ */
  @media (max-width: 900px){
    .topbar{height:auto;min-height:52px;flex-wrap:wrap;gap:5px;padding:6px 8px}
    .brand h1{font-size:13px;letter-spacing:0}
    .brand .sub{display:none}
    button{font-size:11px;padding:5px 8px;border-radius:6px}
    .seg a{font-size:11px;padding:4px 8px}
    .stats{order:9;width:100%;justify-content:center;font-size:10px;gap:8px}
    .legend{display:none}
    .hint{left:8px;bottom:8px;font-size:10px;padding:4px 8px}
  }

  /* ============ 手机端：竖排大纲模式 ============ */
  body.mobile #map{display:none}
  body.mobile .zoom{display:none}
  body.mobile #btn-fit{display:none}
  body.mobile .hint{display:none}
  body.mobile .legend{display:none}
  body.mobile .topbar{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding:6px 8px}
  body.mobile .topbar::-webkit-scrollbar{display:none}
  body.mobile .btns{flex-wrap:nowrap}
  body.mobile .spacer{display:none}
  body.mobile .brand{flex:none}
  body.mobile .stats{display:none}
  #outline{
    display:none; position:fixed; left:0; right:0; bottom:0;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:#faf9f6; padding:10px 10px 70px;
    background-image:radial-gradient(circle at 1px 1px,#e7e4dd 1px,transparent 0);
    background-size:24px 24px;
  }
  body.mobile #outline{display:block}
  .oln{margin:3px 0}
  .olrow{display:flex;align-items:flex-start;gap:7px;padding:8px 9px;
    border-radius:8px;background:#fff;border:1px solid #e5e2db;
    font-size:13px;line-height:1.5;color:#1f2937;cursor:pointer}
  .olrow.lv0{background:#111827;color:#fff;border-color:#111827;font-weight:800;font-size:14px}
  .olrow.lv1{color:#fff;border:none;font-weight:700;font-size:13.5px}
  .olrow.lv2{font-weight:600;background:#fff}
  .olrow.lv3{font-weight:400;font-size:12px;background:#f4f2ee;color:#4b5563}
  .oltog{flex:none;min-width:20px;height:20px;border-radius:5px;background:rgba(0,0,0,.07);
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
  .oltext{flex:1;word-break:break-word;padding-top:1px}
  .olmk{flex:none;width:20px;height:20px;border-radius:50%;border-width:1.3px;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:800;color:#fff;margin-top:1px}
  .olkids{margin-left:12px;border-left:2px solid rgba(0,0,0,.08);
    padding-left:8px;margin-top:2px}
/* === 移动端顶栏统一修复 v1 === */
@media (max-width: 900px){
  .topbar{height:auto !important;min-height:auto;flex-wrap:wrap;gap:5px;
          padding:6px 8px;overflow-x:hidden}
  .brand{flex:1 0 100%;gap:6px}
  .brand h1{font-size:13.5px;letter-spacing:0}
  .brand .sub{display:none}
  .spacer{display:none}

  /* 切换栏：独占一行，四项平分 */
  .seg{order:1;flex:1 0 100%;display:flex;gap:4px;margin:0 0 3px}
  .seg a{flex:1 1 0;text-align:center;font-size:11.5px;padding:6px 2px;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* 按钮：第二行，横向可滚 */
  .btns{order:2;flex:1 1 auto;flex-wrap:nowrap;overflow-x:auto;gap:4px;
        -webkit-overflow-scrolling:touch}
  .btns::-webkit-scrollbar{display:none}
  button{font-size:11px;padding:5px 8px;border-radius:6px;white-space:nowrap;flex:none}
  .zoom{order:3;flex:none}
  .zoom .val{min-width:34px;font-size:10px}

  .stats{order:9;flex:1 0 100%;justify-content:center;font-size:9.5px;gap:8px}
  .legend{display:none}
  .hint{left:8px;bottom:8px;font-size:10px;padding:4px 8px;max-width:calc(100% - 16px)}
}
@media (max-width: 420px){
  .seg a{font-size:10.5px;padding:6px 1px}
  .brand h1{font-size:12.5px}
}
/* === 移动端切换栏 grid 修复 v2 === */
@media (max-width: 900px){
  .topbar{flex-wrap:wrap !important;height:auto !important;overflow:visible !important;
          padding:6px 8px !important;gap:5px !important}
  .brand{flex:1 0 100% !important;margin-bottom:2px}
  .spacer{display:none !important}

  .seg{display:grid !important;grid-template-columns:repeat(4,1fr) !important;
       gap:4px !important;width:100% !important;flex:1 0 100% !important;
       order:-1 !important;padding:3px !important;box-sizing:border-box}
  .seg a{min-width:0 !important;width:auto !important;flex:none !important;
         text-align:center !important;padding:7px 2px !important;
         font-size:11.5px !important;line-height:1.2;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
         background:transparent;border-radius:6px}
  .seg a.on{background:#fff;box-shadow:0 1px 3px rgba(17,24,39,.14)}

  .btns{flex-wrap:nowrap !important;overflow-x:auto !important;width:100%;
        -webkit-overflow-scrolling:touch}
  .btns::-webkit-scrollbar{display:none}
  button{flex:none;font-size:11px;padding:5px 8px;white-space:nowrap}
  .zoom{flex:none}
  .stats{flex:1 0 100% !important;justify-content:center !important;
         font-size:9.5px !important;gap:8px !important}
  .legend{display:none !important}
  .hint{font-size:10px;left:8px;bottom:8px;padding:4px 8px;max-width:calc(100% - 16px)}
}
@media (max-width: 420px){
  .seg a{font-size:10.5px !important;padding:7px 1px !important}
}
/* === 标记下拉（窄屏可见性修复）=== */
.mkmenu{position:relative;flex:none}
.mklist{position:absolute;right:0;top:calc(100% + 6px);display:none;flex-direction:column;gap:3px;
  background:#fff;border:1px solid #dedad2;border-radius:9px;padding:5px;min-width:138px;
  box-shadow:0 10px 26px rgba(17,24,39,.16);z-index:60}
.mkmenu.open .mklist{display:flex}
.mklist button{width:100%;text-align:left;border:0;background:#fff;border-radius:6px;
  padding:7px 10px;font-size:11.5px;color:#374151}
.mklist button:hover{background:#f2efe9}
.mkmenu.open>#btn-mk{background:#e8f4f2;border-color:#9fd3cc;color:#0f766e}

@media (max-width: 1280px){
  .topbar{gap:8px;padding:0 10px;flex-wrap:nowrap}
  .brand{flex:none}
  .brand h1{font-size:13px;white-space:nowrap}
  .brand .sub{display:none}
  .seg{flex:none}
  .seg a{padding:5px 7px;font-size:11px}
  .btns{flex-wrap:nowrap;gap:4px;flex:none}
  .btns button{padding:5px 7px;font-size:11px}
  .stats{font-size:10px;gap:6px;flex:none}
  #btn-mk{padding:5px 8px;font-size:11px}
  .zoom{flex:none}
}
@media (max-width: 1080px){
  .brand{display:none}
  .seg a{padding:5px 6px;font-size:10.5px}
  .btns button{padding:5px 6px;font-size:10.5px}
  .stats{gap:5px;font-size:9.5px}
}
</style>
</head>

<script>
const DATA = {"t":"二阶魔方 DQN：从 3,674,160 个状态到 93.5% 端到端","c":[{"t":"1. 问题建模：把魔方变成数学题","c":[{"t":"1.1 状态与观测编码：144 维 One-Hot","c":[{"t":"比喻：给魔方拍 144 张「是/否」的照片——每个贴纸位置 × 每种颜色各占一个坑，是就填 1，不是填 0。","c":[],"color":"#0EA5E9"},{"t":"本质：状态是 6 面 × 4 贴纸 = 24 个 0~5 整数；展开成 24×6 的 one-hot → 144 维 float32，把离散状态变成网络能吃的数字向量。","c":[],"color":"#0EA5E9"},{"t":"代码：np.eye(6)[flat].flatten()，一行搞定。","c":[],"color":"#0EA5E9"},{"t":"项目里：8 次正式训练的输入全是 144 维，网络输入层按它定死。","c":[],"color":"#0EA5E9"},{"t":"坑：One-Hot 维度别拍脑袋改——改了网络输入层、经验池存储、评估脚本全要同步，牵一发动全身。","c":[],"color":"#0EA5E9"}],"color":"#0EA5E9"},{"t":"1.2 状态空间：3,674,160 种合法形态","c":[{"t":"本质：二阶魔方去掉整体旋转后共 3,674,160 个合法状态；任意状态最远 11 步可解（God's number = 11）。","c":[],"color":"#0EA5E9"},{"t":"比喻：全宇宙的魔方形态只有三百六十多万种，最远的一颗离复原也只要 11 步。","c":[],"color":"#0EA5E9"},{"t":"项目里：这个数字是「为什么不能暴力搜索」的量化依据（18^11 早爆了）。","c":[],"color":"#0EA5E9"},{"t":"复习提示：状态空间大小决定查表法能不能覆盖——查表只敢在「底层已好」的 647 个状态上用。","c":[],"color":"#0EA5E9"}],"color":"#0EA5E9"},{"t":"1.3 动作空间：18 种转法","c":[{"t":"比喻：魔方师傅手里只有 18 把扳手，每步只能选一把拧；选哪把就是 DQN 要学的。","c":[],"color":"#0EA5E9"},{"t":"本质：6 个面 × 3 种转法（顺 90°、逆 90°、180°）= 18 个离散动作；编码 action = face_id + 6 × direction。","c":[],"color":"#0EA5E9"},{"t":"项目里：网络输出 18 维 Q 值，argmax 就是选扳手。","c":[],"color":"#0EA5E9"},{"t":"坑：动作编号和实际拧法必须一一对应——环境、训练、评估三处映射错一个，模型学出来的就是乱拧。","c":[],"color":"#0EA5E9"},{"t":"补充：B 模型因为探索了全部 18 个动作空间，意外进化成「弱通用求解器」，能救残局。","c":[],"color":"#0EA5E9"}],"color":"#0EA5E9"},{"t":"1.4 隐式动作过滤：防止 AI 原地打转","c":[{"t":"本质：连续拧同一面等于白拧，环境里加了规则——新动作与上一个同面时，把面随机换掉、方向保留。","c":[],"color":"#0EA5E9"},{"t":"比喻：不许连按同一个按钮，按了就自动换成别的。","c":[],"color":"#0EA5E9"},{"t":"注意：动作空间仍是 18，只是执行时被改写，agent 自己并不知道。","c":[],"color":"#0EA5E9"},{"t":"项目里：训练时策略永远不会「同面连续」，等效压缩了无效动作空间，收敛更快。","c":[],"color":"#0EA5E9"}],"color":"#0EA5E9"},{"t":"1.5 三种「已复原」判定：极易混","c":[{"t":"is_solved()：底面同色 + 前底两贴纸同色 —— 只代表「第一层复原」。","c":[],"color":"#0EA5E9"},{"t":"is_entire_cube_solved()：6 面各自同色 —— 才是整颗复原。","c":[],"color":"#0EA5E9"},{"t":"坑：reward_helpers.is_bottom_layer_solved() 只比较前底两贴纸「彼此相等」，没校验等于 2，是 bug。","c":[],"color":"#0EA5E9"},{"t":"项目里：底层智能体 A 只学第一层，训练 1/2/3 的成功率用的是 is_solved()，别当整颗复原率。","c":[],"color":"#0EA5E9"}],"color":"#0EA5E9"},{"t":"1.6 MDP 四元组与终止条件","c":[{"t":"本质：状态 144 维、动作 18、奖励 5 种可选、终止 = 判定复原（底层任务）或整颗复原（端到端）。","c":[],"color":"#0EA5E9"},{"t":"比喻：一局 = 打乱 → 一步步拧 → 判定成功 → 结算奖励 → 决定要不要加难度。","c":[],"color":"#0EA5E9"},{"t":"项目里：gymnasium.Env 的 reset/step 五件套，每局结束 env.reset(last_solved, last_scramble) 把结果回传给课程学习。","c":[],"color":"#0EA5E9"}],"color":"#0EA5E9"}],"color":"#0EA5E9"},{"t":"2. 深度学习基础栈（网络肉身）","c":[{"t":"2.1 DNN / MLP：三层流水线车间","c":[{"t":"比喻：三层车间。第一道工序收 144 个零件（魔方状态），第二道把零件摊开成 512 个工位慢慢加工（提特征），最后只留 18 个出货口（18 种转法的 Q 值）。","c":[],"color":"#2563EB"},{"t":"本质：多层全连接就是「矩阵乘 + 加偏置 + 激活」反复堆叠，输入数字、输出数字。","c":[],"color":"#2563EB"},{"t":"项目里：144 → 256 → 256 → 18，含偏置 107,538 个参数；512 不是拍脑袋，是给特征留「冗余池」。","c":[],"color":"#2563EB"},{"t":"坑：别以为层越多越强。魔方网络只有约 10 万参数，扩太大反而过拟合（Dueling-512 扩容即被封存）。","c":[],"color":"#2563EB"}],"color":"#2563EB"},{"t":"2.2 ReLU：守门员","c":[{"t":"比喻：守门员。大于 0 的球直接放行，小于 0 的一脚踢飞。","c":[],"color":"#2563EB"},{"t":"本质：max(0, x)，正数原样过、负数归零；导数不是 1 就是 0，不会像 Sigmoid 那样连乘后趋近 0。","c":[],"color":"#2563EB"},{"t":"项目里：隐藏层全用 ReLU 不用 Sigmoid——Sigmoid 在深层网络梯度越传越小（梯度消失），前面几层几乎学不动。","c":[],"color":"#2563EB"},{"t":"坑：ReLU 有「神经元死亡」——负数区梯度为 0，学废了就再不更新。小网络一般没事，大面积死亡再换 LeakyReLU。","c":[],"color":"#2563EB"}],"color":"#2563EB"},{"t":"2.3 MSE Loss：罚款单","c":[{"t":"比喻：罚款单。你预测这步值 50 块，实际只值 12 块，差 38 块，罚单按 38 的平方开。","c":[],"color":"#2563EB"},{"t":"本质：MSE = (预测 Q − 目标 Q)² 的均值；DQN 是回归任务（预测连续 Q 值），所以用 MSE 不用交叉熵。","c":[],"color":"#2563EB"},{"t":"项目里：主网络吐出 18 个 Q 值，只取实际执行那个动作的 Q，与目标网络算的 Target Q 做 MSE，再 backward()。","c":[],"color":"#2563EB"},{"t":"坑：Loss 上升不等于模型变差——Q 值量级变大时 MSE 自然膨胀，只看 success_rate，别盯着 Loss 哭。","c":[],"color":"#2563EB"}],"color":"#2563EB"},{"t":"2.4 反向传播与优化器：顺藤摸瓜找内鬼","c":[{"t":"比喻：开了罚单之后顺藤摸瓜找内鬼——从最后一层往回查，每个神经元该背多少责任，再按责任大小扣工资（调参数）。","c":[],"color":"#2563EB"},{"t":"本质：loss.backward() 自动算梯度，optimizer.step() 按学习率更新权重，optimizer.zero_grad() 清空上一轮梯度。","c":[],"color":"#2563EB"},{"t":"项目里：标准三连——前向算 Q、算 Loss、backward + step；优化器用 Adam，自适应学习率，小网络省心。","c":[],"color":"#2563EB"},{"t":"坑：忘了 zero_grad()，梯度会累加，越训越飞。这三行顺序别乱，是 PyTorch 的「洗手、切菜、下锅」。","c":[],"color":"#2563EB"}],"color":"#2563EB"},{"t":"2.5 过拟合与正则化：死记硬背的学渣","c":[{"t":"比喻：死记硬背的学渣，做过的题全对、换道题就傻眼；正则化就是给「死记硬背」加罚站，参数越大罚越狠。","c":[],"color":"#2563EB"},{"t":"本质：weight_decay 是 L2 正则，在 Loss 里加大参数的平方惩罚，逼网络别把某个权重调得过大。","c":[],"color":"#2563EB"},{"t":"项目里：文档提了 weight_decay，但更关键的是 Checkpoint Selection 早停——跑 400 万步会记住 647 个死状态，100 万步早停锁 86.9% 才是正解。","c":[],"color":"#2563EB"},{"t":"坑：正则化是「软约束」，早停是「硬刹车」。小项目里早停比调 weight_decay 更立竿见影，别本末倒置。","c":[],"color":"#2563EB"}],"color":"#2563EB"},{"t":"2.6 Dueling-512：先评局面，再评动作","c":[{"t":"比喻：普通 DQN 直接给 18 道菜打分；Dueling 先评「这家店整体好不好吃」（状态价值 V），再评「每道菜比平均强多少」（优势 A），最后合起来算——先看大盘，再看个股。","c":[],"color":"#2563EB"},{"t":"本质：Q 拆成 V(s) + A(s,a) − mean(A)，让网络分别学「局面值多少」和「动作相对值多少」。","c":[],"color":"#2563EB"},{"t":"项目里：B 模型扩到 Dueling-512（34.6 万参数），顶层单模型成功率 86.9%；很多局面下「选哪个动作差别不大」，V 学明白、A 只学微小差异，样本效率更高。","c":[],"color":"#2563EB"},{"t":"坑：A 必须减均值，否则 V 和 A 可以互相加常数、减常数，identifiability 没了，训练不稳。","c":[],"color":"#2563EB"}],"color":"#2563EB"}],"color":"#2563EB"},{"t":"3. 第一阵营 · 强化学习核心算法（大脑与记忆）","c":[{"t":"3.1 DQN：长着脑子还会算长远账的打游戏高手","c":[{"t":"比喻：打怪升级。不只看眼前这刀砍多少金币（即时奖励），还得算「现在忍一手，后面能不能爆大装备」（未来预期回报）。","c":[],"color":"#7C3AED"},{"t":"本质：用神经网络拟合 Q(s,a) = 在状态 s 做动作 a 未来能拿的总分；动作空间离散（18 种）所以用 DQN，不用连续动作的 DDPG/PPO。","c":[],"color":"#7C3AED"},{"t":"项目里：Q-Network 吃 144 维状态、吐 18 维 Q 值，argmax 选动作；训练用 Target Network 算目标、Replay Buffer 抽样。","c":[],"color":"#7C3AED"},{"t":"坑：DQN 只适合离散小动作空间，魔方 18 个刚好；换机械臂连续控制就得上别的算法。","c":[],"color":"#7C3AED"},{"t":"面试话术：DQN 是深度强化学习的基石，它用深度神经网络替代传统 Q 表，解决了魔方 360 万状态空间的维度爆炸问题；输出每个离散动作的预期总回报（Q 值）来做决策，非常适合我们这种离散动作空间任务。","c":[],"color":"#7C3AED"}],"color":"#7C3AED"},{"t":"3.2 Q 值：给每个动作贴价签","c":[{"t":"比喻：18 个候选动作，每个贴一张「未来总分预测」的价签，价签最高的就是当前该干的。","c":[],"color":"#7C3AED"},{"t":"本质：Q(s,a) = 在状态 s 做 a 的期望累计折扣回报；网络输出的是估计值，训练就是让估计逼近贝尔曼目标。","c":[],"color":"#7C3AED"},{"t":"项目里：只取实际执行动作那一维的 Q 去算 Loss，不是 18 维全算；argmax 选动作，但训练时可能用 ε-greedy 探索。","c":[],"color":"#7C3AED"},{"t":"坑：Q 值会随训练量级膨胀，别拿绝对值判断好坏；比较只看相对排序和 success_rate。","c":[],"color":"#7C3AED"},{"t":"面试话术：Q 值输出的是估计值而不是真值，训练就是让估计逼近日贝尔曼目标；我们只取实际执行动作那一维算 Loss，而不是 18 维全算。","c":[],"color":"#7C3AED"}],"color":"#7C3AED"},{"t":"3.3 Replay Buffer：学霸的错题本","c":[{"t":"比喻：错题本。过去怎么走、怎么摔、拿多少分全记下来，训练时随机抽几道复习，别只盯着刚做的那一道。","c":[],"color":"#7C3AED"},{"t":"本质：预分配环形数组，存 (S, A, R, S', Done) 五元组；随机采样打破时间相关性，支持 Off-policy 多次复用。","c":[],"color":"#7C3AED"},{"t":"项目里：容量 100 万条，每 4 步抽 256 条；环形数组避免频繁扩容和内存碎片，同一条经验能被学很多次。","c":[],"color":"#7C3AED"},{"t":"坑：池子太小旧经验被冲掉（易灾难性遗忘），太大早期烂经验拖后腿——容量要跟任务复杂度匹配。","c":[],"color":"#7C3AED"},{"t":"面试话术：Replay Buffer 打破连续样本的时间相关性，避免网络陷入局部最优；工程上用预分配环形数组实现，避免普通列表动态扩容的内存碎片与卡顿，样本复用率也大幅提升。","c":[],"color":"#7C3AED"}],"color":"#7C3AED"},{"t":"3.4 Target Network：端着戒尺的老教授","c":[{"t":"比喻：老教授平时不吭声，每 1000 步抄一次学生的作业当标准答案；学生不能自己给自己打分，否则「左脚踩右脚」吹牛上天。","c":[],"color":"#7C3AED"},{"t":"本质：Target Network 结构与主网络一样、参数冻结、定期硬同步；贝尔曼目标的 max Q_next 用目标网络算。","c":[],"color":"#7C3AED"},{"t":"项目里：每 1000 步从主网络同步一次，防止主网络一更新目标也跟着变，导致 Q 值自举高估、Loss 爆炸。","c":[],"color":"#7C3AED"},{"t":"坑：同步太频繁等于没目标网络；太慢目标过时学得慢。1000 步是项目调过的节奏。","c":[],"color":"#7C3AED"},{"t":"面试话术：为消除 Q 值自举带来的高估，我引入 Target Network——参数冻结、每 1000 步硬同步一次，为 TD 目标提供稳定锚点，确保平稳收敛。","c":[],"color":"#7C3AED"}],"color":"#7C3AED"},{"t":"3.5 贝尔曼方程 + TD Error：边走边算差价","c":[{"t":"比喻：这步总分 = 眼前拿的金币 + 打折后的「下一局最高分」；0.99 就是打折率，越远的未来越不值钱。","c":[],"color":"#7C3AED"},{"t":"本质：Target_Q = R + γ × max(Target_Net(S'))，Done 时只有 R；TD 误差 = Target_Q − 当前 Q，再 MSE。","c":[],"color":"#7C3AED"},{"t":"项目里：γ=0.99，平均 15 步解完，奖励能传回第 1 步；代码里直接调公式，不用手推。","c":[],"color":"#7C3AED"},{"t":"坑：Done 状态必须切断自举、只留 R，否则终止状态凭空多出未来价值，学歪。","c":[],"color":"#7C3AED"},{"t":"大白话（TD Error）：边走边看导航算差价——走一步发现「导航预估」和「实际开销」有出入，这个出入就是 TD Error，我们就在不停缩小这个差价。","c":[],"color":"#7C3AED"},{"t":"本质（TD Error）：TD Error = Target Q − 预测 Q；把它平方就是 MSE Loss，反向传播回去改参数，「算命先生」（主网络）才越来越准。","c":[],"color":"#7C3AED"},{"t":"面试话术：TD Error 是 DQN 更新的核心驱动力，它结合环境真实奖励与下一状态预期，不需要像蒙特卡洛那样等整局结束；我们就是用 TD Error 算 MSE Loss 做梯度下降。","c":[],"color":"#7C3AED"}],"color":"#7C3AED"},{"t":"3.6 Epsilon-Greedy：瞎蒙与走最优的平衡","c":[{"t":"比喻：新手期多瞎蒙（探索），老手期多走最高分（利用）；ε 就是「瞎蒙概率」。","c":[],"color":"#7C3AED"},{"t":"本质：以 ε 概率随机选动作、1−ε 概率选 argmax Q；ε 通常从大衰减到小（本项目 0.3 → 0.01）。","c":[],"color":"#7C3AED"},{"t":"项目里：原项目 epsilon_end = 0.5 是 P0 缺陷——AI 永远一半时间瞎拧，成功率只有 2.4%；修正为 0.01 后才收敛（训练 1 直接 87.5%）。","c":[],"color":"#7C3AED"},{"t":"坑：ε 末端太大永远学不精，太小太早探索不足卡局部最优；0.01~0.05 是常见收尾区间。","c":[],"color":"#7C3AED"},{"t":"面试话术：这是平衡探索与利用的经典机制；原代码默认末端探索率 0.5 导致无法收敛（成功率 2.4%），我通过消融实验修正为 0.01，保证了训练后期稳定性——典型的工程排雷。","c":[],"color":"#7C3AED"}],"color":"#7C3AED"},{"t":"3.7 Curriculum Learning：先教 1+1 再教微积分","c":[{"t":"本质：初始打乱 1 步，每 5000 次 reset 检查最近 10000 局平均成功率，≥70% 就把打乱长度 +1。","c":[],"color":"#7C3AED"},{"t":"比喻：先把一步打乱练熟，练到 70 分就加难度，一步步加码。","c":[],"color":"#7C3AED"},{"t":"项目里：训练 2 升了 2 档（1→3），训练 3 升了 9 档（1→10），升档间隔越来越长说明越往上越难。","c":[],"color":"#7C3AED"},{"t":"坑：训练 8 旧版因 last_solved 没回传，课程永不升级、A 卡在第 1 档 76%；改分档课程才解决。","c":[],"color":"#7C3AED"},{"t":"面试话术：面对复杂环境我引入 Curriculum Learning，在 A 底层与 B 重训时动态调整打乱步数，缓解冷启动的梯度消失，同时建立稳固的解算直觉。","c":[],"color":"#7C3AED"}],"color":"#7C3AED"}],"color":"#7C3AED"},{"t":"4. 第二阵营 · 监督学习与微调技巧（跨界缝合）","c":[{"t":"4.1 Reward Shaping：按进步幅度发奖金","c":[{"t":"比喻：不按「你现在拼对几个贴纸」发绝对奖金，而按「你比上一步多拼对几个角」发进度奖，防止 AI 原地转圈刷分。","c":[],"color":"#B45309"},{"t":"本质：Reward Shaping 用进度差值（Δ）替代绝对值，缓解 Reward Hacking 和稀疏奖励。","c":[],"color":"#B45309"},{"t":"项目里：原作者用绝对值奖励，AI 学会原地转圈刷分；改用进度型 bottom_layer_corners，15 组消融证明它才学到真本事。","c":[],"color":"#B45309"},{"t":"坑：塑形设计不好会引入偏差，AI 可能钻空子；必须消融对比，别拍脑袋。","c":[],"color":"#B45309"},{"t":"数据：进度型 88.5%±2.3，其余模式 0.2%~7.8%，差 11~400 倍。","c":[],"color":"#B45309"},{"t":"面试话术：稀疏奖励下我发现绝对奖励会导致「原地刷分」的 Reward Hacking；通过引入基于进度差值的 Reward Shaping，并用 15 组消融实验对比，彻底解决了这个问题。","c":[],"color":"#B45309"}],"color":"#B45309"},{"t":"4.2 Reward Scaling：把大钞换零钱","c":[{"t":"比喻：RL 奖励是 +100 的大钞，专家交叉熵是几块钱的零钱，放一个 Loss 里量级打架；把大钞乘 0.1 换成十块，两边才好一起算。","c":[],"color":"#B45309"},{"t":"本质：把 RL 奖励乘缩放系数（如 0.1），让 TD 误差和 Anchor Loss 量级接近，梯度不被一方主导。","c":[],"color":"#B45309"},{"t":"项目里：+100 奖励 × 0.1；不缩放时 loss 直接炸到 7.4e9。","c":[],"color":"#B45309"},{"t":"坑：缩放系数和 Anchor 权重是一对，调一个另一个要跟着看，别单独拍。","c":[],"color":"#B45309"},{"t":"面试话术：RL 奖励与专家交叉熵量级差距过大会让梯度被一方主导，我用奖励缩放把 +100 压到 +10，使 TD 与 Anchor 两项损失量级接近。","c":[],"color":"#B45309"}],"color":"#B45309"},{"t":"4.3 IL / BC：先开卷背书","c":[{"t":"比喻：顶层任务奖励太稀疏，纯 RL 像大海捞针；先拿 648 种顶层公式生成 2 万多条标准答案让 AI 开卷抄，抄会了再自己刷题。","c":[],"color":"#B45309"},{"t":"本质：行为克隆，用专家轨迹做监督学习，交叉熵训网络预测专家动作，把起点从 2% 拉到 78.7%，再 RL 微调。","c":[],"color":"#B45309"},{"t":"项目里：648 公式 × 多轨迹 = 2 万多条样本；单步准确率 94.5%，贪心 78.7%（509/647）。","c":[],"color":"#B45309"},{"t":"坑：IL 只学「专家怎么做」不懂「为什么」，分布偏移下会犯错，所以必须接 RL 微调，不能停在 IL。","c":[],"color":"#B45309"},{"t":"面试话术：面对顶层极端的稀疏奖励，我引入 IL 行为克隆做热启动，用公式库生成海量专家轨迹，以监督学习把模型垫底拉到 78.7%，为 RL 微调提供极高起点。","c":[],"color":"#B45309"}],"color":"#B45309"},{"t":"4.4 交叉熵 CE：单选题的罚分方式","c":[{"t":"大白话：考卷里的单选题——逼着网络把「专家选的那个动作」分数拉高、其他压低。","c":[],"color":"#B45309"},{"t":"本质：交叉熵衡量两个概率分布的距离，比 MSE 更适合分类动作空间的策略蒸馏。","c":[],"color":"#B45309"},{"t":"项目里：IL 蒸馏和 Anchor Loss 里用的全是 CE，死死咬住专家的动作排列，绝不让模型偏离轨迹。","c":[],"color":"#B45309"},{"t":"面试话术：在分类动作空间，CE 比 MSE 更适合做策略蒸馏，因为它衡量的是两个概率分布的距离；我在 IL 和之后的专家锚定中都用 CE 强制约束动作选择分布。","c":[],"color":"#B45309"}],"color":"#B45309"},{"t":"4.5 Anchor Loss：把大铁锚扔下去拴住船","c":[{"t":"比喻：RL 微调时怕 AI 把背过的书全忘了，每走一步拽一下绳子：偏离专家答案太远就罚。","c":[],"color":"#B45309"},{"t":"本质：Loss 里加 λ × CrossEntropy(预测动作, 专家动作)，大权重锁住先验知识，防灾难性遗忘。","c":[],"color":"#B45309"},{"t":"项目里：B 模型 RL 微调时加 Anchor Loss（λ=100，联合训练 λ=1000），保住 IL 学到的顶层公式能力，同时允许探索改进。","c":[],"color":"#B45309"},{"t":"坑：权重太大 AI 不敢探索（等于没 RL），太小忘光专家知识；λ=1000 是调出来的量级，要配合奖励缩放。","c":[],"color":"#B45309"},{"t":"面试话术：这是我最硬核的微调经验——纯 TD 微调会冲垮 IL 策略，所以设计 Anchor Loss，把交叉熵以 1000 权重融入总损失，既保证 TD 探索新策略，又锁住底层动作逻辑。","c":[],"color":"#B45309"}],"color":"#B45309"},{"t":"4.6 分布偏移 Covariate Shift：走错一步就懵圈","c":[{"t":"大白话：学渣只背过专家教的题，实战走错一步进入「专家没教过的新局面」就直接懵圈，后面全乱套。","c":[],"color":"#B45309"},{"t":"本质：IL 存在固有的分布偏移缺陷——一步走错就进入未标记状态，误差级联累积。","c":[],"color":"#B45309"},{"t":"项目里：IL 单步准确率明明 94.5%，连起来成功率只有 78.7%，差的就是分布偏移。","c":[],"color":"#B45309"},{"t":"面试话术：IL 的分布偏移决定了单步准确率不能等同于实际成功率，必须接 RL 微调来修正。","c":[],"color":"#B45309"}],"color":"#B45309"},{"t":"4.7 灾难性遗忘：学了新的忘了旧的","c":[{"t":"比喻：补课补得太猛，把原来会的东西全忘了。","c":[],"color":"#B45309"},{"t":"本质：纯 TD 微调会把 BC 策略冲垮，成功率掉回个位数。","c":[],"color":"#B45309"},{"t":"解法：单次组合损失（TD + CE 一起算，而不是先 RL 后蒸馏）+ 回报缩放。","c":[],"color":"#B45309"},{"t":"项目里：这是训练 5 能「保住 78.7% 并微升到 79.0%」的原因，否则 5 万步就能把 B 练废。","c":[],"color":"#B45309"},{"t":"数据（训练 10 实测）：纯 TD 微调时庞大的 Q 值梯度直接把 IL 学到的 73.5% 冲成 14%，必须靠 Anchor Loss 与退火机制救场。","c":[],"color":"#B45309"},{"t":"面试话术：接入 RL 微调时遭遇严重灾难性遗忘，两者梯度量级差异过大，新任务直接覆盖旧权重——这让我意识到多任务损失配比与退火机制的必要性。","c":[],"color":"#B45309"}],"color":"#B45309"}],"color":"#B45309"},{"t":"5. 第三阵营 · 架构设计与容灾（大厂思维）","c":[{"t":"5.1 HRL：A 修地基，B 修屋顶","c":[{"t":"比喻：装修队分两组——A 师傅专修地基（底层），B 师傅专修屋顶（顶层），两人共用同一栋房子（同一个 Cube 对象）。","c":[],"color":"#EA580C"},{"t":"本质：把任务拆成底层/顶层两个子策略各自训练、共享环境状态，降低单模型学习难度。","c":[],"color":"#EA580C"},{"t":"项目里：A 底层成功率约 100%（端到端评估 98.0%），B 顶层单模型 86.9%；分层让各自专注，避免一个网络啥都学。","c":[],"color":"#EA580C"},{"t":"坑：分层边界要切干净——A/B 的状态表示、交接条件必须明确，不然互相甩锅。","c":[],"color":"#EA580C"},{"t":"面试话术：魔方任务步数较长，我把整体任务拆成分层 RL——底层 A 与顶层 B 各自专注子任务并共享环境状态，极大降低了策略搜索空间。","c":[],"color":"#EA580C"}],"color":"#EA580C"},{"t":"5.2 A/B 联合训练：一起练，B 意外进化","c":[{"t":"比喻：A、B 共用一栋房子练手；联合训练后 B 顶层成功率略降，但解算步数少了 2.6 步，还因摸过全部 18 种扳手意外成了「弱通用求解器」。","c":[],"color":"#EA580C"},{"t":"本质：A/B 共享魔方对象联合优化，B 探索全动作空间后获得泛化救援能力。","c":[],"color":"#EA580C"},{"t":"项目里：分档课程 1–9 各 5 万步 + 混合 35 万步 = 80 万步；逐档平均 91.3%，端到端 93.5%（n=200）。","c":[],"color":"#EA580C"},{"t":"坑：联合训练不是稳赚，要盯住各自指标，别 A 好了 B 崩了还不知道。","c":[],"color":"#EA580C"},{"t":"面试话术：联合训练让 B 适应 A 的真实交接分布而不是题库分布，牺牲一点标准集成功率，换来步数下降与泛化救援能力。","c":[],"color":"#EA580C"}],"color":"#EA580C"},{"t":"5.3 Fallback：A 修不好，B 上","c":[{"t":"比喻：A 师傅 30 步还没修好地基，别直接判死刑，把残局扔给 B；B 见得多能盘回来，端到端成功率因此 +15%。","c":[],"color":"#EA580C"},{"t":"本质：A 失败时移交 B 接管残局，B 的泛化推理救回约 75% 残局——这是容灾设计，不是主路径。","c":[],"color":"#EA580C"},{"t":"项目里：原架构 A 卡死直接判负；加 Fallback 后系统端到端 +15%~17%，最像大厂 MoE/容灾思路。","c":[],"color":"#EA580C"},{"t":"坑：触发条件（30 步）要调——太早浪费 B、太晚残局没救；移交时状态编码必须和 B 训练时一致。","c":[],"color":"#EA580C"},{"t":"面试话术：这是我引以为傲的系统架构设计——分层模型必然有局部失败，我引入类似大厂 MoE 的 Fallback 容灾：底层 A 失败时让具备泛化能力的 B 接管残局，端到端成功率直接提升 15%。","c":[],"color":"#EA580C"}],"color":"#EA580C"},{"t":"5.4 Checkpoint Selection：跑到癫狂前拔电源","c":[{"t":"比喻：学生刷题刷到 400 万道开始死记硬背 647 道偏题，换新题就傻眼；100 万道时早停，锁住那个 86.9% 的黄金状态。","c":[],"color":"#EA580C"},{"t":"本质：按验证集 success_rate 选最优 checkpoint，不按训练步数；过拟合后续训会退化。","c":[],"color":"#EA580C"},{"t":"项目里：400 万步严重过拟合、记住 647 个死状态；100 万步早停锁死 86.9% 最佳权重。","c":[],"color":"#EA580C"},{"t":"坑：早停看的是验证指标不是训练 Loss；权重备份成 FINAL_B.pth 并设只读，禁止续训覆盖。","c":[],"color":"#EA580C"},{"t":"面试话术：训练不是越久越好，跑长了会严重过拟合；我设计了基于验证集成功率的 Checkpoint Selection，只在指标巅峰保留权重，避免长续训退化。","c":[],"color":"#EA580C"}],"color":"#EA580C"}],"color":"#EA580C"},{"t":"6. 第四阵营 · 后续优化与翻车排雷（深水区）","c":[{"t":"6.1 BFS Oracle：上帝视角的标尺","c":[{"t":"大白话：全知全能的导航仪——暴算所有状态，告诉你从哪个坑回终点最近；但它太吃算力装不进 AI 脑子，只能用来生成标准答案。","c":[],"color":"#DC2626"},{"t":"本质：用 BFS 离线构建精确的状态距离场（Oracle），本质是把搜索算力转成神经网络参数。","c":[],"color":"#DC2626"},{"t":"项目里（训练 9）：用 BFS 重造底层「严格第一层」标尺，给旧 A 师傅自己跑的数据打绝对正确的标签做蒸馏，A 的平均步数从 19 步降到 6.64 步。","c":[],"color":"#DC2626"},{"t":"面试话术：为做知识蒸馏，我用 BFS 离线构建精确状态距离场当绝对真理，给旧策略最真实的分布打标签——把搜索算力换成网络参数，极大压缩解算步数。","c":[],"color":"#DC2626"}],"color":"#DC2626"},{"t":"6.2 On-policy / Off-policy：自己踩坑 vs 抄错题本","c":[{"t":"大白话：On-policy 是自己一边干一边学（自己踩的坑自己填）；Off-policy 是拿别人踩过的错题本学。","c":[],"color":"#DC2626"},{"t":"本质：On-policy 保证数据分布贴合当前策略；Off-policy 可用历史数据、样本效率高但分布有偏。","c":[],"color":"#DC2626"},{"t":"项目里（训练 9）：让旧 A 跑 4000 局（On-policy 采样）收集它真实碰壁的 4.8 万条数据，再拿 BFS 打标签。","c":[],"color":"#DC2626"},{"t":"面试话术：蒸馏 A 时坚持 On-policy 采样——拿固定题库教会过拟合；让旧模型在真实环境跑出数据再打标，数据分布和线上推理完全一致，相当于靶向治疗。","c":[],"color":"#DC2626"}],"color":"#DC2626"},{"t":"6.3 多解爆炸 Multi-solution Explosion：条条大路通罗马","c":[{"t":"大白话：一个残局可能往左、往右、往南、往北，平均有 4.5 个动作都是最优解；强逼 AI 选唯一一条，它会精神分裂。","c":[],"color":"#DC2626"},{"t":"本质：整颗复原平均有 4.5 个等价最优动作，用单一硬标签 CE 强行对齐会摧毁模型原有的 Q 值排序。","c":[],"color":"#DC2626"},{"t":"项目里（训练 10）：用距离场给 B 打标签以为能唯一化，结果 CE 硬标签把 B 的 Q 值排序冲毁，成功率暴跌。","c":[],"color":"#DC2626"},{"t":"面试话术：这是极有价值的负结果——魔方存在严重多解爆炸，单一硬标签 CE 会摧毁原策略，证明 RL 策略与纯监督分类在底层逻辑上冲突。","c":[],"color":"#DC2626"}],"color":"#DC2626"},{"t":"6.4 Tie-aware CE / Soft KL：不硬掰脑子","c":[{"t":"大白话：既然去罗马有 4 条路都对，就别只盯一条——几个动作给一样高的分（tie-aware），或按现有比例慢慢融合（Soft KL）。","c":[],"color":"#DC2626"},{"t":"本质：tie-aware 把并列最优动作同时当正样本；Soft KL 用教师分布做软目标，避免硬标签的排他性。","c":[],"color":"#DC2626"},{"t":"项目里（训练 11）：尝试后发现 B 的隐藏层已固化（死 ReLU），线性头学不动；放开全网络又整体漂移。","c":[],"color":"#DC2626"},{"t":"面试话术：在多解爆炸困境下我试了 tie-aware 与软目标 KL，但实测发现已收敛模型的低秩特征无法被线性头重排，而全网络微调又引发整体漂移——在高度固化先验的 RL 模型上做动作蒸馏，投入产出比极低。","c":[],"color":"#DC2626"}],"color":"#DC2626"},{"t":"6.5 Dead ReLU / 低秩特征：脑子里的细胞死透了","c":[{"t":"大白话：负责某个思考的细胞死透了（负数区梯度全为 0，再也不更新），整个网络只能靠极少数核心回路（低秩）思考，变得极度死板。","c":[],"color":"#DC2626"},{"t":"本质：长期 RL 训练后隐藏层出现大量 Dead ReLU 与低秩固化，丧失特征提取与重新排序能力。","c":[],"color":"#DC2626"},{"t":"项目里（训练 11）：B 的 256 维隐藏层严重 Dead ReLU，只微调最后两层（冻结主干）时大脑根本转不动，loss 卡在均匀分布水平。","c":[],"color":"#DC2626"},{"t":"面试话术：只微调最后两层时 loss 卡在均匀分布，深入诊断发现底层隐藏层存在大量 Dead ReLU 与低秩固化——这为负结果提供了直接的底层证据。","c":[],"color":"#DC2626"}],"color":"#DC2626"},{"t":"6.6 负结果的价值与判据","c":[{"t":"大白话：翻车不是白翻——它告诉你「哪条路明确走不通」，这比再刷一个好看指标更值钱。","c":[],"color":"#DC2626"},{"t":"本质：负结果必须给出机制解释（分布偏移 / 多解 / Dead ReLU），而不是一句「效果不好」。","c":[],"color":"#DC2626"},{"t":"项目里：训练 10/11 的负结果写进复盘，成为「不要在已固化 RL 模型上做动作蒸馏」的直接依据。","c":[],"color":"#DC2626"},{"t":"面试话术：我把负结果当资产——它排除了整条技术路线并给出可复现的机制证据（多解爆炸 + 低秩固化），这是工程判断力的体现。","c":[],"color":"#DC2626"}],"color":"#DC2626"}],"color":"#DC2626"},{"t":"7. 评估口径与推断优化","c":[{"t":"7.1 五种成功率口径：数字必须带标签","c":[{"t":"定义：[训练] 带 ε 的滑动窗口；[贪心647] ε=0 跑 647 个标准顶层状态；[贪心逐档] 1–9 档各 100 个；[端到端] 随机 1–8 步 A→B 整颗；[留出] 130 个没参与调参的状态。","c":[],"color":"#047857"},{"t":"比喻：同一支球队，「训练赛胜率」「正式赛胜率」「淘汰赛胜率」根本不是一回事。","c":[],"color":"#047857"},{"t":"坑例：训练 2 的 60.5% 比训练 1 的 87.5% 低，不是练坏了，是难度从 1 档升到 3 档。","c":[],"color":"#047857"},{"t":"项目里：写汇报必须带口径标签，否则 79% 和 93.5% 放在一起就是错的。","c":[],"color":"#047857"}],"color":"#047857"},{"t":"7.2 评估口径要统一：30 步和 100 步不是一回事","c":[{"t":"比喻：考试规定 30 分钟交卷，你偷偷放宽到 100 分钟，然后说「我 99% 做完」——这不是能力，是改规则。","c":[],"color":"#047857"},{"t":"本质：原项目声称的 99% 成功率，是把评估步数从 30 步放宽到 100 步；口径不统一，数字不可比。","c":[],"color":"#047857"},{"t":"项目里：复盘必须统一评估步数、测试集、随机种子；对外报数要注明口径。","c":[],"color":"#047857"},{"t":"坑：评估脚本和训练脚本的步数限制必须一致，别训练 30 步、评估 100 步自欺欺人。","c":[],"color":"#047857"}],"color":"#047857"},{"t":"7.3 Loss 判断口径：别盯着罚款单哭","c":[{"t":"比喻：Q 值从几十涨到几千，MSE 罚款单自然变大；就像公司营收变大税单也变大，不能只看税单判断经营好坏。","c":[],"color":"#047857"},{"t":"本质：Q 值量级膨胀导致 MSE 上升是正常现象，核心指标是 success_rate 和解算步数。","c":[],"color":"#047857"},{"t":"项目里：文档反复强调 Loss 上升是好事（训练 1 loss 0.03→12 仍成功），评估必须跑固定测试集算成功率。","c":[],"color":"#047857"},{"t":"坑：拿训练 Loss 当唯一指标，容易在 Q 值膨胀时误杀好模型，或被低 Loss 的烂模型骗了。","c":[],"color":"#047857"}],"color":"#047857"},{"t":"7.4 留出验证：别在评估集上调参","c":[{"t":"本质：647 个状态按 i%5==0 拆成 517 训练 / 130 留出；调参只用 517，最终报 130 上的数。","c":[],"color":"#047857"},{"t":"比喻：把一部分题锁进保险柜，只在最后验收时打开。","c":[],"color":"#047857"},{"t":"项目里：加权 Q 平均在 647 上调到 86.4%，留出集上是 84.6%——差 1.8 pt 就是过拟合的证据。","c":[],"color":"#047857"},{"t":"坑：所有超参选择（λ、ε、集成权重）都要在留出集确认后再报最终数字。","c":[],"color":"#047857"}],"color":"#047857"},{"t":"7.5 加权 Q 平均集成：不用重训，+5 pt","c":[{"t":"本质：把训练 6 与训练 7 的 18 维 Q 输出按权重加权平均，再取 argmax。","c":[],"color":"#047857"},{"t":"数据：1.0:0 → 81.1%，0.85:0.15 → 86.4%（559/647），代价是平均步数 15.4 → 16.4；留出 84.6%。","c":[],"color":"#047857"},{"t":"比喻：两个学生各做一遍题，综合他们的答案再选，比单干准。","c":[],"color":"#047857"},{"t":"项目里：纯推断期优化，不占训练预算，是当前最好的 647 口径成绩。","c":[],"color":"#047857"}],"color":"#047857"},{"t":"7.6 交接容错实测：B 到底能不能擦屁股","c":[{"t":"valid（真实交接 308 条）：查表法 99.4%，训练 7 的 B 98.4%（12.5 步），联合 B 94.2%（10.4 步）。","c":[],"color":"#047857"},{"t":"invalid（A 超时/底层没解 92 条）：联合 B 救回 75.0%（39.2 步），训练 7 B 73.9%，查表法 0%。","c":[],"color":"#047857"},{"t":"假阳性交接：A 的 is_solved() 骗了自己 2/308 = 0.65%——判定宽松的风险是真实的。","c":[],"color":"#047857"},{"t":"项目里：查表法在越界状态完全无能（0%），DQN 的泛化才是兜底能力来源。","c":[],"color":"#047857"}],"color":"#047857"}],"color":"#047857"},{"t":"8. 训练工程与实验管理","c":[{"t":"8.1 JSONL 日志与 MLflow：给每次考试留底","c":[{"t":"比喻：每次模拟考都记一笔——第几步、成功率多少、解算步数多少；回头翻账本才知道哪次是巅峰。","c":[],"color":"#0891B2"},{"t":"本质：JSONL 一行一个 JSON 记录 checkpoint 指标，便于分析/画图/复现；MLflow 是更重的实验管理工具（本项目 mlflow.db 存元数据）。","c":[],"color":"#0891B2"},{"t":"项目里：逐 step/episode 落盘指标，是 Checkpoint Selection 和前端工作台的数据源；build_web_data.py → rubik2x2-workbench.html。","c":[],"color":"#0891B2"},{"t":"坑：日志字段要固定 schema，别今天记 success_rate 明天记 sr，回头聚合脚本全崩。","c":[],"color":"#0891B2"}],"color":"#0891B2"},{"t":"8.2 消融实验：一次只拆一个零件","c":[{"t":"比喻：想知道发动机哪个零件有用，一次只拆一个对比拆前拆后；不能一口气拆五个然后说「你看车不跑了」。","c":[],"color":"#0891B2"},{"t":"本质：控制变量法。5 种 reward_mode × 3 seed = 15 组，证明进度型奖励优于绝对值。","c":[],"color":"#0891B2"},{"t":"项目里：奖励塑形、Anchor Loss、Fallback 这些改动都要有消融对照，不能只说「我改了就好了」。","c":[],"color":"#0891B2"},{"t":"坑：消融要固定随机种子、评估口径、训练步数；反例：bottom_layer 单跑 seed42 是 13.0%，3 seed 平均只有 3.7%。","c":[],"color":"#0891B2"}],"color":"#0891B2"},{"t":"8.3 权重保护：把金牌锁进保险柜","c":[{"t":"比喻：86.9% 的 B 模型和 100% 的 A 模型是金牌，备份成 FINAL_A.pth、FINAL_B.pth 并设只读，别让续训脚本手滑覆盖。","c":[],"color":"#0891B2"},{"t":"本质：最佳权重与实验性续训隔离，防止误覆盖导致成果丢失。","c":[],"color":"#0891B2"},{"t":"项目里：立即备份、设只读、续训脚本输出到新目录，绝不允许覆盖 FINAL 权重。","c":[],"color":"#0891B2"},{"t":"坑：只备份不设只读等于没保护；续训脚本默认输出路径必须改，别用同一个文件名。","c":[],"color":"#0891B2"}],"color":"#0891B2"},{"t":"8.4 训练循环的三个隐蔽陷阱","c":[{"t":"不检查第一层是否已复原就调用 IL 阶段，导致 IL 拿到脏输入。","c":[],"color":"#0891B2"},{"t":"run_pipeline 的成功计数 +1（差一错误），统计会虚高。","c":[],"color":"#0891B2"},{"t":"多个「死参数」：赋值后从未被读取，改配置以为生效其实没生效（total_steps 就是典型）。","c":[],"color":"#0891B2"},{"t":"项目里：先审计再复现，不修这些任何复现实验都不可信。","c":[],"color":"#0891B2"}],"color":"#0891B2"},{"t":"8.5 环境与编码坑：emoji 与 Makefile","c":[{"t":"中文 Windows 控制台默认 GBK，打印 emoji 直接抛 UnicodeEncodeError —— 必须设 PYTHONUTF8=1。","c":[],"color":"#0891B2"},{"t":"Makefile 是 Unix-only，Windows 上 make install 跑不了，只能手动 pip install -e .。","c":[],"color":"#0891B2"},{"t":"比喻：工具链是别人在 Mac/Linux 上写的，搬到 Windows 要先铺路。","c":[],"color":"#0891B2"},{"t":"项目里：所有训练命令都要前置 PYTHONUTF8=1，并在仓库根目录执行（产物路径相对 CWD）。","c":[],"color":"#0891B2"}],"color":"#0891B2"},{"t":"8.6 模块职责边界与系统架构","c":[{"t":"envs/：状态演化 + 奖励 + 终止，完全不知道神经网络存在。","c":[],"color":"#0891B2"},{"t":"agents/：策略与学习目标，不知道魔方规则（只通过 observation_space/action_space 读写）。","c":[],"color":"#0891B2"},{"t":"training/：超参装配，不含算法逻辑；scripts/：评测与数据生成。","c":[],"color":"#0891B2"},{"t":"依赖方向单向：pipeline → agents → envs，无反向依赖；这是能安全替换网络/环境的前提。","c":[],"color":"#0891B2"}],"color":"#0891B2"}],"color":"#0891B2"},{"t":"9. 项目历程：训练 1~11 事实表","c":[{"t":"9.1 训练 1：底层 5 万步 87.5%","c":[{"t":"口径：训练 1 是底层智能体，用作者 planner 推荐的超参（bottom_layer_corners + ε_end=0.01 + lr=1e-4 + batch=256）。","c":[],"color":"#BE123C"},{"t":"结果：5 万步 / 6,554 局 / 23.4 秒，success 5.71% → 87.5%，第 9,000 步跨过 50%。","c":[],"color":"#BE123C"},{"t":"意义：把 while True 死循环换成有界 5 万步，第一次跑通「第一层复原」。","c":[],"color":"#BE123C"},{"t":"坑：87.5% 是 1 档打乱下的第一层成功率，不是整颗复原率。","c":[],"color":"#BE123C"}],"color":"#BE123C"},{"t":"9.2 训练 2：60 万步，课程升 2 档","c":[{"t":"设计：与训练 1 同一个实验，只延长到 60 万步。","c":[],"color":"#BE123C"},{"t":"结果：291.8 秒 / 2,056 步每秒 / 50,967 局；课程触发两次，打乱长度 1 → 3；最终 success 60.5%。","c":[],"color":"#BE123C"},{"t":"坑：60.5% 比训练 1 的 87.5% 低不是练坏了，是三档难度更高——两个数字不是同一道题。","c":[],"color":"#BE123C"}],"color":"#BE123C"},{"t":"9.3 训练 3：500 万步，课程升 9 档","c":[{"t":"结果：2,299.9 秒 / 278,389 局；课程自动升档 9 次，打乱长度 1 → 10；最终 success 60.5%。","c":[],"color":"#BE123C"},{"t":"关键改进：脚本补上逐点 level 记录，升档时刻第一次有精确值（65k 首次升档）。","c":[],"color":"#BE123C"},{"t":"观察：越往上越慢，升档间隔从 1 万局拉长到 13 万局。","c":[],"color":"#BE123C"},{"t":"意义：证明课程学习能自己往上爬，但纯 RL 的天花板受探索与稀疏奖励限制。","c":[],"color":"#BE123C"}],"color":"#BE123C"},{"t":"9.4 训练 4：顶层从零 RL，只有 2.0%","c":[{"t":"任务：647 个「底层已好」的标准顶层状态，从零 RL 训练 5 万步。","c":[],"color":"#BE123C"},{"t":"结果：贪心 2.0%（13/647），ε 扫描最优 ε_end=0.20；端到端 A→B 整颗 27.5%。","c":[],"color":"#BE123C"},{"t":"判断：50k 步不够，ε 调参只能从 0.9% 抬到 2.0%，抬不到可用——所以下一步必须上 IL 热启动。","c":[],"color":"#BE123C"},{"t":"教训：稀疏奖励 + 无先验 = 学不动，这是训练 5 的立项理由。","c":[],"color":"#BE123C"}],"color":"#BE123C"},{"t":"9.5 训练 5/6/7：IL 热启动的三档","c":[{"t":"训练 5（5 万步）：IL 78.7% → 79.0%（511/647），平均步数 16.3 → 15.9，49 秒。","c":[],"color":"#BE123C"},{"t":"训练 6（60 万步）：成功率仍是 79.0%，步数压到 15.1（-7%），训练口径 62.5% → 68.5%，587 秒。","c":[],"color":"#BE123C"},{"t":"训练 7（500 万步）：突破 79% 平台到 81.1%（525/647），15.4 步，81.6 分钟；训练口径 72.0%。","c":[],"color":"#BE123C"},{"t":"结论：79% 是 BC 策略的天花板（「一次都不走偏」的比例），500 万步才磨掉 2 pt。","c":[],"color":"#BE123C"}],"color":"#BE123C"},{"t":"9.6 训练 8：分档课程 + A/B 联合，端到端 93.5%","c":[{"t":"课程：1–9 档各 5 万步 + 随机 1–9 档混合 35 万步 = 80 万步；A 冻结、B 锚定 λ=1000。","c":[],"color":"#BE123C"},{"t":"结果：逐档贪心平均 91.3%（1–2 档 100%，8 档 82%、9 档 84%）；端到端整颗 93.5%（n=200）；A 98.0%、B 交接后 95.4%、B 平均 11.1 步。","c":[],"color":"#BE123C"},{"t":"对比：旧版联合训练因课程卡死，A 停在 1 档 76%；分档课程解决了这个问题。","c":[],"color":"#BE123C"},{"t":"坑：joint_B 在 647 标准集只有 80.7%（低于训练 7 的 81.1%），因为被拉向 A 的真实交接分布——部署看端到端，别看标准集。","c":[],"color":"#BE123C"}],"color":"#BE123C"},{"t":"9.7 性能阶梯：从 2% 到 93.5% 的口径警示","c":[{"t":"从零 RL 2.0%[贪心647] → IL 78.7%[贪心647] → RL 微调 79/79/81.1%[贪心647]。","c":[],"color":"#BE123C"},{"t":"→ Q 平均集成 86.4%[贪心647]（留出 84.6%）→ 联合训练分档 93.5%[端到端]（B 交接后 95.4%）。","c":[],"color":"#BE123C"},{"t":"警示：这串箭头不是单调变好——口径在变，且旧单档联合的 97.5% 高于分档课程的 95.4%。","c":[],"color":"#BE123C"},{"t":"复习要点：每个数字后面必须跟口径标签，否则就是错的。","c":[],"color":"#BE123C"}],"color":"#BE123C"},{"t":"9.8 训练 9：BFS 蒸馏底层，步数 19 → 6.64","c":[{"t":"做法：BFS 离线构建「严格第一层」状态距离场当 Oracle，让旧 A 跑 4000 局（On-policy）采 4.8 万条真实数据，用 BFS 打标签做蒸馏。","c":[],"color":"#BE123C"},{"t":"结果：A 的平均解算步数从 19 步降到 6.64 步，且标签绝对正确（不依赖人工规则）。","c":[],"color":"#BE123C"},{"t":"意义：把「搜索的算力」换成「网络的参数」——离线贵、在线便宜。","c":[],"color":"#BE123C"},{"t":"坑：蒸馏数据必须来自当前策略的真实分布（On-policy），否则会过拟合到题库分布。","c":[],"color":"#BE123C"}],"color":"#BE123C"},{"t":"9.9 训练 10/11：多解爆炸与负结果","c":[{"t":"训练 10：用距离场给 B 打硬标签，发现整颗复原平均 4.5 个等价最优动作，CE 硬标签把 B 的 Q 值排序冲毁，成功率暴跌。","c":[],"color":"#BE123C"},{"t":"训练 11：改用 tie-aware CE / Soft KL 仍失败——B 的隐藏层已 Dead ReLU + 低秩固化，线性头学不动，全网络放开又整体漂移。","c":[],"color":"#BE123C"},{"t":"结论：在已高度收敛的 RL 模型上做动作蒸馏，投入产出比极低；这是整套项目最有价值的负结果。","c":[],"color":"#BE123C"},{"t":"面试话术：负结果同样要能解释机制——多解爆炸（监督信号本身不唯一）+ 低秩固化（模型没有可塑性），两条都成立，才敢下「此路不通」的结论。","c":[],"color":"#BE123C"}],"color":"#BE123C"}],"color":"#BE123C"},{"t":"10. 原作者审计与我们的修正","c":[{"t":"10.1 仓库与核对范围","c":[{"t":"对象：github.com/sebastianbrzustowicz/Rubik2x2-DQN @ main，HEAD 1448d8d（2025-11-28），MIT。","c":[],"color":"#4B5563"},{"t":"读了：train_rl / dqn_agent / q_network / replay_buffer / env / reward_interface / run_pipeline / train_il / cube_state / evaluate_rl_model / Makefile / README。","c":[],"color":"#4B5563"}],"color":"#4B5563"},{"t":"10.2 原始实现的实际情况","c":[{"t":"total_steps 参数在 train() 里从未被使用；退出条件是满档 + 成功率 ≥0.99 + 该档 5000 局。","c":[],"color":"#4B5563"},{"t":"细粒度指标（10k 步）只在 use_mlflow=True 时输出；其余 print 只有三处。","c":[],"color":"#4B5563"},{"t":"IL 的 accuracy 算在同一份增强数据集上，没有留出集；README 也写明是 augmented dataset。","c":[],"color":"#4B5563"},{"t":"is_solved() 校验底面 4 块 + 前面底部 2 块，四个侧面只查了两个，所以「底层完成」的判定偏松。","c":[],"color":"#4B5563"},{"t":"函数默认 ε_end=0.5 / sticker_plus_face / batch=128 / lr=1e-3；作者实验脚本与 run_pipeline 用 0.01 / bottom_layer_corners / 256 / 1e-4。","c":[],"color":"#4B5563"},{"t":"Makefile 用 python3 与 .venv/bin（Unix）；emoji print 在 GBK 控制台会崩，需 PYTHONUTF8=1。","c":[],"color":"#4B5563"},{"t":"README 的 Results 表同时列出 max_steps=30（评估 69%）与 100（评估 ~99%），并说明短视野跑不完长打乱。","c":[],"color":"#4B5563"}],"color":"#4B5563"},{"t":"10.3 我们在原作基础上做的事","c":[{"t":"对齐超参：用 planner 的 ε_end=0.01、bottom_layer_corners、batch=256、lr=1e-4 复现，18 万步从 2.4% 起跳。","c":[],"color":"#4B5563"},{"t":"收紧判定：把「底层完成」换成严格第一层（四个底边全对齐），用 BFS 距离场做 Oracle。","c":[],"color":"#4B5563"},{"t":"补蒸馏与容灾：On-policy 采样 + BFS 打标 + CE 蒸馏；A 失败时 Fallback 交 B。","c":[],"color":"#4B5563"},{"t":"补评估：留出集、逐档评估、端到端评估、5 种口径标注，以及 5 种奖励 × 3 seed 的消融。","c":[],"color":"#4B5563"}],"color":"#4B5563"},{"t":"10.4 结论","c":[{"t":"原仓库的架构与文档是完整的：README 有状态编码、课程学习、奖励设计、IL 覆盖说明，还有单元测试、pyproject、CLI、LBL 求解器。","c":[],"color":"#4B5563"},{"t":"我们改的是三处工程问题：默认超参与推荐配置不一致、底层判定偏松、缺少「步数」这个优化目标。","c":[],"color":"#4B5563"},{"t":"对外表述：在原作架构上对齐超参、收紧判定、加蒸馏与容灾，端到端从 93.5% 到 94.75%，步数 30.1 → 15.5。" const FS   = {0:17, 1:13.5, 2:12, 3:11};

const MAXW = {0:360, 1:300, 2:300, 3:400};
const MAXL = {0:99, 1:99, 2:99, 3:99};   // 不再截断：文字按需换行，全部显示（原来是 1/2/2/3 行，超出加省略号）

function isCJK(ch){ return /[\u3000-\u303f\u4e00-\u9fff\uff00-\uffef]/.test(ch); }
function textW(s, fs){ let w=0; for(const ch of s) w += isCJK(ch)?fs:fs*0.56; return w; }

function wrap(text, level){
  const fs = FS[level], budget = MAXW[level], maxL = MAXL[level];
  const chars = [...text], lines = [];
  let cur = "";
  for (const ch of chars){
    if (cur && textW(cur+ch, fs) > budget){
      lines.push(cur); cur = ch;
      if (lines.length >= maxL) break;
    } else cur += ch;
  }
  if (lines.length < maxL && cur) lines.push(cur);
  let used = lines.join("").length;
  if (used < chars.length && lines.length){
    let last = lines[lines.length-1];
    while (last.length > 1 && textW(last+"…", fs) > budget) last = last.slice(0,-1);
    lines[lines.length-1] = last + "…";
  }
  return lines;
}

const LS_SEEDED = "mm-marks-dqn-seeded-v2";
function seedAuthorMarks(){
  try{
    if (localStorage.getItem(LS_SEEDED)) return 0;
    const defaults = MARK_DEFAULTS || {};
    const keys = Object.keys(defaults);
    if (!keys.length){ localStorage.setItem(LS_SEEDED, "1"); return 0; }
    let n = 0;
    keys.forEach(k => {
      const v = defaults[k];
      if (!state.marks[k] && v >= 1 && v <= 3){ state.marks[k] = v; n++; }
    });
    if (n) saveMarks();
    localStorage.setItem(LS_SEEDED, "1");
    return n;
  }catch(e){ return 0; }
}
function loadAuthorMarks(){
  const keys = Object.keys(MARK_DEFAULTS || {});
  if (!keys.length){ alert("这个页面没有内置标记数据。"); return; }
  if (Object.keys(state.marks).length &&
      !confirm("会用作者内置的 " + keys.length + " 条标记覆盖你当前的标记，继续？")) return;
  state.marks = JSON.parse(JSON.stringify(MARK_DEFAULTS));
  saveMarks();
  localStorage.setItem(LS_SEEDED, "1");
  render(true); updateStats();
}
try { state.marks = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; }
catch (e) { state.marks = {}; }
function saveMarks(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state.marks)); } catch(e){} }
let selPath = null;
function markOf(n){ return state.marks[n._path] || 0; }
function cycleMark(n){
  const next = (markOf(n) + 1) % 4;
  if (next === 0) delete state.marks[n._path];
  else state.marks[n._path] = next;
  saveMarks();
  render(true);        // true = 保持当前缩放/平移，不重新适配
  updateStats();
}
function findNodeByPath(n, p){
  if (n._path === p) return n;
  const cs = n.c || [];
  for (let i = 0; i < cs.length; i++){
    const r = findNodeByPath(cs[i], p);
    if (r) return r;
  }
  return null;
}
function setMarkByKey(lv){
  if (!selPath) return false;
  const node = findNodeByPath(DATA, selPath);
  if (!node) return false;
  if (node.c && node.c.length) return false;   // 只有叶子节点可标记
  if (state.marks[selPath] === lv) delete state.marks[selPath];
  else state.marks[selPath] = lv;
  saveMarks();
  render(true);
  updateStats();
  return true;
}
document.addEventListener("keydown", function(e){
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target && e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;
  const k = (e.key || "").toLowerCase();
  const map = { a: 1, s: 2, d: 3 };
  if (!(k in map)) return;
  if (!selPath) return;
  e.preventDefault();
  setMarkByKey(map[k]);
});
function updateStats(){
  const c = [0,0,0,0];
  const walk = (n) => { if (!(n.c && n.c.length)) c[markOf(n)]++; (n.c||[]).forEach(walk); };
  walk(DATA);
  const box = document.getElementById("stats");
  if (!box) return;
  box.innerHTML =
      `<span><i class="dot" style="background:${MARK_COLORS[1]}"></i>不会 <b>${c[1]}</b></span>`
    + `<span><i class="dot" style="background:${MARK_COLORS[2]}"></i>仅了解 <b>${c[2]}</b></span>`
    + `<span><i class="dot" style="background:${MARK_COLORS[3]}"></i>理解 <b>${c[3]}</b></span>`
    + `<span style="opacity:.65">未标记 <b>${c[0]}</b></span>`;
}

function measure(node, level, path){
  node._level = level;
  node._path = path;
  node._lines = wrap(node.t, level);
  node._w = Math.max(...node._lines.map(l => textW(l, FS[level]))) + PADX[level]*2;
  node._h = node._lines.length * (FS[level]*1.4) + PADY[level]*2;
  node._open = !state.collapsed.has(node) && node.c && node.c.length > 0;
  if (node._open) node.c.forEach((ch,i) => measure(ch, level+1, path + "-" + i));
}

/* 一侧布局：dir=+1 向右，dir=-1 向左。返回该侧高度 */
function layoutSide(nodes, dir, x0){
  let cursor = 0;
  function place(node, level, colX){
    // colX: 该节点列的「锚点」：右向为左边缘，左向为右边缘
    node._dir = dir;
    if (dir > 0){ node._x = colX; }
    else { node._x = colX - node._w; }
    if (!node._open || !node.c || !node.c.length){
      node._y = cursor;
      cursor += node._h + GAPY[Math.min(level,3)];
      return node._y + node._h/2;
    }
    const nextX = dir > 0
      ? colX + node._w + GAPX[Math.min(level,3)]
      : colX - node._w - GAPX[Math.min(level,3)];
    const centers = node.c.map(ch => place(ch, level+1, nextX));
    node._y = (Math.min(...centers) + Math.max(...centers))/2 - node._h/2;
    return node._y + node._h/2;
  }
  nodes.forEach(st => place(st, 1, x0));
  return { height: cursor };
}

function collect(node, out){
  out.push(node);
  if (node._open) node.c.forEach(ch => collect(ch, out));
  return out;
}

function assignPaths(node, path){
  node._path = path;
  (node.c||[]).forEach((ch,i) => assignPaths(ch, path + "-" + i));
}

function build(){
  // 0. 先给全部节点分配路径（折叠的也要有，否则标记会串号）
  assignPaths(DATA, "r");
  // 1. 测量
  measure(DATA, 0, "r");
  // 2. 分左右（交替）
  const rightStages = [], leftStages = [];
  DATA.c.forEach((st, i) => { (i % 2 === 0 ? rightStages : leftStages).push(st); });
  // 3. 两侧布局（先在各自局部坐标）
  const R = layoutSide(rightStages, +1, 0);
  const L = layoutSide(leftStages, -1, 0);

  // 左内侧的局部 x 范围：最右是 0，最左是负值
  let leftMinX = 0, rightMaxX = 0;
  const walkX = (n, pick) => { pick(n); if (n._open) n.c.forEach(ch => walkX(ch, pick)); };
  leftStages.forEach(st => walkX(st, n => { leftMinX = Math.min(leftMinX, n._x); }));
  rightStages.forEach(st => walkX(st, n => { rightMaxX = Math.max(rightMaxX, n._x + n._w); }));

  const leftW = -leftMinX;
  const gapR = GAPX[0], rootW = DATA._w;
  // 水平位移：左侧整体平移到 0 起，根紧随其后
  const shiftLeft = leftW;
  const rootX = leftW + gapR;
  const shiftRight = rootX + rootW + gapR;

  const shiftSide = (stages, dx, dy) => {
    stages.forEach(st => {
      const walk = n => { n._x += dx; n._y += dy; if (n._open) n.c.forEach(walk); };
      walk(st);
    });
  };

  const H = Math.max(R.height, L.height);
  // 垂直居中：两侧各自居中
  const dyR = (H - R.height) / 2;
  const dyL = (H - L.height) / 2;
  shiftSide(rightStages, shiftRight, dyR);
  shiftSide(leftStages, shiftLeft, dyL);

  DATA._x = rootX;
  DATA._y = H/2 - DATA._h/2;

  // 收集所有可见节点
  const nodes = [];
  collect(DATA, nodes);

  return { nodes, rootX, rootW, totalH: H };
}

/* ---------- 渲染 ---------- */
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map");
const scene = document.getElementById("scene");
function el(tag, attrs){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }

function render(keepView){
  const keep = keepView ? { s:state.scale, x:state.tx, y:state.ty } : null;
  const { nodes } = build();
  scene.innerHTML = "";

  const gE = el("g", {});
  const drawEdge = (p, c) => {
    const px = p._dir > 0 ? p._x + p._w : p._x;
    const py = p._y + p._h/2;
    const cx = c._dir > 0 ? c._x : c._x + c._w;
    const cy = c._y + c._h/2;
    const mx = (px + cx) / 2;
    gE.appendChild(el("path", {
      d:`M ${px} ${py} C ${mx} ${py}, ${mx} ${cy}, ${cx} ${cy}`,
      fill:"none", stroke:c.color || "#9ca3af",
      "stroke-width": c._level === 1 ? 2 : 1.2,
      "stroke-linecap":"round",
      opacity: c._level === 1 ? .9 : .5
    }));
  };
  nodes.forEach(n => { if (n._open && n.c) n.c.forEach(ch => drawEdge(n, ch)); });
  scene.appendChild(gE);

  const gN = el("g", {});
  nodes.forEach(n => {
    const lv = n._level;
    const g = el("g", { class:"node", "data-p": n._path || "" });
    const isRoot = lv === 0;
    const isLeaf = !(n.c && n.c.length);
    const mk = (!isRoot && isLeaf) ? markOf(n) : 0;
    const fill0 = isRoot ? "#111827" : (lv === 1 ? (n.color || "#334155") : "#ffffff");
    const stroke0 = isRoot ? "#111827" : (lv === 1 ? (n.color || "#334155")
                   : (lv === 2 ? (n.color || "#d6d3ce") : (n.color || "#d6d3ce")));
    const rect = el("rect", {
      x:n._x, y:n._y, width:n._w, height:n._h,
      rx: isRoot ? 12 : 8,
      fill: mk ? MARK_TINTS[mk] : fill0,
      stroke: mk ? MARK_COLORS[mk] : stroke0,
      "stroke-width": mk ? 1.8 : (lv === 1 ? 0 : (lv === 2 ? 1.1 : 0.9)),
      "stroke-opacity": mk ? 1 : (lv >= 3 ? .35 : 1)
    });
    if (lv === 2 && !mk) rect.setAttribute("stroke-opacity", ".55");
    if (!isRoot && isLeaf && n._path && n._path === selPath){
      rect.setAttribute("stroke", "#2563eb");
      rect.setAttribute("stroke-width", "2.6");
      rect.setAttribute("stroke-opacity", "1");
    }
    g.appendChild(rect);

    const fs = FS[lv], lh = fs*1.4;
    const totalH = n._lines.length * lh;
    const startY = n._y + (n._h - totalH)/2 + lh/2;
    n._lines.forEach((line, i) => {
      const t = el("text", {
        y: startY + i*lh,
        "font-size": fs,
        "font-weight": isRoot ? 800 : (lv === 1 ? 700 : (lv === 2 ? 600 : 400)),
        fill: isRoot ? "#ffffff" : (lv === 1 ? "#ffffff" : (lv === 2 ? "#1f2937" : "#4b5563"))
      });
      if (n._dir > 0 && !isRoot){
        t.setAttribute("x", n._x + PADX[lv]);
        t.setAttribute("text-anchor", "start");
      } else if (n._dir < 0 && !isRoot){
        t.setAttribute("x", n._x + n._w - PADX[lv]);
        t.setAttribute("text-anchor", "end");
      } else {
        t.setAttribute("x", n._x + PADX[lv]);
        t.setAttribute("text-anchor", "start");
      }
      t.textContent = line;
      g.appendChild(t);
    });

    if (n.c && n.c.length){
      const cx = n._dir > 0 || isRoot ? n._x + n._w + 12 : n._x - 12;
      const cy = n._y + n._h/2;
      g.appendChild(el("circle", { cx, cy, r:7.5, fill:"#fff",
        stroke:n.color || "#9ca3af", "stroke-width":1.2 }));
      const tt = el("text", { x:cx, y:cy+0.5, "text-anchor":"middle",
        "font-size":9.5, "font-weight":700, fill:n.color || "#9ca3af" });
      tt.textContent = n._open ? "−" : String(n.c.length);
      g.appendChild(tt);
    } else {
      /* ----- 叶子节点：学习状态小圆按钮 ----- */
      const cx = (n._dir > 0 || isRoot) ? n._x + n._w + 12 : n._x - 12;
      const cy = n._y + n._h/2;
      const gm = el("g", { class:"mark" });
      gm.appendChild(el("circle", {
        cx, cy, r:8,
        fill: mk ? MARK_COLORS[mk] : "#ffffff",
        stroke: mk ? MARK_COLORS[mk] : "#c3c9d2",
        "stroke-width": mk ? 1 : 1.3,
        "stroke-dasharray": mk ? "0" : "2.2 2.2"
      }));
      if (mk){
        const chk = el("text", {
          x:cx, y:cy+0.6, "text-anchor":"middle",
          "font-size":9, "font-weight":800, fill:"#ffffff"
        });
        chk.textContent = mk === 3 ? "✓" : (mk === 2 ? "~" : "✕");
        gm.appendChild(chk);
      }
      const ttl = el("title", {});
      ttl.textContent = `【${MARK_NAMES[mk]}】点击切换：不会 → 仅了解 → 理解 → 取消`;
      gm.appendChild(ttl);
      gm.addEventListener("click", ev => { ev.stopPropagation(); cycleMark(n); });
      g.appendChild(gm);
    }

    const title = el("title", {}); title.textContent = n.t; g.appendChild(title);
    g.addEventListener("click", ev => {
      ev.stopPropagation();
      selPath = (!isRoot && isLeaf && n._path) ? n._path : null;
      if (n.c && n.c.length){
        if (state.collapsed.has(n)) state.collapsed.delete(n); else state.collapsed.add(n);
        renderKeepNode(n);
      }
    });
    gN.appendChild(g);
  });
  scene.appendChild(gN);
  if (keep){ state.scale = keep.s; state.tx = keep.x; state.ty = keep.y; apply(); }
  else fit();
  buildLegend();
  updateStats();
}

/* 展开/折叠后保持视图：以被点击节点为锚点，缩放与位置都不重置 */
function renderKeepNode(n){
  if (!n || n._x == null || n._y == null){ render(true); return; }
  const ax = state.tx + n._x * state.scale;     // 点击节点在屏幕上的位置（渲染前）
  const ay = state.ty + n._y * state.scale;
  render(true);                                  // true = 沿用当前缩放/平移
  if (n._x == null || n._y == null) return;
  state.tx += ax - (state.tx + n._x * state.scale);   // 把同一个节点挪回原处
  state.ty += ay - (state.ty + n._y * state.scale);
  apply();
}

/* ---------- 缩放/平移 ---------- */
function apply(){
  scene.setAttribute("transform", `translate(${state.tx},${state.ty}) scale(${state.scale})`);
  document.getElementById("zoomval").textContent = Math.round(state.scale*100) + "%";
}
function fit(){
  const bb = scene.getBBox();
  if (!bb.width) return;
  const W = svg.clientWidth, H = svg.clientHeight;
  const padX = 70, padTop = 86, padBottom = 62;
  const s = Math.min((W - padX*2)/bb.width, (H - padTop - padBottom)/bb.height, 1.25);
  state.scale = Math.max(s, 0.1);
  state.tx = (W - bb.width*state.scale)/2 - bb.x*state.scale;
  state.ty = padTop + (H - padTop - padBottom - bb.height*state.scale)/2 - bb.y*state.scale;
  apply();
}

svg.addEventListener("wheel", e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = e.deltaY < 0 ? 1.12 : 1/1.12;
  const ns = Math.min(Math.max(state.scale*k, 0.06), 3);
  const q = ns/state.scale;
  state.tx = mx - (mx-state.tx)*q;
  state.ty = my - (my-state.ty)*q;
  state.scale = ns; apply();
}, { passive:false });

let drag=false, lx=0, ly=0;
svg.addEventListener("mousedown", e => { drag=true; lx=e.clientX; ly=e.clientY; svg.classList.add("dragging"); });
window.addEventListener("mousemove", e => {
  if(!drag) return;
  state.tx += e.clientX-lx; state.ty += e.clientY-ly; lx=e.clientX; ly=e.clientY; apply();
});
window.addEventListener("mouseup", () => { drag=false; svg.classList.remove("dragging"); });

function buildLegend(){
  const box = document.getElementById("legend"); box.innerHTML = "";
  DATA.c.forEach(st => {
    const s = document.createElement("span");
    s.innerHTML = `<i style="background:${st.color}"></i>${st.t.split("：")[0]}`;
    box.appendChild(s);
  });
}

function setAll(fn){
  const walk = (n, d) => { if (fn(n, d)) state.collapsed.add(n); else state.collapsed.delete(n);
                           (n.c||[]).forEach(ch => walk(ch, d+1)); };
  walk(DATA, 0);
  state.collapsed.delete(DATA);
  render();
}
document.getElementById("btn-expand").onclick = () => setAll(() => false);
document.getElementById("btn-collapse").onclick = () => setAll((n,d) => d >= 1);
document.getElementById("btn-items").onclick = () => setAll((n,d) => d >= 2);
document.getElementById("btn-fit").onclick = () => render();
document.getElementById("btn-in").onclick = () => { state.scale = Math.min(state.scale*1.18,3); apply(); };
document.getElementById("btn-out").onclick = () => { state.scale = Math.max(state.scale/1.18,0.06); apply(); };
document.getElementById("btn-reset").onclick = () => {
  if (!confirm("确定清空所有学习状态标记？")) return;
  state.marks = {}; saveMarks();
  try { localStorage.setItem(LS_SEEDED, "1"); } catch(e){}
  render(true); updateStats();
};

/* ===== 标记导出 / 导入：用于同步到 U 盘 ===== */
function exportMarks(){
  const keys = Object.keys(state.marks);
  const payload = {
    app: "前后端数据沟通全链路-学习标记",
    version: 1,
    exportedAt: new Date().toISOString(),
    total: keys.length,
    marks: state.marks
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const d = new Date();
  const ymd = d.getFullYear() + "-" +
              String(d.getMonth()+1).padStart(2,"0") + "-" +
              String(d.getDate()).padStart(2,"0");
  const a = document.createElement("a");
  a.href = url;
  a.download = "学习标记-" + ymd + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  alert("已导出 " + keys.length + " 条标记\n\n文件名：学习标记-" + ymd + ".json\n（在浏览器下载目录里）\n\n把它拷到 U 盘，换电脑时用「导入标记」恢复。");
}

function importMarks(file){
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const obj = JSON.parse(fr.result);
      const marks = obj.marks || obj;
      if (typeof marks !== "object" || marks === null || Array.isArray(marks)) throw new Error("不是有效的标记文件");
      const keys = Object.keys(marks).filter(k => /^r(-\d+)+$/.test(k) && marks[k] >= 1 && marks[k] <= 3);
      if (!keys.length) throw new Error("文件里没有可用的标记");
      if (!confirm("将导入 " + keys.length + " 条标记。\n\n规则：同一知识点以导入文件为准，其余保留你当前的标记。\n\n继续？")) return;
      keys.forEach(k => { state.marks[k] = marks[k]; });
      saveMarks(); render(true); updateStats();
      alert("导入完成。\n当前共 " + Object.keys(state.marks).length + " 条标记。");
    } catch (e) {
      alert("导入失败：" + e.message + "\n\n请确认选的是「导出标记」生成的 json 文件。");
    }
  };
  fr.readAsText(file, "utf-8");
}

const _authorBtn = document.getElementById("btn-author");
if (_authorBtn) _authorBtn.onclick = loadAuthorMarks;
document.getElementById("btn-export").onclick = exportMarks;
document.getElementById("btn-import").onclick = () => document.getElementById("file-import").click();
document.getElementById("file-import").addEventListener("change", ev => {
  const f = ev.target.files && ev.target.files[0];
  if (f) importMarks(f);
  ev.target.value = "";
});


/* 初始视图：默认「展开到环节」；可用 ?view=all|collapse|items 指定 */
(function(){
  state.collapsed.clear();
  const v = (new URLSearchParams(location.search)).get("view") || "items";
  const walk = (n, d) => { if (d >= 2) state.collapsed.add(n); (n.c||[]).forEach(ch => walk(ch, d+1)); };
  if (v === "items"){
    DATA.c.forEach(st => walk(st, 1));
  } else if (v === "all"){
    /* 什么都不折叠 */
  } else if (v === "collapse"){
    DATA.c.forEach(st => state.collapsed.add(st));
  }
})();
/* 首次访问：把作者标记作为初始状态 */
const _seeded = seedAuthorMarks();
if (_seeded){
  const _h = document.querySelector(".hint");
  if (_h) _h.innerHTML += ' · <b>已载入作者 ' + _seeded + ' 条标记</b>';
}
render();
window.addEventListener("resize", () => { clearTimeout(window._t); window._t = setTimeout(apply, 120); });
</script>

<script>
/* ============ 手机端：竖排大纲模式（原生滚动，不缩放画布） ============ */
(function(){
  if (window.innerWidth > 900) return;

  document.body.classList.add("mobile");
  const bar  = document.querySelector(".topbar");
  const hint = document.querySelector(".hint");

  const box = document.createElement("div");
  box.id = "outline";
  document.body.appendChild(box);

  function fitBox(){
    const h = bar.getBoundingClientRect().height;
    box.style.top = h + "px";
  }
  fitBox();

  /* 路径 -> 节点 索引 */
  const P2N = {};
  (function index(n){
    if (n._path) P2N[n._path] = n;
    (n.c || []).forEach(index);
  })(DATA);

  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  /* 默认展开到「环节」，细节先收起 */
  state.collapsed.clear();
  (function init(n, d){
    if (d >= 2) state.collapsed.add(n);
    (n.c || []).forEach(ch => init(ch, d + 1));
  })(DATA, 0);

  function draw(){
    const out = [];
    (function walk(n, d){
      const lv = Math.min(d, 3);
      const hasKids = n.c && n.c.length;
      const open = hasKids && !state.collapsed.has(n);
      const mk = state.marks[n._path] || 0;
      const color = n.color || "#475569";

      let bg = "#fff", border = "#e5e2db";
      if (lv === 0){ bg = "#111827"; border = "#111827"; }
      else if (lv === 1){ bg = color; border = color; }
      else if (mk){ bg = MARK_TINTS[mk]; border = MARK_COLORS[mk]; }

      out.push('<div class="oln">');
      out.push('<div class="olrow lv' + lv + '" data-p="' + n._path +
               '" style="background:' + bg + ';border-color:' + border + '">');
      if (hasKids){
        out.push('<span class="oltog">' + (open ? "−" : n.c.length) + '</span>');
      } else {
        out.push('<span class="oltog" style="visibility:hidden"></span>');
      }
      out.push('<span class="oltext">' + esc(n.t) + '</span>');
      if (!hasKids){
        const sym = mk === 3 ? "✓" : mk === 2 ? "~" : mk === 1 ? "✕" : "";
        out.push('<span class="olmk" data-mark="' + n._path + '" style="border-style:' +
                 (mk ? "solid" : "dashed") + ';border-color:' + (mk ? MARK_COLORS[mk] : "#c3c9d2") +
                 ';background:' + (mk ? MARK_COLORS[mk] : "#fff") + '">' + sym + '</span>');
      }
      out.push('</div>');
      if (open){
        out.push('<div class="olkids">');
        n.c.forEach(ch => walk(ch, d + 1));
        out.push('</div>');
      }
      out.push('</div>');
    })(DATA, 0);
    box.innerHTML = out.join("");
  }

  /* 让 cycleMark / setAll 等既有逻辑都走大纲渲染 */
  window.render = function(){ draw(); updateStats(); };

  function cyclePath(p){
    const next = ((state.marks[p] || 0) + 1) % 4;
    if (next === 0) delete state.marks[p];
    else state.marks[p] = next;
    saveMarks();
    draw();
    updateStats();
  }

  box.addEventListener("click", ev => {
    const mk = ev.target.closest("[data-mark]");
    if (mk){ ev.stopPropagation(); cyclePath(mk.getAttribute("data-mark")); return; }

    const row = ev.target.closest(".olrow");
    if (!row) return;
    const n = P2N[row.getAttribute("data-p")];
    if (!n || !(n.c && n.c.length)) return;
    if (state.collapsed.has(n)) state.collapsed.delete(n);
    else state.collapsed.add(n);
    draw();
  });

  if (hint) hint.textContent = "点节点展开/折叠 · 点小圆标掌握度 · 上下滑动";

  draw();
  window.addEventListener("resize", () => {
    fitBox();
    if (window.innerWidth > 900) location.reload();
  });
  window.addEventListener("orientationchange", () => setTimeout(fitBox, 300));
})();
</script>


<script>
/* 标记下拉：点按钮开合，点别处 / 选完自动收起 */
(function(){
  const menu = document.getElementById("mkmenu");
  const btn  = document.getElementById("btn-mk");
  if (!menu || !btn) return;
  const close = () => menu.classList.remove("open");
  btn.addEventListener("click", ev => {
    ev.stopPropagation();
    menu.classList.toggle("open");
  });
  document.addEventListener("click", ev => {
    if (!menu.contains(ev.target)) close();
  }, true);
  // 点击下拉里的任意一项（导出/导入/清空）后收起
  menu.querySelector(".mklist").addEventListener("click", ev => {
    if (ev.target.tagName === "BUTTON") setTimeout(close, 0);
  });
  document.addEventListener("keydown", ev => { if (ev.key === "Escape") close(); });
})();
</script>

<script>
/* === 孤立标记修复（结构改版后老标记上推）=== */
(function(){
  function nodePaths(){
    const set = new Set();
    (function walk(n){ if (n && n._path) set.add(n._path); (n && n.c || []).forEach(walk); })(DATA);
    return set;
  }
  function split(path){
    // "r-0-1-2" → ["r","0","1","2"]
    const i = path.indexOf("-");
    return i < 0 ? [path] : [path.slice(0, i)].concat(path.slice(i + 1).split("-"));
  }
  function report(){
    const valid = nodePaths();
    const keys = Object.keys(state.marks);
    const bad = keys.filter(k => !valid.has(k));
    return { total: keys.length, ok: keys.length - bad.length, bad };
  }
  function mkCheck(){
    const r = report();
    let msg = "节点数：" + nodePaths().size + "\n"
            + "本地标记：" + r.total + " 条\n"
            + "  对得上节点：" + r.ok + " 条\n"
            + "  孤立（对不上）：" + r.bad.length + " 条";
    if (r.bad.length){
      msg += "\n\n孤立键示例：\n  " + r.bad.slice(0, 6).join("\n  ");
      msg += "\n\n说明：孤立标记是页面结构改版前留下的，可点「修复旧标记」上推到最近的现存父节点。";
    }
    alert(msg);
  }
  function mkRepair(){
    const r = report();
    if (!r.bad.length){ alert("很好：没有孤立标记，不需要修复。\n\n当前 " + r.total + " 条标记全部对得上节点。"); return; }
    const valid = nodePaths();
    const targets = {};
    let moved = 0, dropped = 0;
    r.bad.forEach(k => {
      const v = +state.marks[k];
      const parts = split(k);
      let hit = null;
      // 至少落到「阶段-环节」这一层，不要把标记推到根节点 r（根不参与统计、没有意义）
      for (let n = parts.length - 1; n >= 2; n--){
        const cand = parts.slice(0, n).join("-");
        if (valid.has(cand)){ hit = cand; break; }
      }
      if (!hit || !(v >= 1 && v <= 3)){ dropped++; return; }
      targets[hit] = targets[hit] ? Math.min(targets[hit], v) : v;  // 同节点取最保守等级
      moved++;
    });
    const tk = Object.keys(targets);
    if (!tk.length){
      alert("发现 " + r.bad.length + " 条孤立标记，但都无法对应到现存节点（层级完全不匹配）。\n\n建议：在曾经标记过的那台设备/浏览器上打开本页「导出标记」，再用「导入标记」导入。");
      return;
    }
    if (!confirm("发现 " + r.bad.length + " 条孤立标记（页面结构改过，对不上节点）。\n\n"
      + "可以把它们「上推」到最近的现存父节点：\n  " + tk.length + " 个节点将获得标记（同节点取最保守等级）\n"
      + "  " + dropped + " 条会被丢弃（找不到对应父节点）\n\n"
      + "修复前会自动备份当前标记。原有能对上的标记不受影响。\n\n继续？")) return;
    try { localStorage.setItem("mm-marks-dqn-backup-v1", JSON.stringify(state.marks)); } catch(e){}
    tk.forEach(k => {
      const cur = state.marks[k] || 0;
      state.marks[k] = cur ? Math.min(cur, targets[k]) : targets[k];
    });
    r.bad.forEach(k => { delete state.marks[k]; });
    saveMarks();
    render(true); updateStats();
    alert("完成\n  上推 " + moved + " 条 → " + tk.length + " 个节点\n  丢弃 " + dropped + " 条\n"
      + "  当前标记共 " + Object.keys(state.marks).length + " 条\n\n"
      + "（修复前的状态已备份，需要回退请删掉 localStorage 的 mm-marks-dqn-backup-v1 后重新导入）");
  }
  const c = document.getElementById("btn-mk-check");
  const rp = document.getElementById("btn-mk-repair");
  if (c) c.onclick = mkCheck;
  if (rp) rp.onclick = mkRepair;
})();
</script>
</body>
