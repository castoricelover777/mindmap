<script>
/* ================= 共享层：元素、标记、缩放、模式 ================= */
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map");
const scene = document.getElementById("scene");
function el(tag, attrs){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
const $ = id => document.getElementById(id);
/* 顶栏可能因窗口变窄而换行：按实测高度留上边距，避免内容被顶栏压住 */
function topPadPx(extra){
  const b = document.querySelector(".topbar");
  const h = (b && b.offsetHeight) ? b.offsetHeight : 60;
  return h + extra;
}

/* ================= 文字测量与折行（两种模式共用一套） =================
   用 Canvas measureText 真实测量宽度（不是按字符数估算），
   再按「CJK 单字成词、英文按空格切词」折行，避免把 Axios 劈成 A / xios。 */
function isCJK(ch){ return /[\u3000-\u303f\u4e00-\u9fff\uff00-\uffef]/.test(ch); }
const _mc = document.createElement("canvas").getContext("2d");
let _fontFam = null;
const _wCache = new Map();
function textW(s, fs, weight){
  const w = weight || 400;
  const key = w + "|" + fs + "|" + s;
  const hit = _wCache.get(key);
  if (hit !== undefined) return hit;
  if (_fontFam === null) _fontFam = getComputedStyle(document.body).fontFamily;
  _mc.font = w + " " + fs + "px " + _fontFam;
  const v = _mc.measureText(s).width;
  _wCache.set(key, v);
  return v;
}
function tokenize(s){
  // CJK/标点 单字成词；英文按空格切词（空格并入前一词，作为断行点）
  const out = []; let buf = "";
  for (const ch of s){
    if (isCJK(ch)){
      if (buf){ out.push(buf); buf = ""; }
      out.push(ch);
    } else if (ch === " "){
      buf += ch; out.push(buf); buf = "";
    } else {
      buf += ch;
    }
  }
  if (buf) out.push(buf);
  // 收尾标点并到前一个词，避免“）”单独占一行
  const merged = [];
  for (const tk of out){
    if (merged.length && /^[）】」』，。、；：？！\)\]%]+$/.test(tk)) merged[merged.length-1] += tk;
    else merged.push(tk);
  }
  return merged;
}
/* 单词本身就比行宽还长时（超长标识符），才退化成按字符切 */
function splitLong(tk, fs, budget, weight){
  if (textW(tk, fs, weight) <= budget) return [tk];
  const out = []; let rest = tk;
  while (rest){
    let n = 1;
    while (n < rest.length && textW(rest.slice(0, n+1), fs, weight) <= budget) n++;
    out.push(rest.slice(0, n));
    rest = rest.slice(n);
  }
  return out;
}
function wrap2(s, fs, budget, maxL, weight){
  const toks = [];
  tokenize(s).forEach(tk => splitLong(tk, fs, budget, weight).forEach(x => toks.push(x)));
  const lines = []; let cur = "";
  for (const tk of toks){
    const test = cur + tk;
    if (cur && textW(test, fs, weight) > budget){
      lines.push(cur); cur = tk;
      if (lines.length >= maxL){ cur = ""; break; }
    } else cur = test;
  }
  if (cur && lines.length < maxL) lines.push(cur);
  // 用「去空白后的字符数」判断是否真的有内容没放下（避免空格导致误判）
  const full = toks.join("").replace(/\s/g, "");
  const used = lines.join("").replace(/\s/g, "");
  if (used.length < full.length && lines.length){
    let last = lines[lines.length-1];
    while (last.length > 1 && textW(last+"…", fs, weight) > budget) last = last.slice(0,-1);
    lines[lines.length-1] = last + "…";
  }
  return lines;
}

const DATA = {"t":"魔方 DQN 技术蜈蚣：144 维数据的全链路技术地图","c":[{"t":"核心术语（先把大词拎清楚）","c":[{"t":"RL · 强化学习 —— 自己试错、按奖励改策略，没人给标准答案。","c":[],"color":"#0F766E"},{"t":"IL · 模仿学习 —— 先抄 648 条专家公式，押错就罚（交叉熵）。","c":[],"color":"#0F766E"},{"t":"HRL · 分层强化学习 —— A 修底层、B 修整颗，中间靠交班衔接。","c":[],"color":"#0F766E"},{"t":"BFS 蒸馏 —— 全知搜索先算出最短步数，再让小网络背下来。","c":[],"color":"#0F766E"},{"t":"TD 学习 —— 下一步估值 + 本次奖励 = 学习目标。","c":[],"color":"#0F766E"},{"t":"Target Network —— 老教授每 1000 步抄一次作业当标准答案。","c":[],"color":"#0F766E"},{"t":"经验回放 Replay Buffer —— 走过的每一步存下来、随机抽出来复习。","c":[],"color":"#0F766E"},{"t":"Anchor 锚定 —— 专家动作挂 1000 倍紧箍咒，偏离就重罚。","c":[],"color":"#0F766E"},{"t":"课程学习 —— 打乱长度 1→10 档，考及格才换更难的卷。","c":[],"color":"#0F766E"},{"t":"奖励塑形 Reward Shaping —— 按进步幅度发奖金，防止原地刷分。","c":[],"color":"#0F766E"},{"t":"Fallback 容灾 —— A 卡 30 步就让 B 接管残局。","c":[],"color":"#0F766E"},{"t":"灾难性遗忘 —— 学新的忘旧的：78.7% → 14%。","c":[],"color":"#0F766E"},{"t":"多解爆炸 —— 同一残局 4.5 条等价走法，硬塞会打架。","c":[],"color":"#0F766E"},{"t":"低秩固化 —— 网络表示塌缩，再微调也学不动。","c":[],"color":"#0F766E"},{"t":"探索与利用 ε-greedy —— ε 概率瞎试，其余走当前最优。","c":[],"color":"#0F766E"}],"color":"#0F766E"},{"t":"项目事实数字（报数口径）","c":[{"t":"94.75% 端到端成功率 —— 训练 9 最终成绩，n=200。","c":[],"color":"#9A3412"},{"t":"15.5 步总步数 —— A 6.64 + B 7.35；原来 30.1 步。","c":[],"color":"#9A3412"},{"t":"2.4% → 87.5% 底层 —— 修 ε + 进度塑形，5 万步 23 秒。","c":[],"color":"#9A3412"},{"t":"107,538 参数 —— 144→256→256→18 三层网络。","c":[],"color":"#9A3412"},{"t":"648 条专家公式 —— IL 热启动，单步准确率 94.5%。","c":[],"color":"#9A3412"},{"t":"4.5 个等价最优动作 —— 多解爆炸的量化依据。","c":[],"color":"#9A3412"},{"t":"3,674,160 个状态 —— 二阶魔方全状态，BFS 规模。","c":[],"color":"#9A3412"},{"t":"每局 30 步 —— 评估口径；超 30 步触发 Fallback。","c":[],"color":"#9A3412"}],"color":"#9A3412"},{"t":"A.1 入口 · 144 维张量","c":[{"t":"One-Hot 编码","c":[{"t":"【详解】144 维 = 24 个贴纸位 × 6 种颜色：每个贴纸只在对应颜色位上放 1。颜色没有大小关系，只能这样表示，网络才不会把「颜色 5」误读成比「颜色 0」大。","c":[],"color":"#0E7490"},{"t":"【术语·One-Hot】把一个值变成一排开关，只有对应那个开关是 1、其余全 0；颜色没有大小之分，只能这么表示。","c":[],"color":"#0E7490"},{"t":"【术语·稀疏向量】144 个数里绝大多数是 0，只有 24 个位置是 1——像一张大表上只打了 24 个勾。","c":[],"color":"#0E7490"}],"color":"#0E7490"},{"t":"为什么不用颜色标量","c":[{"t":"【详解】如果直接用 0~5 当数字喂进去，网络会以为颜色之间存在顺序和距离，学到的是假规律。类别型信息必须先独热，再谈网络结构。","c":[],"color":"#0E7490"},{"t":"【术语·One-Hot】把一个值变成一排开关，只有对应那个开关是 1、其余全 0；颜色没有大小之分，只能这么表示。","c":[],"color":"#0E7490"}],"color":"#0E7490"},{"t":"动作空间 Discrete(18)","c":[{"t":"【详解】6 个面 × 3 个旋转方向 = 18 个动作，输出层必须正好 18 个数。多一个少一个，都对不上环境返回的动作索引。","c":[],"color":"#0E7490"},{"t":"【术语·argmax】在 18 个打分里直接挑最大的那个动作。","c":[],"color":"#0E7490"},{"t":"【术语·logits】最后一步没经过任何压缩的原始打分，可正可负、可大可小，softmax 之前的状态。","c":[],"color":"#0E7490"}],"color":"#0E7490"},{"t":"状态哈希（BFS 的钥匙）","c":[{"t":"【详解】144 维向量只用来喂网络；BFS 查表要先压成短字符串或整数键，才能在 3,674,160 个状态里快速找到「离终点还剩几步」。","c":[],"color":"#0E7490"},{"t":"【术语·状态哈希】把 144 维的长向量压成一个短字符串或整数编号，才能塞进 BFS 的字典里当钥匙。","c":[],"color":"#0E7490"},{"t":"【术语·BFS 距离场】从终点倒着把所有状态的最短步数都算出来，得到一张「离复原还剩几步」的绝对精确地图。","c":[],"color":"#0E7490"}],"color":"#0E7490"},{"t":"环境与奖励口径","c":[{"t":"【详解】一局最多 30 步、打乱长度按 1~10 档课程递进；奖励 = 完成给 1 分 + 进度增量塑形。所有对比实验必须锁死这套口径，否则数字不可比。","c":[],"color":"#0E7490"},{"t":"【术语·折扣因子 γ】未来的奖励要打折，越远越不值钱——避免模型为了遥远的幻想放弃眼前的一步。","c":[],"color":"#0E7490"}],"color":"#0E7490"},{"t":"维度顺序的坑","c":[{"t":"【详解】One-Hot 的拼接顺序必须和动作索引、648 条专家公式表严格一致。错一位，训练能跑、Loss 也降，但模型永远学不对，还不报错。","c":[],"color":"#0E7490"},{"t":"【术语·One-Hot】把一个值变成一排开关，只有对应那个开关是 1、其余全 0；颜色没有大小之分，只能这么表示。","c":[],"color":"#0E7490"}],"color":"#0E7490"}],"color":"#0E7490","tech":1},{"t":"A.2 记忆 · 回放池","c":[{"t":"环形数组","c":[{"t":"【详解】预先分配一块 (容量,144) 的固定内存，写满后新样本从开头覆盖最老的。这样训练百万步不会越用越碎，也不会突然卡顿。","c":[],"color":"#0891B2"},{"t":"【术语·环形数组】预先占好一块固定内存，写满就从开头覆盖最老的，不会越训练越碎、越用越慢。","c":[],"color":"#0891B2"},{"t":"【术语·Replay Buffer】错题本：把走过的每一步都存起来，训练时随机抽样本出来复习。","c":[],"color":"#0891B2"}],"color":"#0891B2"},{"t":"随机抽 batch=256","c":[{"t":"【详解】每次从池子里随机抽 256 条经验一起算。随机是为了打断前后样本的时间相关性，让训练更像在独立数据上学习。","c":[],"color":"#0891B2"},{"t":"【术语·batch】一次拿多少条样本一起算，本项目 256 条；算完一批才更新一次参数。","c":[],"color":"#0891B2"},{"t":"【术语·时间相关性】前后相邻的样本太像，连着学容易学偏，所以要打乱、随机抽。","c":[],"color":"#0891B2"}],"color":"#0891B2"},{"t":"存什么","c":[{"t":"【详解】每条经验存 (s, a, r, s', done) 五元组；取出来后堆成 [256,144] 的张量送进网络，第 0 维永远是 batch。","c":[],"color":"#0891B2"},{"t":"【术语·batch】一次拿多少条样本一起算，本项目 256 条；算完一批才更新一次参数。","c":[],"color":"#0891B2"}],"color":"#0891B2"},{"t":"容量权衡","c":[{"t":"【详解】容量太小只记得最近几盘，容易学了新忘旧；太大则样本过时、更新滞后。本项目按百万步量级估容量。","c":[],"color":"#0891B2"},{"t":"【术语·Replay Buffer】错题本：把走过的每一步都存起来，训练时随机抽样本出来复习。","c":[],"color":"#0891B2"}],"color":"#0891B2"},{"t":"PER 延伸","c":[{"t":"【详解】优先经验回放按 TD 误差加权采样，多犯错的样本多复习。本项目用均匀随机、没上 PER，但面试常问区别。","c":[],"color":"#0891B2"},{"t":"【术语·TD Error】目标值和当前预估之间的差价，训练就是追着这个差价跑。","c":[],"color":"#0891B2"},{"t":"【术语·Replay Buffer】错题本：把走过的每一步都存起来，训练时随机抽样本出来复习。","c":[],"color":"#0891B2"}],"color":"#0891B2"}],"color":"#0891B2","tech":1},{"t":"A.3 第一层 · 144→256","c":[{"t":"Linear(144, 256) + b1","c":[{"t":"【详解】把 144 个输入乘权重再求和，压成 256 个「特征探测器」，再套 ReLU。这一层参数 144×256+256 = 37,120，占全网络 34.5%。","c":[],"color":"#2563EB"},{"t":"【术语·Linear 层】一层「乘权重再求和」的换算，本质是一次矩阵乘法，再加一个偏置。","c":[],"color":"#2563EB"},{"t":"【术语·偏置 b】不乘任何输入的固定底价，像出租车起步价：每个样本都要加上它。","c":[],"color":"#2563EB"},{"t":"【术语·参数量】网络里所有需要学的数字个数，本项目三层加起来 107,538 个。","c":[],"color":"#2563EB"}],"color":"#2563EB"},{"t":"矩阵乘","c":[{"t":"【详解】[B,144] × [144,256] → [B,256]：中间那个 144 必须对上，对不上直接报错。B 是 batch 维，永远在最前面。","c":[],"color":"#2563EB"},{"t":"【术语·Linear 层】一层「乘权重再求和」的换算，本质是一次矩阵乘法，再加一个偏置。","c":[],"color":"#2563EB"},{"t":"【术语·batch】一次拿多少条样本一起算，本项目 256 条；算完一批才更新一次参数。","c":[],"color":"#2563EB"}],"color":"#2563EB"},{"t":"ReLU","c":[{"t":"【详解】负值清零、正值原样通过：带来稀疏激活、梯度不饱和，比 Sigmoid 不容易梯度消失。代价是可能出现永远不激活的「死亡神经元」。","c":[],"color":"#2563EB"},{"t":"【术语·ReLU】小于 0 的信号直接关掉变 0，大于 0 的原样通过——便宜，而且不容易梯度消失。","c":[],"color":"#2563EB"}],"color":"#2563EB"},{"t":"白话说","c":[{"t":"【详解】一层漏斗把 144 个原始信号压成 256 个探测器，每个探测器只对某些色块组合敏感——组合学多了，就接近人看魔方的直觉。","c":[],"color":"#2563EB"},{"t":"【术语·Linear 层】一层「乘权重再求和」的换算，本质是一次矩阵乘法，再加一个偏置。","c":[],"color":"#2563EB"}],"color":"#2563EB"},{"t":"把 batch 写死的坑","c":[{"t":"【详解】Linear 的第一个参数是输入特征数；写反、把 batch 写死、或者忘了把 One-Hot 拍平，都是维度不匹配的直接死法。","c":[],"color":"#2563EB"},{"t":"【术语·Linear 层】一层「乘权重再求和」的换算，本质是一次矩阵乘法，再加一个偏置。","c":[],"color":"#2563EB"}],"color":"#2563EB"}],"color":"#2563EB","tech":1},{"t":"A.4 第二层 + 输出头","c":[{"t":"Linear(256, 256) + b2","c":[{"t":"【详解】同构的一层，把 256 个特征再重组一遍，参数 256×256+256 = 65,792，是全网络最大的一块（61.2%）。","c":[],"color":"#1D4ED8"},{"t":"【术语·Linear 层】一层「乘权重再求和」的换算，本质是一次矩阵乘法，再加一个偏置。","c":[],"color":"#1D4ED8"},{"t":"【术语·参数量】网络里所有需要学的数字个数，本项目三层加起来 107,538 个。","c":[],"color":"#1D4ED8"}],"color":"#1D4ED8"},{"t":"输出头 Linear(256, 18)","c":[{"t":"【详解】最后一层只干一件事：给 18 个动作各打一个分。参数 256×18+18 = 4,626，纯线性、绝不套激活。","c":[],"color":"#1D4ED8"},{"t":"【术语·Linear 层】一层「乘权重再求和」的换算，本质是一次矩阵乘法，再加一个偏置。","c":[],"color":"#1D4ED8"},{"t":"【术语·logits】最后一步没经过任何压缩的原始打分，可正可负、可大可小，softmax 之前的状态。","c":[],"color":"#1D4ED8"}],"color":"#1D4ED8"},{"t":"107,538 怎么来的","c":[{"t":"【详解】37,120 + 65,792 + 4,626 = 107,538。答辩时这个数要能脱口而出，它证明你算过账、不是照抄结构。","c":[],"color":"#1D4ED8"},{"t":"【术语·参数量】网络里所有需要学的数字个数，本项目三层加起来 107,538 个。","c":[],"color":"#1D4ED8"}],"color":"#1D4ED8"},{"t":"输出层不能加激活","c":[{"t":"【详解】Q 值可正可负：ReLU 把负分全截成 0，Sigmoid 把分数压进 0~1，都会让 18 个动作的排序失真——这是最隐蔽的死法。","c":[],"color":"#1D4ED8"},{"t":"【术语·Q 值】在某个局面下做某个动作，未来能拿到的总回报的预估值。","c":[],"color":"#1D4ED8"},{"t":"【术语·logits】最后一步没经过任何压缩的原始打分，可正可负、可大可小，softmax 之前的状态。","c":[],"color":"#1D4ED8"},{"t":"【术语·ReLU】小于 0 的信号直接关掉变 0，大于 0 的原样通过——便宜，而且不容易梯度消失。","c":[],"color":"#1D4ED8"}],"color":"#1D4ED8"},{"t":"两层分工","c":[{"t":"【详解】前两层负责「看懂局面」，输出头负责「报价」。网络容量主要来自中间层的反复重组，不是靠堆到几百层。","c":[],"color":"#1D4ED8"},{"t":"【术语·Linear 层】一层「乘权重再求和」的换算，本质是一次矩阵乘法，再加一个偏置。","c":[],"color":"#1D4ED8"}],"color":"#1D4ED8"}],"color":"#1D4ED8","tech":1},{"t":"A.5 决策 · 选动作","c":[{"t":"argmax 贪心","c":[{"t":"【详解】评估和部署时直接取 18 个 Q 值里最大的那个动作。贪心的前提是 Q 值本身靠谱，所以先把网络训稳，再谈贪心。","c":[],"color":"#7C3AED"},{"t":"【术语·argmax】在 18 个打分里直接挑最大的那个动作。","c":[],"color":"#7C3AED"},{"t":"【术语·Q 值】在某个局面下做某个动作，未来能拿到的总回报的预估值。","c":[],"color":"#7C3AED"}],"color":"#7C3AED"},{"t":"ε-greedy","c":[{"t":"【详解】训练时以 ε 概率随机试新动作、其余走当前最优。ε 从 0.3 线性衰减到 0.01；下限压到 0 就完全不再探索。","c":[],"color":"#7C3AED"},{"t":"【术语·ε-greedy】以 ε 的概率乱试新动作、其余时候走当前最稳的一步——一个控制探索与利用的开关。","c":[],"color":"#7C3AED"}],"color":"#7C3AED"},{"t":"gather(1, actions)","c":[{"t":"【详解】训练时不需要 argmax，而是把「实际走过的那个动作」的 Q 按索引取出来，得到 [B,1]。取错索引 = 拿别的动作的 Q 去算误差。","c":[],"color":"#7C3AED"},{"t":"【术语·gather】按索引把指定位置的数取出来；训练时用它把「实际走过的动作」的 Q 单独拎出来。","c":[],"color":"#7C3AED"},{"t":"【术语·Q 值】在某个局面下做某个动作，未来能拿到的总回报的预估值。","c":[],"color":"#7C3AED"}],"color":"#7C3AED"},{"t":"索引对齐的坑","c":[{"t":"【详解】动作编号、One-Hot 顺序、专家动作表三处的编号必须完全一致。不一致时 Loss 会乱跳但不报错，排查成本极高。","c":[],"color":"#7C3AED"},{"t":"【术语·gather】按索引把指定位置的数取出来；训练时用它把「实际走过的动作」的 Q 单独拎出来。","c":[],"color":"#7C3AED"},{"t":"【术语·专家动作】IL 阶段从 648 条公式里学到的标准答案动作。","c":[],"color":"#7C3AED"}],"color":"#7C3AED"},{"t":"Double DQN / Dueling 延伸","c":[{"t":"【详解】Double DQN 用主网络选动作、Target 网络估价值，专门压 max 的高估；Dueling 把 Q 拆成 V(s)+A(s,a)。本项目都没用，但必被问。","c":[],"color":"#7C3AED"},{"t":"【术语·Double DQN】一个网络负责选动作、另一个网络负责给估值，专门压 max 造成的高估。","c":[],"color":"#7C3AED"},{"t":"【术语·Dueling】把 Q 拆成「这个局面本身值多少」+「这个动作额外值多少」两条支路。","c":[],"color":"#7C3AED"},{"t":"【术语·高估】max 算子永远挑最大的那个数，而最大那个往往只是噪声，导致 Q 值系统性偏大。","c":[],"color":"#7C3AED"}],"color":"#7C3AED"}],"color":"#7C3AED","tech":1},{"t":"A.6 目标 · TD Target","c":[{"t":"TD 公式","c":[{"t":"【详解】y = r + γ·(1-done)·max Q_target(s',a')：这一小步的奖励，加上打折后的下一局面最优估值。","c":[],"color":"#6D28D9"},{"t":"【术语·TD Target】这一小步的奖励，加上打折后的下一局面估值——训练时逼 Q 去追它。","c":[],"color":"#6D28D9"},{"t":"【术语·折扣因子 γ】未来的奖励要打折，越远越不值钱——避免模型为了遥远的幻想放弃眼前的一步。","c":[],"color":"#6D28D9"},{"t":"【术语·done 掩码】这一局已经结束，就不能再算未来的分，把未来价值乘 0。","c":[],"color":"#6D28D9"}],"color":"#6D28D9"},{"t":"Target Network","c":[{"t":"【详解】每 1000 步把主网络整份复制过去当标准答案，打断「自己教自己」的高估正反馈，是 DQN 稳定的第一根支柱。","c":[],"color":"#6D28D9"},{"t":"【术语·Target Network】抄作业用的标准答案本：每 1000 步才同步一次，防止「自己教自己」越估越偏。","c":[],"color":"#6D28D9"},{"t":"【术语·硬同步】每隔固定步数，把主网络权重整份复制给 Target 网络——简单直接，但同步瞬间有跳变。","c":[],"color":"#6D28D9"},{"t":"【术语·自举】用自己估出来的未来价值，去算今天的目标——估歪了就一路越估越歪。","c":[],"color":"#6D28D9"}],"color":"#6D28D9"},{"t":"Polyak 软更新","c":[{"t":"【详解】不整份复制，而是每次只挪 τ 比例：θ⁻ ← τθ + (1-τ)θ⁻。τ 常取 0.99~0.999，更平滑但收敛更慢。","c":[],"color":"#6D28D9"},{"t":"【术语·Polyak 软更新】每次只把 Target 往主网络挪 τ 比例（常取 0.99~0.999），更平滑，但收敛更慢。","c":[],"color":"#6D28D9"},{"t":"【术语·Target Network】抄作业用的标准答案本：每 1000 步才同步一次，防止「自己教自己」越估越偏。","c":[],"color":"#6D28D9"}],"color":"#6D28D9"},{"t":"done 掩码","c":[{"t":"【详解】终止步必须把未来价值乘 0，否则目标值会把「下一局根本不存在」的幻想算进去，网络学出假高分。","c":[],"color":"#6D28D9"},{"t":"【术语·done 掩码】这一局已经结束，就不能再算未来的分，把未来价值乘 0。","c":[],"color":"#6D28D9"}],"color":"#6D28D9"},{"t":"同步频率的坑","c":[{"t":"【详解】同步太频等于没有 Target，高估马上回来；太慢目标过时、学得慢。1000 步是本项目实测的折中值。","c":[],"color":"#6D28D9"},{"t":"【术语·Target Network】抄作业用的标准答案本：每 1000 步才同步一次，防止「自己教自己」越估越偏。","c":[],"color":"#6D28D9"},{"t":"【术语·硬同步】每隔固定步数，把主网络权重整份复制给 Target 网络——简单直接，但同步瞬间有跳变。","c":[],"color":"#6D28D9"}],"color":"#6D28D9"}],"color":"#6D28D9","tech":1},{"t":"A.7 罚单 A · TD Loss","c":[{"t":"MSE","c":[{"t":"【详解】L_TD = mean[(Q.gather - y)²]：差价平方再平均，错得越离谱罚得越狠，是回归任务的标准罚单。","c":[],"color":"#B45309"},{"t":"【术语·MSE】把差价平方再平均：错得越离谱罚得越狠，是回归任务的标准罚单。","c":[],"color":"#B45309"},{"t":"【术语·TD Error】目标值和当前预估之间的差价，训练就是追着这个差价跑。","c":[],"color":"#B45309"}],"color":"#B45309"},{"t":"量级问题","c":[{"t":"【详解】TD 误差可能到几十上百，直接反传容易梯度爆炸。所以要配奖励缩放从源头压量级、再配梯度裁剪兜底。","c":[],"color":"#B45309"},{"t":"【术语·Reward Scaling】把环境奖励整体缩一档，让 TD 罚单和 CE 罚单落回同一个量级。","c":[],"color":"#B45309"},{"t":"【术语·梯度裁剪】给梯度总量设一个上限，防止偶发的大误差把参数打成 NaN。","c":[],"color":"#B45309"},{"t":"【术语·NaN】数值溢出成「不是一个数」，一旦出现整个模型就废了。","c":[],"color":"#B45309"}],"color":"#B45309"},{"t":"Huber 变体","c":[{"t":"【详解】SmoothL1 在误差大时退化成线性增长，更抗离群点。本项目用 MSE，但要知道这个备选方案。","c":[],"color":"#B45309"},{"t":"【术语·MSE】把差价平方再平均：错得越离谱罚得越狠，是回归任务的标准罚单。","c":[],"color":"#B45309"}],"color":"#B45309"},{"t":"Target 没 detach 的坑","c":[{"t":"【详解】算 y 时没有 detach，目标会带着梯度一起被反传，等于边追目标边挪目标，训练直接发散。","c":[],"color":"#B45309"},{"t":"【术语·TD Target】这一小步的奖励，加上打折后的下一局面估值——训练时逼 Q 去追它。","c":[],"color":"#B45309"},{"t":"【术语·梯度】损失对这个参数的敏感度：往哪边调、调多少，全看它。","c":[],"color":"#B45309"}],"color":"#B45309"},{"t":"拿 CE 算差价的错位","c":[{"t":"【详解】Q 是连续回报的回归量，不是类别概率。用交叉熵算价值差价是概念错位，会得到没有意义的梯度。","c":[],"color":"#B45309"},{"t":"【术语·CE 交叉熵】衡量「押错得有多离谱」的罚单：用专家动作当标准答案时，押错越狠罚得越重。","c":[],"color":"#B45309"},{"t":"【术语·Q 值】在某个局面下做某个动作，未来能拿到的总回报的预估值。","c":[],"color":"#B45309"}],"color":"#B45309"}],"color":"#B45309","tech":1},{"t":"A.8 罚单 B · Anchor Loss","c":[{"t":"CE 交叉熵","c":[{"t":"【详解】把 18 个打分当 logits、用专家动作当标准答案：押对罚得小、押错罚得狠。输入 [B,18]，目标是 [B] 的整数索引。","c":[],"color":"#D97706"},{"t":"【术语·CE 交叉熵】衡量「押错得有多离谱」的罚单：用专家动作当标准答案时，押错越狠罚得越重。","c":[],"color":"#D97706"},{"t":"【术语·logits】最后一步没经过任何压缩的原始打分，可正可负、可大可小，softmax 之前的状态。","c":[],"color":"#D97706"},{"t":"【术语·专家动作】IL 阶段从 648 条公式里学到的标准答案动作。","c":[],"color":"#D97706"}],"color":"#D97706"},{"t":"648 条专家公式","c":[{"t":"【详解】IL 阶段从 CLL / Y-perm 等公式生成的 648 条标准答案，是 Anchor 要按住的东西，也是 IL 热启动能到 78.7% 的底气。","c":[],"color":"#D97706"},{"t":"【术语·专家动作】IL 阶段从 648 条公式里学到的标准答案动作。","c":[],"color":"#D97706"},{"t":"【术语·知识蒸馏】让大算力（BFS）算出来的标准答案去教小网络，把搜索的力气内化成直觉。","c":[],"color":"#D97706"},{"t":"【术语·灾难性遗忘】学新东西的时候把旧技能覆盖掉了——本项目 IL 接纯 TD 时从 78.7% 掉到 14%。","c":[],"color":"#D97706"}],"color":"#D97706"},{"t":"λ = 100 / 1000","c":[{"t":"【详解】两笔罚单的兑换比例：单模型微调取 100，A/B 联合训练取 1000。λ 太大不敢探索，太小把专家忘光。","c":[],"color":"#D97706"},{"t":"【术语·权重 λ】两笔罚单的兑换比例，本项目取 1000——它决定 TD 和 Anchor 谁说话更大声。","c":[],"color":"#D97706"}],"color":"#D97706"},{"t":"多解冲突","c":[{"t":"【详解】残局平均有 4.5 条等价最优动作，硬塞单一 CE 目标会让 Q 值排序左右互搏——这正是第七章四连败的根因。","c":[],"color":"#D97706"},{"t":"【术语·多解爆炸】同一个残局有好几条同样好的走法，硬塞唯一答案会把 Q 值排序搅乱。","c":[],"color":"#D97706"},{"t":"【术语·Q 值】在某个局面下做某个动作，未来能拿到的总回报的预估值。","c":[],"color":"#D97706"}],"color":"#D97706"},{"t":"双重 softmax 的坑","c":[{"t":"【详解】CE 要的是未 softmax 的 logits。先 softmax 再喂 CE 等于做了两次压缩，梯度被压扁、几乎不更新。","c":[],"color":"#D97706"},{"t":"【术语·softmax】把一排可正可负的原始打分，变成加起来等于 1 的概率分布。","c":[],"color":"#D97706"},{"t":"【术语·CE 交叉熵】衡量「押错得有多离谱」的罚单：用专家动作当标准答案时，押错越狠罚得越重。","c":[],"color":"#D97706"},{"t":"【术语·logits】最后一步没经过任何压缩的原始打分，可正可负、可大可小，softmax 之前的状态。","c":[],"color":"#D97706"}],"color":"#D97706"}],"color":"#D97706","tech":1},{"t":"A.9 合成 · 双 Loss","c":[{"t":"Total = TD + λ·Anchor","c":[{"t":"【详解】两笔罚单相加：L = L_TD + 1000·L_Anchor。TD 管探索、Anchor 管不忘，比例决定它俩谁说话更大声。","c":[],"color":"#059669"},{"t":"【术语·权重 λ】两笔罚单的兑换比例，本项目取 1000——它决定 TD 和 Anchor 谁说话更大声。","c":[],"color":"#059669"},{"t":"【术语·Anchor Loss】把专家动作当锚的交叉熵罚单：偏离专家路线就重罚，防止微调时忘光。","c":[],"color":"#059669"},{"t":"【术语·MSE】把差价平方再平均：错得越离谱罚得越狠，是回归任务的标准罚单。","c":[],"color":"#059669"}],"color":"#059669"},{"t":"Reward Scaling","c":[{"t":"【详解】把环境奖励从 +100 压到 +10，让 TD 误差落到和 CE 同一量级。不缩放时 TD 会单方面统治梯度。","c":[],"color":"#059669"},{"t":"【术语·Reward Scaling】把环境奖励整体缩一档，让 TD 罚单和 CE 罚单落回同一个量级。","c":[],"color":"#059669"},{"t":"【术语·量级对齐】两个 Loss 相加之前，必须先调到差不多大，否则等于只优化了大的那一个。","c":[],"color":"#059669"}],"color":"#059669"},{"t":"先量级、后权重","c":[{"t":"【详解】多目标 Loss 的调参顺序：先把两路调到一个量级，再定 λ。否则等于只优化了量级大的那一项。","c":[],"color":"#059669"},{"t":"【术语·量级对齐】两个 Loss 相加之前，必须先调到差不多大，否则等于只优化了大的那一个。","c":[],"color":"#059669"},{"t":"【术语·权重 λ】两笔罚单的兑换比例，本项目取 1000——它决定 TD 和 Anchor 谁说话更大声。","c":[],"color":"#059669"}],"color":"#059669"},{"t":"λ 要重标定","c":[{"t":"【详解】换任务、换奖励尺度、换课程之后，λ 必须重新标定：高了忘专家，低了不敢探索。","c":[],"color":"#059669"},{"t":"【术语·权重 λ】两笔罚单的兑换比例，本项目取 1000——它决定 TD 和 Anchor 谁说话更大声。","c":[],"color":"#059669"}],"color":"#059669"},{"t":"两路分量监控","c":[{"t":"【详解】TD 与 Anchor 必须分开记录。只看总 Loss 会被掩盖——TD 在降、Anchor 在炸，总和也可能在降。","c":[],"color":"#059669"},{"t":"【术语·TD Error】目标值和当前预估之间的差价，训练就是追着这个差价跑。","c":[],"color":"#059669"},{"t":"【术语·Anchor Loss】把专家动作当锚的交叉熵罚单：偏离专家路线就重罚，防止微调时忘光。","c":[],"color":"#059669"}],"color":"#059669"}],"color":"#059669","tech":1},{"t":"A.10 追责 · backward","c":[{"t":"自动微分","c":[{"t":"【详解】total_loss.backward() 沿前向记下的计算图反向链式求导，autograd 全自动，不用手推公式。","c":[],"color":"#DC2626"},{"t":"【术语·autograd】框架自动帮你做反向求导，不用手推公式。","c":[],"color":"#DC2626"},{"t":"【术语·计算图】前向时把每一步运算记成一张图，反向时顺着图倒着找责任人。","c":[],"color":"#DC2626"},{"t":"【术语·链式法则】复合函数求导要一层层乘回去，这是反向传播的数学地基。","c":[],"color":"#DC2626"}],"color":"#DC2626"},{"t":"梯度覆盖全参数","c":[{"t":"【详解】dL/dW1、dL/db1 …… 全部 107,538 个参数各得一个梯度，一次 step 更新的是整个网络。","c":[],"color":"#DC2626"},{"t":"【术语·梯度】损失对这个参数的敏感度：往哪边调、调多少，全看它。","c":[],"color":"#DC2626"},{"t":"【术语·参数量】网络里所有需要学的数字个数，本项目三层加起来 107,538 个。","c":[],"color":"#DC2626"},{"t":"【术语·Adam】给每个参数单独配步长、还带惯性，是工业界的默认优化器。","c":[],"color":"#DC2626"}],"color":"#DC2626"},{"t":"稀疏输入逃罚","c":[{"t":"【详解】One-Hot 让没被激活的权重这一轮梯度为 0，等于这次没被追责；被激活的那几行才真正更新。","c":[],"color":"#DC2626"},{"t":"【术语·稀疏梯度】One-Hot 输入下，没被激活的权重这一轮梯度是 0，等于这次没被追责。","c":[],"color":"#DC2626"},{"t":"【术语·One-Hot】把一个值变成一排开关，只有对应那个开关是 1、其余全 0；颜色没有大小之分，只能这么表示。","c":[],"color":"#DC2626"}],"color":"#DC2626"},{"t":"偏置必挨罚","c":[{"t":"【详解】b 加在总和上，每个样本都参与，所以梯度必不为 0——通常偏置比权重动得更早、更猛。","c":[],"color":"#DC2626"},{"t":"【术语·偏置 b】不乘任何输入的固定底价，像出租车起步价：每个样本都要加上它。","c":[],"color":"#DC2626"},{"t":"【术语·梯度】损失对这个参数的敏感度：往哪边调、调多少，全看它。","c":[],"color":"#DC2626"}],"color":"#DC2626"},{"t":"梯度累加","c":[{"t":"【详解】同一次 step 前多次 backward 的梯度会累加，所以每轮必须 zero_grad 清旧账，否则账越滚越大直接爆。","c":[],"color":"#DC2626"},{"t":"【术语·梯度累加】多次 backward 的梯度会加在一起，所以每一轮必须清零，否则越滚越大。","c":[],"color":"#DC2626"},{"t":"【术语·zero_grad】每轮开始前把旧梯度清零——不清账，梯度会滚雪球直到爆炸。","c":[],"color":"#DC2626"},{"t":"【术语·NaN】数值溢出成「不是一个数」，一旦出现整个模型就废了。","c":[],"color":"#DC2626"}],"color":"#DC2626"}],"color":"#DC2626","tech":1},{"t":"A.11 治理 · 裁剪 + Adam","c":[{"t":"clip_grad_norm_","c":[{"t":"【详解】在 backward 之后、step 之前给梯度总量设上限。顺序错了就白做：放 step 后无效，放 backward 前没东西可裁。","c":[],"color":"#B91C1C"},{"t":"【术语·梯度裁剪】给梯度总量设一个上限，防止偶发的大误差把参数打成 NaN。","c":[],"color":"#B91C1C"},{"t":"【术语·NaN】数值溢出成「不是一个数」，一旦出现整个模型就废了。","c":[],"color":"#B91C1C"}],"color":"#B91C1C"},{"t":"学习率 1e-4","c":[{"t":"【详解】每一步沿梯度走多远：太小学不动，太大一步跨过谷底。本项目 lr=1e-4，是与 Adam 搭配的工业默认值。","c":[],"color":"#B91C1C"},{"t":"【术语·学习率】每一步沿梯度走多远：太小学不动，太大一步跨过谷底直接发散。","c":[],"color":"#B91C1C"},{"t":"【术语·Adam】给每个参数单独配步长、还带惯性，是工业界的默认优化器。","c":[],"color":"#B91C1C"}],"color":"#B91C1C"},{"t":"Adam","c":[{"t":"【详解】一阶动量给惯性、二阶矩按梯度平方自适应缩放，每个参数单独定步长，收敛稳定，是默认选择。","c":[],"color":"#B91C1C"},{"t":"【术语·Adam】给每个参数单独配步长、还带惯性，是工业界的默认优化器。","c":[],"color":"#B91C1C"},{"t":"【术语·学习率】每一步沿梯度走多远：太小学不动，太大一步跨过谷底直接发散。","c":[],"color":"#B91C1C"},{"t":"【术语·梯度】损失对这个参数的敏感度：往哪边调、调多少，全看它。","c":[],"color":"#B91C1C"}],"color":"#B91C1C"},{"t":"更新公式","c":[{"t":"【详解】θ ← θ - lr·m̂/(√v̂+ε)：一次 step 就是一次全网络参数进化，方向和步长都由优化器算好。","c":[],"color":"#B91C1C"},{"t":"【术语·Adam】给每个参数单独配步长、还带惯性，是工业界的默认优化器。","c":[],"color":"#B91C1C"}],"color":"#B91C1C"},{"t":"裁剪位置踩错","c":[{"t":"【详解】clip 放在 step 之后等于没裁，放在 backward 之前无梯度可裁。顺序链必须是 zero_grad → backward → clip → step。","c":[],"color":"#B91C1C"},{"t":"【术语·梯度裁剪】给梯度总量设一个上限，防止偶发的大误差把参数打成 NaN。","c":[],"color":"#B91C1C"},{"t":"【术语·zero_grad】每轮开始前把旧梯度清零——不清账，梯度会滚雪球直到爆炸。","c":[],"color":"#B91C1C"}],"color":"#B91C1C"}],"color":"#B91C1C","tech":1},{"t":"A.12 循环 · 一次迭代","c":[{"t":"顺序清单","c":[{"t":"【详解】采样 → 前向 → gather → 算 Target → 双 Loss → 混合 → zero_grad → backward → clip → step。这条链必须能背，答辩反复问。","c":[],"color":"#111827"},{"t":"【术语·zero_grad】每轮开始前把旧梯度清零——不清账，梯度会滚雪球直到爆炸。","c":[],"color":"#111827"},{"t":"【术语·gather】按索引把指定位置的数取出来；训练时用它把「实际走过的动作」的 Q 单独拎出来。","c":[],"color":"#111827"},{"t":"【术语·Adam】给每个参数单独配步长、还带惯性，是工业界的默认优化器。","c":[],"color":"#111827"}],"color":"#111827"},{"t":"外循环","c":[{"t":"【详解】每步把经验存进回放池，每 1000 步同步 Target，每 N 步评估一次贪心成功率——三个周期别搞混。","c":[],"color":"#111827"},{"t":"【术语·Target Network】抄作业用的标准答案本：每 1000 步才同步一次，防止「自己教自己」越估越偏。","c":[],"color":"#111827"},{"t":"【术语·Replay Buffer】错题本：把走过的每一步都存起来，训练时随机抽样本出来复习。","c":[],"color":"#111827"},{"t":"【术语·ε-greedy】以 ε 的概率乱试新动作、其余时候走当前最稳的一步——一个控制探索与利用的开关。","c":[],"color":"#111827"}],"color":"#111827"},{"t":"三种状态","c":[{"t":"【详解】训练态（探索 + 学梯度）、评估态（贪心 + 无梯度）、部署态（纯推理 + 无回放池），切换靠 eval / no_grad。","c":[],"color":"#111827"},{"t":"【术语·推理/部署】训练完只做前向、不再更新参数的使用状态。","c":[],"color":"#111827"},{"t":"【术语·batch】一次拿多少条样本一起算，本项目 256 条；算完一批才更新一次参数。","c":[],"color":"#111827"}],"color":"#111827"},{"t":"忘 no_grad 的坑","c":[{"t":"【详解】评估时忘了 no_grad 会白建计算图，显存一路飙升，跑久了直接 OOM——典型的不报错但很贵的浪费。","c":[],"color":"#111827"},{"t":"【术语·推理/部署】训练完只做前向、不再更新参数的使用状态。","c":[],"color":"#111827"}],"color":"#111827"},{"t":"忘 step 的坑","c":[{"t":"【详解】只 backward 不 step：Loss 在降、参数不动，成功率像死狗。这是最不报错的死法，必须靠 stats 监控识别。","c":[],"color":"#111827"},{"t":"【术语·梯度】损失对这个参数的敏感度：往哪边调、调多少，全看它。","c":[],"color":"#111827"},{"t":"【术语·Adam】给每个参数单独配步长、还带惯性，是工业界的默认优化器。","c":[],"color":"#111827"}],"color":"#111827"}],"color":"#111827","tech":1}],"color":"#0F172A"};/* 作者内置标记：首次访问时作为初始状态，清空后不再自动恢复 */
const MARK_DEFAULTS = {};

let marks = {};
try { marks = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; }
catch (e) { marks = {}; }
function saveMarks(){ try { localStorage.setItem(LS_KEY, JSON.stringify(marks)); } catch(e){} }
function markGet(p){ return marks[p] || 0; }
function markCyclePath(p){
  const next = (markGet(p) + 1) % 4;
  if (next === 0) delete marks[p]; else marks[p] = next;
  saveMarks(); redraw(true); updateStats();
}
function seedAuthorMarks(){
  try{
    if (localStorage.getItem(LS_SEEDED)) return 0;
    if (Object.keys(marks).length){ localStorage.setItem(LS_SEEDED, "1"); return 0; }
    const keys = Object.keys(MARK_DEFAULTS || {});
    if (!keys.length){ localStorage.setItem(LS_SEEDED, "1"); return 0; }
    marks = JSON.parse(JSON.stringify(MARK_DEFAULTS));
    saveMarks();
    localStorage.setItem(LS_SEEDED, "1");
    return keys.length;
  }catch(e){ return 0; }
}
function loadAuthorMarks(){
  const keys = Object.keys(MARK_DEFAULTS || {});
  if (!keys.length){ alert("这个页面没有内置标记数据。"); return; }
  if (Object.keys(marks).length &&
      !confirm("会用作者内置的 " + keys.length + " 条标记覆盖你当前的标记，继续？")) return;
  marks = JSON.parse(JSON.stringify(MARK_DEFAULTS));
  saveMarks();
  localStorage.setItem(LS_SEEDED, "1");
  redraw(true); updateStats();
}
function updateStats(){
  const c = [0,0,0,0];
  if (MODE === "mind"){
    (function walk(n){ if (!(n.c && n.c.length)) c[markGet(n._path)]++; (n.c||[]).forEach(walk); })(DATA);
  } else {
    CHAIN.forEach(st => st.items.forEach(it => {
      if (it.details.length) it.details.forEach(d => c[markGet(d.p)]++);
      else c[markGet(it.p)]++;
    }));
  }
  const box = $("stats");
  if (!box) return;
  box.innerHTML =
      `<span><i class="dot" style="background:${MARK_COLORS[1]}"></i>不会 <b>${c[1]}</b></span>`
    + `<span><i class="dot" style="background:${MARK_COLORS[2]}"></i>仅了解 <b>${c[2]}</b></span>`
    + `<span><i class="dot" style="background:${MARK_COLORS[3]}"></i>理解 <b>${c[3]}</b></span>`
    + `<span style="opacity:.65">未标记 <b>${c[0]}</b></span>`;
}

/* ---------- 缩放 / 平移：两套状态各自保留 ---------- */
const mindState = { collapsed:new Set(), scale:1, tx:0, ty:0 };
let MODE = "mind";
const seen = { mind:false, chain:false };
function curState(){ return MODE === "mind" ? mindState : ChainView.state; }
function applyZoom(){
  const st = curState();
  scene.setAttribute("transform", `translate(${st.tx},${st.ty}) scale(${st.scale})`);
  $("zoomval").textContent = Math.round(st.scale*100) + "%";
}
function redraw(keep){
  if (MODE === "mind") renderMind(!!keep); else ChainView.render(!!keep);
}

/* ================= 思维导图引擎 ================= */
const FS   = {0:17, 1:13.5, 2:12, 3:11};
const PADX = {0:22, 1:15, 2:12, 3:10};
const PADY = {0:15, 1:10, 2:7.5, 3:6.5};
const GAPY = {0:22, 1:9, 2:5, 3:4};
const GAPX = {0:78, 1:52, 2:40, 3:34};
const MAXW = {0:360, 1:300, 2:300, 3:400};
const MAXL = {0:99, 1:99, 2:99, 3:99};   // 不再截断：文字按需换行，全部显示（原来是 1/2/2/3 行，超出加省略号）

function measure(node, level, path){
  node._level = level;
  node._path = path;
  node._lines = wrap(node.t, level);
  node._w = Math.max(0, ...node._lines.map(l => textW(l, FS[level], WEIGHT[level]))) + PADX[level]*2;
  node._h = node._lines.length * (FS[level]*1.4) + PADY[level]*2;
  node._open = !mindState.collapsed.has(node) && node.c && node.c.length > 0;
  if (node._open) node.c.forEach((ch,i) => measure(ch, level+1, path + "-" + i));
}

function layoutSide(nodes, dir, x0){
  let cursor = 0;
  function place(node, level, colX){
    // colX: 该节点列的「锚点」：右向为左边缘，左向为右边缘
    node._dir = dir;
    if (dir > 0){ node._x = colX; }
    else { node._x = colX - node._w; }
    if (!node._open || !node.c || !node.c.length){
      node._y = cursor;
      cursor += node._h + GAPY[Math.min(level,3)];
      return node._y + node._h/2;
    }
    const nextX = dir > 0
      ? colX + node._w + GAPX[Math.min(level,3)]
      : colX - node._w - GAPX[Math.min(level,3)];
    const centers = node.c.map(ch => place(ch, level+1, nextX));
    node._y = (Math.min(...centers) + Math.max(...centers))/2 - node._h/2;
    return node._y + node._h/2;
  }
  nodes.forEach(st => place(st, 1, x0));
  return { height: cursor };
}

function collect(node, out){
  out.push(node);
  if (node._open) node.c.forEach(ch => collect(ch, out));
  return out;
}

function assignPaths(node, path){
  node._path = path;
  (node.c||[]).forEach((ch,i) => assignPaths(ch, path + "-" + i));
}

function build(){
  // 0. 先给全部节点分配路径（折叠的也要有，否则标记会串号）
  assignPaths(DATA, "r");
  // 1. 测量
  measure(DATA, 0, "r");
  // 2. 分左右（交替）
  const rightStages = [], leftStages = [];
  DATA.c.forEach((st, i) => { (i % 2 === 0 ? rightStages : leftStages).push(st); });
  // 3. 两侧布局（先在各自局部坐标）
  const R = layoutSide(rightStages, +1, 0);
  const L = layoutSide(leftStages, -1, 0);

  // 左内侧的局部 x 范围：最右是 0，最左是负值
  let leftMinX = 0, rightMaxX = 0;
  const walkX = (n, pick) => { pick(n); if (n._open) n.c.forEach(ch => walkX(ch, pick)); };
  leftStages.forEach(st => walkX(st, n => { leftMinX = Math.min(leftMinX, n._x); }));
  rightStages.forEach(st => walkX(st, n => { rightMaxX = Math.max(rightMaxX, n._x + n._w); }));

  const leftW = -leftMinX;
  const gapR = GAPX[0], rootW = DATA._w;
  // 水平位移：左侧整体平移到 0 起，根紧随其后
  const shiftLeft = leftW;
  const rootX = leftW + gapR;
  const shiftRight = rootX + rootW + gapR;

  const shiftSide = (stages, dx, dy) => {
    stages.forEach(st => {
      const walk = n => { n._x += dx; n._y += dy; if (n._open) n.c.forEach(walk); };
      walk(st);
    });
  };

  const H = Math.max(R.height, L.height);
  // 垂直居中：两侧各自居中
  const dyR = (H - R.height) / 2;
  const dyL = (H - L.height) / 2;
  shiftSide(rightStages, shiftRight, dyR);
  shiftSide(leftStages, shiftLeft, dyL);

  DATA._x = rootX;
  DATA._y = H/2 - DATA._h/2;

  // 收集所有可见节点
  const nodes = [];
  collect(DATA, nodes);

  return { nodes, rootX, rootW, totalH: H };
}

function renderMind(keepView){
  const keep = keepView ? { s:mindState.scale, x:mindState.tx, y:mindState.ty } : null;
  const { nodes } = build();
  scene.innerHTML = "";

  const gE = el("g", {});
  const drawEdge = (p, c) => {
    const px = p._dir > 0 ? p._x + p._w : p._x;
    const py = p._y + p._h/2;
    const cx = c._dir > 0 ? c._x : c._x + c._w;
    const cy = c._y + c._h/2;
    const mx = (px + cx) / 2;
    gE.appendChild(el("path", {
      d:`M ${px} ${py} C ${mx} ${py}, ${mx} ${cy}, ${cx} ${cy}`,
      fill:"none", stroke:c.color || "#9ca3af",
      "stroke-width": c._level === 1 ? 2 : 1.2,
      "stroke-linecap":"round",
      opacity: c._level === 1 ? .9 : .5
    }));
  };
  nodes.forEach(n => { if (n._open && n.c) n.c.forEach(ch => drawEdge(n, ch)); });
  scene.appendChild(gE);

  const gN = el("g", {});
  nodes.forEach(n => {
    const lv = n._level;
    const g = el("g", { class:"node" });
    const isRoot = lv === 0;
    const isLeaf = !(n.c && n.c.length);
    const mk = (!isRoot && isLeaf) ? markGet(n._path) : 0;
    const fill0 = isRoot ? "#111827" : (lv === 1 ? (n.color || "#334155") : "#ffffff");
    const stroke0 = isRoot ? "#111827" : (lv === 1 ? (n.color || "#334155")
                   : (lv === 2 ? (n.color || "#d6d3ce") : (n.color || "#d6d3ce")));
    const rect = el("rect", {
      x:n._x, y:n._y, width:n._w, height:n._h,
      rx: isRoot ? 12 : 8,
      fill: mk ? MARK_TINTS[mk] : fill0,
      stroke: mk ? MARK_COLORS[mk] : stroke0,
      "stroke-width": mk ? 1.8 : (lv === 1 ? 0 : (lv === 2 ? 1.1 : 0.9)),
      "stroke-opacity": mk ? 1 : (lv >= 3 ? .35 : 1)
    });
    if (lv === 2 && !mk) rect.setAttribute("stroke-opacity", ".55");
    g.appendChild(rect);

    const fs = FS[lv], lh = fs*1.4;
    const totalH = n._lines.length * lh;
    const startY = n._y + (n._h - totalH)/2 + lh/2;
    n._lines.forEach((line, i) => {
      const t = el("text", {
        y: startY + i*lh,
        "font-size": fs,
        "font-weight": isRoot ? 800 : (lv === 1 ? 700 : (lv === 2 ? 600 : 400)),
        fill: isRoot ? "#ffffff" : (lv === 1 ? "#ffffff" : (lv === 2 ? "#1f2937" : "#4b5563"))
      });
      if (n._dir > 0 && !isRoot){
        t.setAttribute("x", n._x + PADX[lv]);
        t.setAttribute("text-anchor", "start");
      } else if (n._dir < 0 && !isRoot){
        t.setAttribute("x", n._x + n._w - PADX[lv]);
        t.setAttribute("text-anchor", "end");
      } else {
        t.setAttribute("x", n._x + PADX[lv]);
        t.setAttribute("text-anchor", "start");
      }
      t.textContent = line;
      g.appendChild(t);
    });

    if (n.c && n.c.length){
      const cx = n._dir > 0 || isRoot ? n._x + n._w + 12 : n._x - 12;
      const cy = n._y + n._h/2;
      g.appendChild(el("circle", { cx, cy, r:7.5, fill:"#fff",
        stroke:n.color || "#9ca3af", "stroke-width":1.2 }));
      const tt = el("text", { x:cx, y:cy+0.5, "text-anchor":"middle",
        "font-size":9.5, "font-weight":700, fill:n.color || "#9ca3af" });
      tt.textContent = n._open ? "−" : String(n.c.length);
      g.appendChild(tt);
    } else {
      /* ----- 叶子节点：学习状态小圆按钮 ----- */
      const cx = (n._dir > 0 || isRoot) ? n._x + n._w + 12 : n._x - 12;
      const cy = n._y + n._h/2;
      const gm = el("g", { class:"mark" });
      gm.appendChild(el("circle", {
        cx, cy, r:8,
        fill: mk ? MARK_COLORS[mk] : "#ffffff",
        stroke: mk ? MARK_COLORS[mk] : "#c3c9d2",
        "stroke-width": mk ? 1 : 1.3,
        "stroke-dasharray": mk ? "0" : "2.2 2.2"
      }));
      if (mk){
        const chk = el("text", {
          x:cx, y:cy+0.6, "text-anchor":"middle",
          "font-size":9, "font-weight":800, fill:"#ffffff"
        });
        chk.textContent = mk === 3 ? "✓" : (mk === 2 ? "~" : "✕");
        gm.appendChild(chk);
      }
      const ttl = el("title", {});
      ttl.textContent = `【${MARK_NAMES[mk]}】点击切换：不会 → 仅了解 → 理解 → 取消`;
      gm.appendChild(ttl);
      gm.addEventListener("click", ev => { ev.stopPropagation(); markCyclePath(n._path); });
      g.appendChild(gm);
    }

    const title = el("title", {}); title.textContent = n.t; g.appendChild(title);
    g.addEventListener("click", ev => {
      ev.stopPropagation();
      if (n.c && n.c.length){
        if (mindState.collapsed.has(n)) mindState.collapsed.delete(n); else mindState.collapsed.add(n);
        renderKeepNode(n);
      }
    });
    gN.appendChild(g);
  });
  scene.appendChild(gN);
  if (keep){ mindState.scale = keep.s; mindState.tx = keep.x; mindState.ty = keep.y; applyZoom(); }
  else fitMind();
  buildLegend();
  updateStats();
}

function renderKeepNode(n){
  if (!n || n._x == null || n._y == null){ renderMind(true); return; }
  const ax = mindState.tx + n._x * mindState.scale;     // 点击节点在屏幕上的位置（渲染前）
  const ay = mindState.ty + n._y * mindState.scale;
  renderMind(true);                                  // true = 沿用当前缩放/平移
  if (n._x == null || n._y == null) return;
  mindState.tx += ax - (mindState.tx + n._x * mindState.scale);   // 把同一个节点挪回原处
  mindState.ty += ay - (mindState.ty + n._y * mindState.scale);
  applyZoom();
}

function fitMind(){
  const bb = scene.getBBox();
  if (!bb.width) return;
  const W = svg.clientWidth, H = svg.clientHeight;
  const padX = 70, padTop = topPadPx(26), padBottom = 62;
  const s = Math.min((W - padX*2)/bb.width, (H - padTop - padBottom)/bb.height, 1.25);
  mindState.scale = Math.max(s, 0.1);
  mindState.tx = (W - bb.width*mindState.scale)/2 - bb.x*mindState.scale;
  mindState.ty = padTop + (H - padTop - padBottom - bb.height*mindState.scale)/2 - bb.y*mindState.scale;
  applyZoom();
}

function buildLegend(){
  const box = document.getElementById("legend"); box.innerHTML = "";
  DATA.c.forEach(st => {
    const s = document.createElement("span");
    s.innerHTML = `<i style="background:${st.color}"></i>${st.t.split("：")[0]}`;
    box.appendChild(s);
  });
}

function mindSetAll(fn){
  const walk = (n, d) => { if (fn(n, d)) mindState.collapsed.add(n); else mindState.collapsed.delete(n);
                           (n.c||[]).forEach(ch => walk(ch, d+1)); };
  walk(DATA, 0);
  mindState.collapsed.delete(DATA);
  renderMind();
}

const WEIGHT = {0:800, 1:700, 2:600, 3:400};   // 与 render 里的 font-weight 保持一致
function wrap(text, level){
  return wrap2(text, FS[level], MAXW[level], MAXL[level], WEIGHT[level]);
}

  items: (st.c || []).map(it => ({

/* ================= 长链图引擎（作用域隔离，避免与导图重名） ================= */
const ChainView = (function(){
const DATA = { main: CHAIN };

function markOf(p){ return markGet(p); }
function cycleMark(p){ markCyclePath(p); }

const FLOW = ["存 (s,a,r,s',done)", "[B, 144]", "[B, 256]", "[B, 18] logits", "动作 a", "y = r + γQ*", "L_TD", "L_Anchor", "L_total", "∂L/∂θ", "θ ← θ - lr·m̂/(√v̂+ε)"];
const FS_STAGE = 13.5, FS_ITEM = 12, FS_DETAIL = 10.5;
const CARD_W = 280, CARD_H = 88;
const COL_GAP = 98;
const ITEM_W = 252, ITEM_GAP = 7;
const DETAIL_W = 330, DETAIL_GAP = 5;
const HEAD_GAP = 26;

const CONTENT = { w:0, h:0, y0:0 };
const state = { scale:1, tx:0, ty:0, collapsedStage:new Set(), collapsedItem:new Set() };

function render(keepView){
  const keep = keepView ? { s:state.scale, x:state.tx, y:state.ty } : null;
  scene.innerHTML = "";
  const main = DATA.main;

  // ---------- 计算每列高度 ----------
  const cols = main.map((st, i) => {
    const stageCollapsed = state.collapsedStage.has(i);
    let y = CARD_H + HEAD_GAP;
    const items = [];
    if (!stageCollapsed){
      st.items.forEach((it, j) => {
        const key = i + "-" + j;
        const itemOpen = !state.collapsedItem.has(key) && it.details.length > 0;
        const itemLines = wrap2(it.t, FS_ITEM, ITEM_W - 36, 99, 600);   // 不再截断
        const itemH = itemLines.length * (FS_ITEM*1.32) + 13;
        const itemY = y;
        y += itemH + ITEM_GAP;
        const dets = [];
        if (itemOpen){
          it.details.forEach((d, k) => {
            const dl = wrap2(d.t, FS_DETAIL, DETAIL_W - 42, 99, 400);       // 不再截断
            const dh = dl.length * (FS_DETAIL*1.3) + 9;
            dets.push({ y, lines:dl, h:dh, p:d.p });
            y += dh + DETAIL_GAP;
          });
        }
        items.push({ it, j, key, y:itemY, h:itemH, lines:itemLines, open:itemOpen, dets });
      });
    }
    return { st, i, items, height: Math.max(y, CARD_H + HEAD_GAP) };
  });

  const maxH = Math.max(...cols.map(c => c.height));
  const topPad = 42;
  const chainY = topPad;
  const colX = (i) => i * (CARD_W + COL_GAP);

  // ---------- 阶段之间的箭头（先画，压在卡片下面）----------
  const gE = el("g", {});
  for (let i = 0; i < main.length - 1; i++){
    const x1 = colX(i) + CARD_W + 6;
    const x2 = colX(i+1) - 6;
    const y = chainY + CARD_H/2;
    gE.appendChild(el("line", {
      x1, y1:y, x2, y2:y, stroke:"#94a3b8", "stroke-width":1.8,
      "marker-end":"url(#arw)"
    }));
    gE.appendChild(txt((x1+x2)/2, topPad - 15, FLOW[i] || "", 10.5, "#7c8798", 700, "middle"));
  }
  // 回流箭头：阶段六 -> 前端（下方虚线）
  const retY = topPad + maxH + 34;
  const rx1 = colX(main.length-1) + CARD_W/2;
  const rx2 = colX(0) + CARD_W/2;
  gE.appendChild(el("path", {
    d:`M ${rx1} ${topPad+maxH+6} L ${rx1} ${retY} L ${rx2} ${retY} L ${rx2} ${topPad+maxH+18}`,
    fill:"none", stroke:"#cbb8a6", "stroke-width":1.6, "stroke-dasharray":"5 4",
    "marker-end":"url(#arwR)"
  }));
  gE.appendChild(txt((rx1+rx2)/2, retY - 10, "一次迭代完成 → 采下一个 batch，进入下一轮训练循环", 10.5, "#a08b76", 600, "middle"));
  scene.appendChild(gE);

  // ---------- 每列 ----------
  const gN = el("g", {});
  cols.forEach((col, i) => {
    const x = colX(i);
    const st = col.st;
    const stageCollapsed = state.collapsedStage.has(i);

    // 阶段卡
    const g = el("g", { });
    g.appendChild(el("rect", {
      x, y:chainY, width:CARD_W, height:CARD_H, rx:12,
      fill:CAPTION_BG(i, st.color), stroke:st.color, "stroke-width":0
    }));
    // 序号徽章
    g.appendChild(el("circle", { cx:x+22, cy:chainY+CARD_H/2, r:11, fill:"rgba(255,255,255,.22)" }));
    g.appendChild(txt(x+22, chainY+CARD_H/2+0.5, String(i+1), 11.5, "#fff", 800, "middle"));
    // 标题（最多 2 行）
    const lines = wrap2(st.title.replace(/^阶段[一二三四五六七八九十]+：/, ""), FS_STAGE, CARD_W-80, 3, 700);
    const lh = FS_STAGE*1.26;
    const sy = chainY + CARD_H/2 - (lines.length-1)*lh/2;
    lines.forEach((ln, k) => {
      g.appendChild(txt(x+42, sy + k*lh, ln, FS_STAGE, "#fff", 700));
    });
    // 折叠指示
    g.appendChild(el("circle", { cx:x+CARD_W-14, cy:chainY+14, r:7, fill:"rgba(255,255,255,.9)", stroke:"none" }));
    g.appendChild(txt(x+CARD_W-14, chainY+14.5, stageCollapsed ? String(st.items.length) : "−", 9, st.color, 800, "middle"));
    g.style.cursor = "pointer";
    g.addEventListener("click", ev => {
      ev.stopPropagation();

      const firstY = col.items[0].y;

      gI.appendChild(el("rect", {

      }));
      gI.appendChild(el("rect", { x:cx, y:row.y+5, width:3, height:row.h-10, rx:1.5, fill:st.color }));
      const ilh = FS_ITEM*1.32;

      row.lines.forEach((ln,k) => {

      if (row.it.details.length){

        gI.appendChild(txt(cx+ITEM_W-13, row.y+row.h/2+0.5, row.open ? "−" : String(row.it.details.length), 8, st.color, 700, "middle"));
      } else {

      }
      gI.style.cursor = "pointer";

        ev.stopPropagation();
        if (!row.it.details.length) return;

        else state.collapsedItem.add(row.key);
        render(true);   // 保持当前缩放/平移，不重置视图
      });
      gN.appendChild(gI);

      // 细节
      row.dets.forEach(dd => {
        const dmk = markOf(dd.p);
        gN.appendChild(el("rect", {
          x:cx+14, y:dd.y, width:DETAIL_W, height:dd.h, rx:5,
          fill: dmk ? MARK_TINTS[dmk] : "#f6f4ef",
          stroke: dmk ? MARK_COLORS[dmk] : st.color,
          "stroke-width": dmk ? 1.4 : .8,
          "stroke-opacity": dmk ? .9 : .28
        }));
        const dlh = FS_DETAIL*1.3;
        const dsy = dd.y + dd.h/2 - (dd.lines.length-1)*dlh/2;
        dd.lines.forEach((ln,kk) => {
          gN.appendChild(txt(cx+22, dsy + kk*dlh, ln, FS_DETAIL, dmk === 1 ? "#b91c1c" : "#5b6472", 400));
        });
        markBtn(gN, cx+14+DETAIL_W-13, dd.y+dd.h/2, dd.p, 6.5);
      });
    });
  });
  scene.appendChild(gN);

  if (keep){ state.scale = keep.s; state.tx = keep.x; state.ty = keep.y; apply(); }
  else { CONTENT.w = 0; }

  // 记录精确内容框，供 fit() 使用（getBBox 在这种大量分组下不准）
  CONTENT.w = (main.length-1)*(CARD_W+COL_GAP) + CARD_W;
  CONTENT.y0 = 0;
  CONTENT.h = topPad + maxH + 46;
  if (keep){ state.scale = keep.s; state.tx = keep.x; state.ty = keep.y; apply(); }
  else fit();
  updateStats();
}

function CAPTION_BG(i, c){

function apply(){
  scene.setAttribute("transform", `translate(${state.tx},${state.ty}) scale(${state.scale})`);
  document.getElementById("zoomval").textContent = Math.round(state.scale*100)+"%";
}

function fit(){
  const W = svg.clientWidth, H = svg.clientHeight;
  const clean = (new URLSearchParams(location.search)).get("clean") === "1";
  const padX = clean ? 40 : 54, padTop = clean ? 34 : topPadPx(20), padBottom = 46;
  if (!CONTENT.w) return;
  const s = Math.min((W-padX*2)/CONTENT.w, (H-padTop-padBottom)/CONTENT.h, 3);
  state.scale = Math.max(s, 0.12);
  const cw = CONTENT.w*state.scale, ch = CONTENT.h*state.scale;
  state.tx = Math.round((W - cw)/2);
  state.ty = Math.round(padTop + (H - padTop - padBottom - ch)/2 - CONTENT.y0*state.scale);
  apply();
  window.__MM_GEOM = {scale:state.scale,tx:state.tx,ty:state.ty,cw:CONTENT.w,ch:CONTENT.h,vw:svg.clientWidth,vh:svg.clientHeight};
}



return { render: render, fit: fit, apply: apply, state: state };
})();

/* ================= 导出 / 导入 ================= */
function exportMarks(){
  const keys = Object.keys(marks);
  const payload = {
    app: "前后端数据沟通全链路-学习标记",
    version: 1,
    exportedAt: new Date().toISOString(),
    total: keys.length,
    marks: marks
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const d = new Date();
  const ymd = d.getFullYear() + "-" +
              String(d.getMonth()+1).padStart(2,"0") + "-" +
              String(d.getDate()).padStart(2,"0");
  const a = document.createElement("a");
  a.href = url;
  a.download = "学习标记-" + ymd + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  alert("已导出 " + keys.length + " 条标记\n\n文件名：学习标记-" + ymd + ".json\n（在浏览器下载目录里）\n\n把它拷到 U 盘，换电脑时用「导入标记」恢复。");
}
function importMarks(file){
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const obj = JSON.parse(fr.result);
      const m = obj.marks || obj;
      if (typeof m !== "object" || m === null || Array.isArray(m)) throw new Error("不是有效的标记文件");
      const keys = Object.keys(m).filter(k => /^r(-\d+)+$/.test(k) && m[k] >= 1 && m[k] <= 3);
      if (!keys.length) throw new Error("文件里没有可用的标记");
      if (!confirm("将导入 " + keys.length + " 条标记。\n\n规则：同一知识点以导入文件为准，其余保留你当前的标记。\n\n继续？")) return;
      keys.forEach(k => { marks[k] = m[k]; });
      saveMarks(); redraw(true); updateStats();
      alert("导入完成。\n当前共 " + Object.keys(marks).length + " 条标记。");
    } catch (e) {
      alert("导入失败：" + e.message + "\n\n请确认选的是「导出标记」生成的 json 文件。");
    }
  };
  fr.readAsText(file, "utf-8");
}

/* ================= 缩放 / 平移交互（两种模式共用） ================= */
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = e.deltaY < 0 ? 1.12 : 1/1.12;
  const st = curState();
  const lo = MODE === "mind" ? 0.06 : 0.08;
  const ns = Math.min(Math.max(st.scale*k, lo), 3);
  const q = ns / st.scale;
  st.tx = mx - (mx - st.tx)*q;
  st.ty = my - (my - st.ty)*q;
  st.scale = ns;
  applyZoom();
}, { passive:false });

let drag = false, lx = 0, ly = 0;
svg.addEventListener("mousedown", e => { drag = true; lx = e.clientX; ly = e.clientY; svg.classList.add("dragging"); });
window.addEventListener("mousemove", e => {
  if (!drag) return;
  const st = curState();
  st.tx += e.clientX - lx; st.ty += e.clientY - ly;
  lx = e.clientX; ly = e.clientY;
  applyZoom();
});
window.addEventListener("mouseup", () => { drag = false; svg.classList.remove("dragging"); });
window.addEventListener("resize", () => { clearTimeout(window._t); window._t = setTimeout(applyZoom, 120); });

(function(){

  /* 导图：默认展开到环节 */
  mindState.collapsed.clear();
  const v = q.get("view") || "items";

    const walk = (n, d) => { if (d >= 2) mindState.collapsed.add(n); (n.c||[]).forEach(ch => walk(ch, d+1)); };
    DATA.c.forEach(st => walk(st, 1));
  } else if (v === "collapse"){
    DATA.c.forEach(st => mindState.collapsed.add(st));
  }

  /* 长链图：默认展开到环节（细节折叠） */
  ChainView.state.collapsedStage.clear();
  ChainView.state.collapsedItem.clear();
  if (q.get("detail") !== "1"){
    CHAIN.forEach((st, i) => st.items.forEach((it, j) => {
      if (it.details.length) ChainView.state.collapsedItem.add(i + "-" + j);
    }));
  }

  /* 净图模式：隐藏所有界面元素，便于截图 */
  if (q.get("clean") === "1"){
    CLEAN = true;
    document.querySelector(".topbar").style.display = "none";
    $("hint").style.display = "none";
    $("legend").style.display = "none";
    $("btn-mode").style.display = "none";
    document.body.style.backgroundImage = "none";
  }

  /* 首次访问：把作者标记作为初始状态 */
  const seeded = seedAuthorMarks();
  if (seeded) seedNote = ' · <b>已载入作者 ' + seeded + ' 条标记</b>';

  /* 初始模式：URL 优先，其次记住上次 */

  else m = "mind";             /* 技术蜈蚣默认脑图；?mode=chain 看横向主干 */
  setMode(m, true);
})();

<script>
/* 初始视图：脑图默认收起到「大类 / 12 站」，先看全局；点站再展开技术腿与术语毛。长链模式按可读比例显示。 */
(function(){
  function readableInitial(){
    try{
      if (typeof MODE !== "undefined" && MODE === "mind") return;   /* 脑图模式不做初始缩放 */
      var st = ChainView.state;
      if (!st || typeof svg === "undefined" || !svg.clientWidth) return;
      var TARGET = 0.72;
      if (st.scale >= TARGET) return;
      st.scale = TARGET;
      st.tx = 46;
      st.ty = 112;
      ChainView.render(true);   /* 按目标缩放整页重绘一次，避免只改 transform 造成的文字重影 */
      var z = document.getElementById("zoomval");
      if (z) z.textContent = Math.round(TARGET*100) + "%";
    }catch(e){}
  }
  function mindOverview(){
    try{
      if (typeof MODE === "undefined" || MODE !== "mind") return;
      var changed = false;
      DATA.c.forEach(function(n){
        if (n.tech && !mindState.collapsed.has(n)){ mindState.collapsed.add(n); changed = true; }
      });
      if (changed){ renderMind(false); }
    }catch(e){}
  }
  function boot(){
    setTimeout(readableInitial, 220);   /* 长链模式：可读比例起头 */
    setTimeout(mindOverview, 260);      /* 脑图模式：收起到大类 / 12 站 */
  }
  if (document.readyState === "complete") boot();
  else window.addEventListener("load", boot);
})();
</script>
