<script>
/* ================= 共享层：元素、标记、缩放、模式 ================= */
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map");
const scene = document.getElementById("scene");
function el(tag, attrs){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
const $ = id => document.getElementById(id);
/* 顶栏可能因窗口变窄而换行：按实测高度留上边距，避免内容被顶栏压住 */
function topPadPx(extra){
  const b = document.querySelector(".topbar");
  const h = (b && b.offsetHeight) ? b.offsetHeight : 60;
  return h + extra;
}

/* ================= 文字测量与折行（两种模式共用一套） =================
   用 Canvas measureText 真实测量宽度（不是按字符数估算），
   再按「CJK 单字成词、英文按空格切词」折行，避免把 Axios 劈成 A / xios。 */
function isCJK(ch){ return /[\u3000-\u303f\u4e00-\u9fff\uff00-\uffef]/.test(ch); }
const _mc = document.createElement("canvas").getContext("2d");
let _fontFam = null;
const _wCache = new Map();
function textW(s, fs, weight){
  const w = weight || 400;
  const key = w + "|" + fs + "|" + s;
  const hit = _wCache.get(key);
  if (hit !== undefined) return hit;
  if (_fontFam === null) _fontFam = getComputedStyle(document.body).fontFamily;
  _mc.font = w + " " + fs + "px " + _fontFam;
  const v = _mc.measureText(s).width;
  _wCache.set(key, v);
  return v;
}
function tokenize(s){
  // CJK/标点 单字成词；英文按空格切词（空格并入前一词，作为断行点）
  const out = []; let buf = "";
  for (const ch of s){
    if (isCJK(ch)){
      if (buf){ out.push(buf); buf = ""; }
      out.push(ch);
    } else if (ch === " "){
      buf += ch; out.push(buf); buf = "";
    } else {
      buf += ch;
    }
  }
  if (buf) out.push(buf);
  // 收尾标点并到前一个词，避免“）”单独占一行
  const merged = [];
  for (const tk of out){
    if (merged.length && /^[）】」』，。、；：？！\)\]%]+$/.test(tk)) merged[merged.length-1] += tk;
    else merged.push(tk);
  }
  return merged;
}
/* 单词本身就比行宽还长时（超长标识符），才退化成按字符切 */
function splitLong(tk, fs, budget, weight){
  if (textW(tk, fs, weight) <= budget) return [tk];
  const out = []; let rest = tk;
  while (rest){
    let n = 1;
    while (n < rest.length && textW(rest.slice(0, n+1), fs, weight) <= budget) n++;
    out.push(rest.slice(0, n));
    rest = rest.slice(n);
  }
  return out;
}
function wrap2(s, fs, budget, maxL, weight){
  const toks = [];
  tokenize(s).forEach(tk => splitLong(tk, fs, budget, weight).forEach(x => toks.push(x)));
  const lines = []; let cur = "";
  for (const tk of toks){
    const test = cur + tk;
    if (cur && textW(test, fs, weight) > budget){
      lines.push(cur); cur = tk;
      if (lines.length >= maxL){ cur = ""; break; }
    } else cur = test;
  }
  if (cur && lines.length < maxL) lines.push(cur);
  // 用「去空白后的字符数」判断是否真的有内容没放下（避免空格导致误判）
  const full = toks.join("").replace(/\s/g, "");
  const used = lines.join("").replace(/\s/g, "");
  if (used.length < full.length && lines.length){
    let last = lines[lines.length-1];
    while (last.length > 1 && textW(last+"…", fs, weight) > budget) last = last.slice(0,-1);
    lines[lines.length-1] = last + "…";
  }
  return lines;
}

const DATA = {"t":"二阶魔方 DQN：从 2.4% 到 94.75% 的全流程复盘（七章）","c":[{"t":"第一章 已有环境（原作者模型审计）","c":[{"t":"1.1 项目从哪来：一个正经的开源 HRL 雏形","c":[{"t":"仓库：sebastianbrzustowicz/Rubik2x2-DQN，MIT 协议，2025-10 建，README 自述「multiparadigm DQN + IL」。","c":[],"color":"#64748B"},{"t":"设计：RL agent 负责第一层；IL 模型用预定义算法（CLL / Y-perm / J-perm + 镜像旋转增强）解第二层，full 数据集共 648 个算法。","c":[],"color":"#64748B"},{"t":"规模：Q 网络 144→256→256→18 共 107,538 参数；IL 分类器 144→512→648 类；动作空间 Discrete(18)。","c":[],"color":"#64748B"},{"t":"工程：有单元测试 tests/test_cube_state.py、pyproject.toml、Makefile、CLI --quiet、LBL 求解器、MLflow 记录。","c":[],"color":"#64748B"},{"t":"核对版本：main 分支 HEAD 1448d8d（2025-11-28），与本地审计文档同一版本。","c":[],"color":"#64748B"}],"color":"#64748B"},{"t":"1.2 原始配置：函数默认值 ≠ 推荐参数","c":[{"t":"函数默认：train_rl_agent() 的 epsilon_end=0.5、reward_mode=\"sticker_plus_face\"、batch=128、lr=1e-3。","c":[],"color":"#64748B"},{"t":"推荐配置：作者的实验脚本 rl_experiment_planner.py 用 epsilon_start=0.3、epsilon_end=0.01、bottom_layer_corners、batch=256、lr=1e-4。","c":[],"color":"#64748B"},{"t":"DQNAgent 自己的默认 epsilon_end 是 0.1。","c":[],"color":"#64748B"},{"t":"复现时用哪一套参数，结果差一个数量级——这是第一章最需要说清的事。","c":[],"color":"#64748B"}],"color":"#64748B"},{"t":"1.3 奖励模式：默认 sticker_plus_face，推荐 bottom_layer_corners","c":[{"t":"train_rl_agent() 默认 reward_mode=\"sticker_plus_face\"（绝对值型），env 默认 \"basic\"（稀疏）。","c":[],"color":"#64748B"},{"t":"作者 planner 与 run_pipeline 用的是 bottom_layer_corners，其中包含 delta 进度项（README 写明 a delta term tracks progress between consecutive states）。","c":[],"color":"#64748B"},{"t":"我们的工作：用 5 种模式 × 3 seed 消融，量化出绝对值型 0.2%~7.8%、进度型 88.5%±2.3。","c":[],"color":"#64748B"}],"color":"#64748B"},{"t":"1.4 训练循环：total_steps 未被使用，退出条件在最高难度 99%","c":[{"t":"train(total_steps=...) 收到参数后从未被使用；主循环是 while True。","c":[],"color":"#64748B"},{"t":"退出条件：best_scramble_len 达到 scramble_max、best_success_rate ≥ 0.99、该档已跑满 5000 局，三者同时满足才 break。","c":[],"color":"#64748B"},{"t":"实际效果：正常训练只有在最高难度上打到 99% 才自然结束，通常等不到，所以多数情况靠手动停止。","c":[],"color":"#64748B"}],"color":"#64748B"},{"t":"1.5 日志：细粒度指标在 MLflow，关闭后只剩零星 print","c":[{"t":"每 10k 步的指标（ε / avgR / success_rate / current_scramble）只在 use_mlflow=True 时打印并写 MLflow。","c":[],"color":"#64748B"},{"t":"不依赖 MLflow 的打印只有三处：新最优模型保存、训练结束、模型保存路径。","c":[],"color":"#64748B"},{"t":"所以关掉 MLflow 跑起来像卡住，实际还在训练。","c":[],"color":"#64748B"}],"color":"#64748B"},{"t":"1.6 评估口径：README 同时给了 30 步与 100 步两套结果","c":[{"t":"README 的 Results 表：max_steps=30 → 训练 97% / 评估 69%；max_steps=100 → 评估 ~99%。","c":[],"color":"#64748B"},{"t":"README 给出的解释：评估视野短时，长打乱的局在步数内跑不完，所以评估低；放宽到 100 步才能收敛。","c":[],"color":"#64748B"},{"t":"我们的口径：统一用 30 步做横向对比，并在汇报里注明来源；100 步的数字不作为能力依据。","c":[],"color":"#64748B"}],"color":"#64748B"},{"t":"1.7 我们在默认参数下的复现：18 万步 2.4%","c":[{"t":"用 train_rl_agent() 默认参数（ε_end=0.5、sticker_plus_face、batch=128、lr=1e-3）跑 18 万步，成功率 2.4%。","c":[],"color":"#64748B"},{"t":"换成 planner 配置后，同一套代码能到 README 的 97% 训练准确率。","c":[],"color":"#64748B"},{"t":"结论：默认值与推荐配置不一致，复现前先对齐超参，再谈模型改动。","c":[],"color":"#64748B"}],"color":"#64748B"},{"t":"1.8 名词科普：后面会反复出现的四个词","c":[{"t":"Replay Buffer（经验回放池）：学霸的错题本，把走过的路随机抽出来复习，打破时间相关性。","c":[],"color":"#64748B"},{"t":"Target Network（目标网络）：端着戒尺的老教授，每 1000 步抄一次学生作业当标准答案，防止自举高估。","c":[],"color":"#64748B"},{"t":"TD Error（时序差分误差）：边走边看导航算差价，Target Q 减去预测 Q，就是它驱动网络更新。","c":[],"color":"#64748B"},{"t":"Reward Shaping（奖励塑形）：不按绝对成绩发奖金，按进步幅度发奖金，防止原地刷分。","c":[],"color":"#64748B"}],"color":"#64748B"}],"color":"#64748B"},{"t":"第二章 初期架构设想","c":[{"t":"2.1 初期设想：A 跑底层，B 跑顶层，共享一个魔方","c":[{"t":"最初架构非常朴素：一个魔方对象，两段策略——A 负责把底层拼好，B 负责在底层拼好的基础上复原整颗。","c":[],"color":"#0EA5E9"},{"t":"名词科普 · HRL（学术）：把复杂任务分解成多个子任务，由不同层级的策略分别学习；大白话：盖楼分包，A 师傅专修地基、B 师傅专修屋顶，最后合成一栋楼。","c":[],"color":"#0EA5E9"},{"t":"为什么分层：整颗魔方一次性端到端学太难（18 步以上的长序列 + 稀疏奖励），拆成两步能显著降低搜索空间。","c":[],"color":"#0EA5E9"},{"t":"代价：多了一次「交班」，交班状态的质量直接决定 B 的难度。","c":[],"color":"#0EA5E9"}],"color":"#0EA5E9"},{"t":"2.2 交班条件与失败判定","c":[{"t":"交班：A 调 is_solved() 判定「底层已好」，把魔方交给 B；B 把整颗复原后调 is_entire_cube_solved() 结束。","c":[],"color":"#0EA5E9"},{"t":"坑：is_solved() 的判定很宽松（底面同色 + 前底两贴纸同色），并不代表「四个底边都对齐」——这正是第五章步数冗长的根源。","c":[],"color":"#0EA5E9"},{"t":"初期版本没有兜底：任何一方搞砸，系统直接判失败、这一局就废了。","c":[],"color":"#0EA5E9"},{"t":"面试话术：分层的第一道设计题是「交班契约」——判定标准严不严，直接决定下游模型是「接干净活」还是「天天擦屁股」。","c":[],"color":"#0EA5E9"}],"color":"#0EA5E9"},{"t":"2.3 两个关键判定别混：is_solved vs is_entire_cube_solved","c":[{"t":"is_solved()：只保证第一层（底层 + 前底两贴纸），用于 A 的交班判定。","c":[],"color":"#0EA5E9"},{"t":"is_entire_cube_solved()：6 面各自同色，用于整颗完成判定。","c":[],"color":"#0EA5E9"},{"t":"混用的代价：拿 is_solved 当整颗复原率，指标会虚高；拿 strict 判定做训练目标，又会让 A 学得更慢。","c":[],"color":"#0EA5E9"},{"t":"记忆点：宽松判定 = 交班快但脏；严格判定 = 交班慢但干净，第六章就是把它换成了严格版。","c":[],"color":"#0EA5E9"}],"color":"#0EA5E9"}],"color":"#0EA5E9"},{"t":"第三章 底层突围（训练 1~3）","c":[{"t":"3.1 训练 1：先排雷，再谈成绩（2.4% → 87.5%）","c":[{"t":"动作：把 ε 下限从 0.5 压到 0.01（不再一半时间瞎拧），把奖励改成进度塑形（比上一步多拼对才加分）。","c":[],"color":"#2563EB"},{"t":"结果：只跑 5 万步、23 秒，A 的底层成功率从 2.4% 飙到 87.5%，第 9,000 步跨过 50%。","c":[],"color":"#2563EB"},{"t":"学术解释：引入 Reward Shaping，修正了原版 Reward Hacking（奖励黑客）问题。","c":[],"color":"#2563EB"},{"t":"大白话破案：以前按「固定底薪」发钱，员工就躺平刷钱；改成「按提成」发钱，干得多拿得多，自然拼命往前冲。","c":[],"color":"#2563EB"},{"t":"面试话术：这是典型的工程排雷——先修默认参数与奖励函数，再谈模型结构；同样的网络，改完超参就从 2.4% 到 87.5%。","c":[],"color":"#2563EB"}],"color":"#2563EB"},{"t":"3.2 为什么绝对值奖励会被「农场化」","c":[{"t":"绝对值奖励按「当前拼对多少贴纸」给分，AI 发现停在某个还不错的状态反复微调，就能持续拿分——这叫 Reward Hacking。","c":[],"color":"#2563EB"},{"t":"进度塑形奖励（Δ）只看「这一步比上一步多了多少」，原地打转拿不到分，逼它真往前走（bottom_layer_corners 里已有这个 delta 项）。","c":[],"color":"#2563EB"},{"t":"数据：5 种奖励模式 × 3 seed 消融，进度型 88.5%±2.3，绝对值型只有 0.2%~7.8%，差 11~400 倍。","c":[],"color":"#2563EB"},{"t":"面试话术：稀疏奖励先做塑形，塑形一定用增量而不是绝对值，并且必须用消融实验证明——单 seed 会骗人（有个模式单跑 13%，三 seed 平均 3.7%）。","c":[],"color":"#2563EB"}],"color":"#2563EB"},{"t":"3.3 训练 2 & 3：用课程学习极限拉扯（1 步 → 10 步）","c":[{"t":"训练 2：把同一个实验从 5 万步延长到 60 万步，课程学习触发两次，打乱长度 1 → 3，成功率 60.5%。","c":[],"color":"#2563EB"},{"t":"训练 3：再延长到 500 万步，课程自动升档 9 次，打乱长度 1 → 10，最终成功率仍是 60.5%。","c":[],"color":"#2563EB"},{"t":"机制：每 5000 次 reset 检查最近 10000 局平均成功率，≥70% 就把打乱长度 +1——考及格就换更难的卷子。","c":[],"color":"#2563EB"},{"t":"坑：60.5% 比训练 1 的 87.5% 低不是练坏了，是难度从 1 档升到 10 档，两个数字不是同一道题。","c":[],"color":"#2563EB"},{"t":"面试话术：课程学习要配「口径标签」，否则升档后的成功率下降会被误读成退化。","c":[],"color":"#2563EB"}],"color":"#2563EB"},{"t":"3.4 底层阶段的能力边界","c":[{"t":"A 在 1 档打乱下能到 87.5%，但难度升到 10 档后只有 60.5%——纯 RL 的天花板受探索与稀疏奖励限制。","c":[],"color":"#2563EB"},{"t":"它还没有「严格底层」的概念：判定宽松，A 交出来的状态常常侧面没对齐。","c":[],"color":"#2563EB"},{"t":"这个隐患一直埋到第五章才爆：总步数 30.1 步，A 一个人就占 18.96 步。","c":[],"color":"#2563EB"},{"t":"引出下一章：底层能跑通之后，顶层才是真正的稀疏奖励地狱。","c":[],"color":"#2563EB"}],"color":"#2563EB"}],"color":"#2563EB"},{"t":"第四章 顶层破局（训练 4~7）","c":[{"t":"4.1 训练 4：顶层从零纯 RL，5 万步只有 2.0%","c":[{"t":"让 B 从零开始纯强化学习：必须在 647 个「底层已好」状态上把整颗复原才给分。","c":[],"color":"#7C3AED"},{"t":"结果：5 万步后贪心成功率 2.0%（13/647），ε 扫描最优下限 0.20 也只能从 0.9% 抬到 2.0%。","c":[],"color":"#7C3AED"},{"t":"学术解释：Sparse Reward 导致梯度稀疏，MDP 探索空间过大，模型连一次正反馈都拿不到。","c":[],"color":"#7C3AED"},{"t":"大白话破案：蒙上眼扔飞镖，扔一万次连靶子边都没碰到，心态直接崩了。","c":[],"color":"#7C3AED"}],"color":"#7C3AED"},{"t":"4.2 训练 5：IL 开卷背书，2% → 78.7%","c":[{"t":"动作：用 648 个专家公式生成 2 万多条标准答案，逼 B 先抄作业（行为克隆，交叉熵监督学习）。","c":[],"color":"#7C3AED"},{"t":"结果：单步准确率 94.5%，贪心成功率直接拉到 78.7%（509/647）——从 2% 到 78.7% 是量级跃迁。","c":[],"color":"#7C3AED"},{"t":"学术解释：Imitation Learning（模仿学习）通过交叉熵实现监督学习热启动。","c":[],"color":"#7C3AED"},{"t":"大白话破案：先让学渣背下所有高考公式（开卷），把底子垫起来再上考场。","c":[],"color":"#7C3AED"},{"t":"面试话术：面对极端稀疏奖励，先用 IL 热启动再 RL 微调，是性价比最高的路线；纯 RL 在这个任务上 50k 步只有 2%。","c":[],"color":"#7C3AED"}],"color":"#7C3AED"},{"t":"4.3 灾难性遗忘：微调时把背书全忘了（78.7% → 14%）","c":[{"t":"问题：在 IL 模型上接 RL 微调，环境奖励量级太大，纯 TD 梯度直接把 IL 学到的策略冲垮，成功率掉到 14%。","c":[],"color":"#7C3AED"},{"t":"学术解释：梯度量级冲突引发 Catastrophic Forgetting（灾难性遗忘）——新任务的梯度覆盖了旧知识。","c":[],"color":"#7C3AED"},{"t":"大白话破案：放他去考场，结果被老板的巨额奖金吸引，把公式全忘了。","c":[],"color":"#7C3AED"},{"t":"面试话术：IL 接 RL 时必须做「防遗忘」设计，否则越训越废；这是我踩过最硬的坑。","c":[],"color":"#7C3AED"}],"color":"#7C3AED"},{"t":"4.4 解决方案：Anchor Loss 把专家栓住","c":[{"t":"做法：Loss = TD 损失 + λ × 交叉熵(当前动作分布, 专家动作)，λ 取 100（单独微调）到 1000（联合训练）。","c":[],"color":"#7C3AED"},{"t":"效果：既允许 TD 探索新策略，又用超大惩罚项锁住专家路线，偏离就罚到破产。","c":[],"color":"#7C3AED"},{"t":"配套：奖励缩放（+100 压到 +10），让两项损失量级接近，否则 TD 会压过交叉熵。","c":[],"color":"#7C3AED"},{"t":"面试话术：Anchor Loss 的关键是「权重配比」——λ 太大不敢探索、太小忘光，1000 是配合奖励缩放调出来的量级。","c":[],"color":"#7C3AED"}],"color":"#7C3AED"},{"t":"4.5 训练 5~7 结果：79% → 81.1%，79 是 BC 的天花板","c":[{"t":"训练 5（5 万步）：78.7% → 79.0%，平均步数 16.3 → 15.9。","c":[],"color":"#7C3AED"},{"t":"训练 6（60 万步）：成功率仍 79.0%，步数压到 15.1，训练口径 62.5% → 68.5%。","c":[],"color":"#7C3AED"},{"t":"训练 7（500 万步）：突破到 81.1%（525/647），步数 15.4，用了 81.6 分钟。","c":[],"color":"#7C3AED"},{"t":"结论：79% 基本就是「BC 一次都不走偏」的比例，纯靠 RL 微调磨 500 万步才涨 2 个点。","c":[],"color":"#7C3AED"}],"color":"#7C3AED"}],"color":"#7C3AED"},{"t":"第五章 系统容灾与联合（训练 8）","c":[{"t":"5.1 训练 8：A/B 正式合体 + Fallback 兜底","c":[{"t":"合体：A 拼底层 → 交班 → B 拼顶层；课程改成 1~9 档各 5 万步 + 随机混合 35 万步（共 80 万步），A 冻结、B 强锚定 λ=1000。","c":[],"color":"#B45309"},{"t":"关键设计 · Fallback：如果 A 卡死超过 30 步，不判死刑，直接把烂摊子交给 B。","c":[],"color":"#B45309"},{"t":"为什么有效：B 在 18 个动作空间里探索过，具备「弱通用求解器」能力，实测能救回 75% 的残局。","c":[],"color":"#B45309"},{"t":"结果：Fallback 让端到端成功率提升 15%~17%，最终端到端 93.5%（n=200）。","c":[],"color":"#B45309"},{"t":"大白话破案：A 师傅修不好，立刻请见多识广的 B 师傅来「擦屁股」。","c":[],"color":"#B45309"}],"color":"#B45309"},{"t":"5.2 交接容错实测：B 到底能不能擦屁股","c":[{"t":"真实交接状态（308 条）：查表法 99.4%，训练 7 的 B 98.4%（12.5 步），联合训练的 B 94.2%（10.4 步）。","c":[],"color":"#B45309"},{"t":"越界状态（A 超时、底层没解，92 条）：联合 B 救回 75.0%，训练 7 的 B 73.9%，查表法 0%。","c":[],"color":"#B45309"},{"t":"查表法为什么 0%：它只会输出「底层已好」的 648 条公式之一，遇到越界输入完全无能为力。","c":[],"color":"#B45309"},{"t":"结论：DQN 的泛化才是兜底能力的来源；查表法在正常状态更快，但一越界就废。","c":[],"color":"#B45309"}],"color":"#B45309"},{"t":"5.3 致命软肋：总步数 30.1（A 18.96 + B 11.09）","c":[{"t":"成绩虽好，但步数冗长：端到端总步数 30.1 步，A 一个人走了 18.96 步，B 走了 11.09 步。","c":[],"color":"#B45309"},{"t":"根因：评判 A 完工的标尺太宽松——只看底面变黄，不看侧面四个边是否对齐。","c":[],"color":"#B45309"},{"t":"后果：A 绕了十几步冤枉路，交班时还留一堆错误给 B，B 又要多花步数去修。","c":[],"color":"#B45309"},{"t":"提问式讲解：如果换一把严格的尺子，A 的步数会怎样？——引出第六章的 BFS 蒸馏。","c":[],"color":"#B45309"}],"color":"#B45309"}],"color":"#B45309"},{"t":"第六章 极限步数压缩（训练 9）","c":[{"t":"6.1 训练 9 手术刀 1：BFS 严格标尺（换上帝视角导航）","c":[{"t":"学术解释：Breadth-First Search（广度优先搜索）遍历 360 万个状态，生成严格的状态距离场（Distance Field）。","c":[],"color":"#059669"},{"t":"产出：本机 BFS 跑几个小时，生成几十 MB 的 dist_to_strict_layer.npz 距离表。","c":[],"color":"#059669"},{"t":"规则变更：必须四个底边全部对齐，才算「底层完工」——把宽松判定换成严格判定。","c":[],"color":"#059669"},{"t":"大白话破案：以前 A 师傅靠蒙，现在用超级计算机穷举所有可能，生成一本绝对精确的导航地图。","c":[],"color":"#059669"},{"t":"面试话术：任务边界的严格定义，是所有步数优化的前提；标尺不换，后面怎么调都是绕路。","c":[],"color":"#059669"}],"color":"#059669"},{"t":"6.2 手术刀 2：On-policy 蒸馏（把算力塞进脑子）","c":[{"t":"学术解释：让旧策略在环境中采样真实状态，用 BFS 专家动作打标（Oracle），再用交叉熵（CE）微调模型（Behavior Cloning）。","c":[],"color":"#059669"},{"t":"采样：让旧 A 自己跑 4000 局，收集 4.8 万次它真实碰壁的「死局」，保证数据分布和线上推理一致。","c":[],"color":"#059669"},{"t":"为什么必须 On-policy：拿固定题库教会过拟合，让旧模型自己跑出来的数据才是「靶向治疗」。","c":[],"color":"#059669"},{"t":"大白话破案：翻开 BFS 导航地图，把 4.8 万道题每一步正确走法标上去，逼着新 A 死记硬背。","c":[],"color":"#059669"}],"color":"#059669"},{"t":"6.3 战果：A 从 18.96 步暴跌到 6.64 步","c":[{"t":"步数：从 18.96 步压缩到 6.64 步（降幅约 65%）。","c":[],"color":"#059669"},{"t":"成功率：不仅没降，反而升到 97%——严格标尺 + 精确标签让 A 走得更准。","c":[],"color":"#059669"},{"t":"原理：把 BFS 搜索的算力，内化为 10 万参数网络的直觉；离线贵、在线便宜。","c":[],"color":"#059669"},{"t":"面试话术：这是「知识蒸馏 + 任务边界重定义」的组合拳——先换标尺，再用 Oracle 打标蒸馏。","c":[],"color":"#059669"}],"color":"#059669"},{"t":"6.4 手术刀 3：B 的冻结重训（接口对齐）","c":[{"t":"问题：A 变了，A 交给 B 的残局也变了——B 以前习惯了擦屁股，现在接到的是干净的活，输入分布变了（Covariate Shift）。","c":[],"color":"#059669"},{"t":"做法：冻结 A 的参数，让 B 在全新的「完美交接」状态下重新训练，并用课程学习一段一段加码。","c":[],"color":"#059669"},{"t":"结果：B 的步数降到 7.35 步。","c":[],"color":"#059669"},{"t":"大白话破案：A 现在交接的残局极度干净，B 以前练的是「擦屁股」，现在要练「精装修」。","c":[],"color":"#059669"}],"color":"#059669"},{"t":"6.5 端到端战报：30.1 → 15.5 步（-46%），成功率 94.75%","c":[{"t":"总步数：从 30.1 步压缩到 15.5 步，降幅 46%。","c":[],"color":"#059669"},{"t":"成功率：端到端 94.75%，比训练 8 的 93.5% 还高。","c":[],"color":"#059669"},{"t":"构成：A 6.64 步 + B 7.35 步（含交班与少量兜底）。","c":[],"color":"#059669"},{"t":"讲解要点：这一章是全项目的技术高点——先换标尺、再蒸馏、再重训下游，三步连环。","c":[],"color":"#059669"}],"color":"#059669"}],"color":"#059669"},{"t":"第七章 深水区与克制（训练 10~13）","c":[{"t":"7.1 想法：A 能蒸馏，B 为什么不能","c":[{"t":"同样的套路：用 BFS 距离场给 B 生成标签，期望把 B 的步数也压下来。","c":[],"color":"#DC2626"},{"t":"预期：A 靠蒸馏从 18.96 步干到 6.64 步，B 应该也能复制这个成功。","c":[],"color":"#DC2626"},{"t":"现实：整颗复原的平均最优动作不唯一——这引出了多解爆炸。","c":[],"color":"#DC2626"},{"t":"这一章是「负结果」章，讲清楚为什么停手比硬上更专业。","c":[],"color":"#DC2626"}],"color":"#DC2626"},{"t":"7.2 训练 10 & 11：多解爆炸的噩梦","c":[{"t":"学术解释：Multi-solution Explosion（多解爆炸）——魔方整颗复原时，平均每个状态有 4.5 个等价的最优动作。","c":[],"color":"#DC2626"},{"t":"强行用单一 CE 硬标签去教 B，会摧毁它原有的 Q 值排序，成功率暴跌。","c":[],"color":"#DC2626"},{"t":"尝试改进：Tie-aware CE（并列最优一起当正样本）、Soft KL（按分布软融合）——仍失败。","c":[],"color":"#DC2626"},{"t":"根因诊断：B 的隐藏层经长期 RL 训练已 Dead ReLU + 低秩固化，线性头学不动，全网络放开又整体漂移。","c":[],"color":"#DC2626"},{"t":"大白话破案：你告诉徒弟「去北京往东走」，但他原本习惯往西；你硬掰他的脑子，他直接精神分裂，94% 的能力当场废掉。","c":[],"color":"#DC2626"}],"color":"#DC2626"},{"t":"7.3 训练 12：KL 锚定的崩溃","c":[{"t":"学术解释：用 KL 散度约束策略更新幅度，但 TD 误差的梯度量级（20~60）远大于 Q 值本身，约束失效。","c":[],"color":"#DC2626"},{"t":"大白话破案：拿根小绳子（KL 约束）想拴住一头狂暴的野兽（TD 梯度），绳子直接崩断。","c":[],"color":"#DC2626"},{"t":"教训：在已高度收敛的 Q 网络上，常规正则化手段压不住 TD 梯度。","c":[],"color":"#DC2626"}],"color":"#DC2626"},{"t":"7.4 训练 13：价值校准的最后尝试","c":[{"t":"学术解释：对奖励与输出层做归一化（Value Calibration），把 TD 误差压到 3~11 的量级。","c":[],"color":"#DC2626"},{"t":"结果：数值是正常了，但高度收敛的 Q 网络处于局部最优（Local Optimum），极其脆弱。","c":[],"color":"#DC2626"},{"t":"大白话破案：把数值调理正常了，但只要动一丝一毫，原本严丝合缝的齿轮就卡壳。","c":[],"color":"#DC2626"}],"color":"#DC2626"},{"t":"7.5 大厂级定论：封存负结果，保全线上 94.75%","c":[{"t":"结论：B 模型的可微调空间已经耗尽——4 种方法（硬标签蒸馏 / 软目标 KL / RL+KL / 价值校准）全部失败。","c":[],"color":"#DC2626"},{"t":"决策：果断全部封存，保全线上 94.75% 的最优模型，不为指标去破坏它。","c":[],"color":"#DC2626"},{"t":"面试话术：高度收敛的模型是脆弱的，微调往往意味着毁灭；能识别「该停手」比会调参更重要。","c":[],"color":"#DC2626"},{"t":"价值：负结果排除了整条技术路线，并给出了可复现的机制证据（多解爆炸 + 低秩固化）。","c":[],"color":"#DC2626"}],"color":"#DC2626"}],"color":"#DC2626"},{"t":"终章 技术栈全景与面试话术","c":[{"t":"8.1 架构设计类：分层解决了什么核心痛点","c":[{"t":"问：你的分层架构解决了什么核心痛点？","c":[],"color":"#111827"},{"t":"答：解决长序列决策中的稀疏奖励与误差级联问题。用 HRL 拆任务，底层 A 专注第一层、顶层 B 专注整颗，再配 Fallback 兜底，端到端成功率提升 15%。","c":[],"color":"#111827"},{"t":"关键词：HRL、Fallback、弱通用求解器、端到端 93.5%。","c":[],"color":"#111827"}],"color":"#111827"},{"t":"8.2 原理深挖类：Target Network 为什么防 Q 值爆炸","c":[{"t":"问：DQN 的 Target Network 为什么能防止 Q 值爆炸？","c":[],"color":"#111827"},{"t":"答：TD 目标若用主网络生成，会形成「自举高估」的正反馈；Target Network 定时硬同步（1000 步）提供稳定锚点，打断循环。","c":[],"color":"#111827"},{"t":"关键词：自举高估、硬同步、锚点、平滑收敛。","c":[],"color":"#111827"}],"color":"#111827"},{"t":"8.3 工程优化类：步数冗长怎么优化","c":[{"t":"问：针对步数冗长，你是怎么优化的？","c":[],"color":"#111827"},{"t":"答：核心是任务边界严格定义 + 知识蒸馏。用 BFS 构建严格距离场，On-policy 采真实分布并用 BFS 打标签，再用 CE 把搜索算力内化为 10 万参数网络的直觉。","c":[],"color":"#111827"},{"t":"结果：A 18.96→6.64 步，B 7.35 步，端到端 30.1→15.5 步（-46%），成功率 94.75%。","c":[],"color":"#111827"}],"color":"#111827"},{"t":"8.4 负结果排雷类：4 种方法都失败说明了什么","c":[{"t":"问：你在项目中遇到过什么失败？","c":[],"color":"#111827"},{"t":"答：我尝试 4 种方法（硬标签蒸馏 / 软目标 KL / RL+KL / 价值校准）微调顶层 B，全部失败；确诊为多解特性（4.5 个最优动作）与 Q 值排序不可调和的冲突。","c":[],"color":"#111827"},{"t":"决策：果断封存负结果，没有为指标破坏线上模型。","c":[],"color":"#111827"},{"t":"升华：高度收敛的模型是脆弱的，微调往往意味着毁灭——这是最有含金量的工程判断。","c":[],"color":"#111827"}],"color":"#111827"}],"color":"#111827"}],"color":"#0F172A"};/* 作者内置标记：首次访问时作为初始状态，清空后不再自动恢复 */

/* ================= 思维导图引擎 ================= */
const FS   = {0:17, 1:13.5, 2:12, 3:11};
const PADX = {0:22, 1:15, 2:12, 3:10};
const PADY = {0:15, 1:10, 2:7.5, 3:6.5};
const GAPY = {0:22, 1:9, 2:5, 3:4};
const GAPX = {0:78, 1:52, 2:40, 3:34};
const MAXW = {0:360, 1:300, 2:300, 3:400};
const MAXL = {0:99, 1:99, 2:99, 3:99};   // 不再截断：文字按需换行，全部显示（原来是 1/2/2/3 行，超出加省略号）

function measure(node, level, path){
  node._level = level;
  node._path = path;
  node._lines = wrap(node.t, level);
  node._w = Math.max(0, ...node._lines.map(l => textW(l, FS[level], WEIGHT[level]))) + PADX[level]*2;
  node._h = node._lines.length * (FS[level]*1.4) + PADY[level]*2;
  node._open = !mindState.collapsed.has(node) && node.c && node.c.length > 0;
  if (node._open) node.c.forEach((ch,i) => measure(ch, level+1, path + "-" + i));
}

function layoutSide(nodes, dir, x0){
  let cursor = 0;
  function place(node, level, colX){
    // colX: 该节点列的「锚点」：右向为左边缘，左向为右边缘
    node._dir = dir;
    if (dir > 0){ node._x = colX; }
    else { node._x = colX - node._w; }
    if (!node._open || !node.c || !node.c.length){
      node._y = cursor;
      cursor += node._h + GAPY[Math.min(level,3)];
      return node._y + node._h/2;
    }
    const nextX = dir > 0
      ? colX + node._w + GAPX[Math.min(level,3)]
      : colX - node._w - GAPX[Math.min(level,3)];
    const centers = node.c.map(ch => place(ch, level+1, nextX));
    node._y = (Math.min(...centers) + Math.max(...centers))/2 - node._h/2;
    return node._y + node._h/2;
  }
  nodes.forEach(st => place(st, 1, x0));
  return { height: cursor };
}

function collect(node, out){
  out.push(node);
  if (node._open) node.c.forEach(ch => collect(ch, out));
  return out;
}

function assignPaths(node, path){
  node._path = path;
  (node.c||[]).forEach((ch,i) => assignPaths(ch, path + "-" + i));
}

function build(){
  // 0. 先给全部节点分配路径（折叠的也要有，否则标记会串号）
  assignPaths(DATA, "r");
  // 1. 测量
  measure(DATA, 0, "r");
  // 2. 分左右（交替）
  const rightStages = [], leftStages = [];
  DATA.c.forEach((st, i) => { (i % 2 === 0 ? rightStages : leftStages).push(st); });
  // 3. 两侧布局（先在各自局部坐标）
  const R = layoutSide(rightStages, +1, 0);
  const L = layoutSide(leftStages, -1, 0);

  // 左内侧的局部 x 范围：最右是 0，最左是负值
  let leftMinX = 0, rightMaxX = 0;
  const walkX = (n, pick) => { pick(n); if (n._open) n.c.forEach(ch => walkX(ch, pick)); };
  leftStages.forEach(st => walkX(st, n => { leftMinX = Math.min(leftMinX, n._x); }));
  rightStages.forEach(st => walkX(st, n => { rightMaxX = Math.max(rightMaxX, n._x + n._w); }));

  const leftW = -leftMinX;
  const gapR = GAPX[0], rootW = DATA._w;
  // 水平位移：左侧整体平移到 0 起，根紧随其后
  const shiftLeft = leftW;
  const rootX = leftW + gapR;
  const shiftRight = rootX + rootW + gapR;

  const shiftSide = (stages, dx, dy) => {
    stages.forEach(st => {
      const walk = n => { n._x += dx; n._y += dy; if (n._open) n.c.forEach(walk); };
      walk(st);
    });
  };

  const H = Math.max(R.height, L.height);
  // 垂直居中：两侧各自居中
  const dyR = (H - R.height) / 2;
  const dyL = (H - L.height) / 2;
  shiftSide(rightStages, shiftRight, dyR);
  shiftSide(leftStages, shiftLeft, dyL);

  DATA._x = rootX;
  DATA._y = H/2 - DATA._h/2;

  // 收集所有可见节点
  const nodes = [];
  collect(DATA, nodes);

  return { nodes, rootX, rootW, totalH: H };
}

    g.appendChild(el("circle", { cx:x+22, cy:chainY+CARD_H/2, r:11, fill:"rgba(255,255,255,.22)" }));
    g.appendChild(txt(x+22, chainY+CARD_H/2+0.5, String(i+1), 11.5, "#fff", 800, "middle"));
    // 标题（最多 2 行）
    const lines = wrap2(st.title.replace(/^阶段[一二三四五六七八九十]+：/, ""), FS_STAGE, CARD_W-80, 3, 700);
    const lh = FS_STAGE*1.26;
    const sy = chainY + CARD_H/2 - (lines.length-1)*lh/2;
    lines.forEach((ln, k) => {
      g.appendChild(txt(x+42, sy + k*lh, ln, FS_STAGE, "#fff", 700));
    });
    // 折叠指示
    g.appendChild(el("circle", { cx:x+CARD_W-14, cy:chainY+14, r:7, fill:"rgba(255,255,255,.9)", stroke:"none" }));
    g.appendChild(txt(x+CARD_W-14, chainY+14.5, stageCollapsed ? String(st.items.length) : "−", 9, st.color, 800, "middle"));
    g.style.cursor = "pointer";
    g.addEventListener("click", ev => {
      ev.stopPropagation();
      if (state.collapsedStage.has(i)) state.collapsedStage.delete(i);
      else state.collapsedStage.add(i);
      render(true);   // 保持当前缩放/平移，不重置视图
    });
    gN.appendChild(g);

    // 竖线：阶段卡 -> 环节
    if (!stageCollapsed && col.items.length){
      const firstY = col.items[0].y;
      gN.appendChild(el("line", {
        x1:x+34, y1:chainY+CARD_H+2, x2:x+34, y2:firstY,
        stroke:st.color, "stroke-width":1.4, opacity:.35
      }));
    }

    // 环节
    col.items.forEach(row => {
      const cx = x + 8;
      const gI = el("g", {});
      gI.appendChild(el("rect", {
        x:cx, y:row.y, width:ITEM_W, height:row.h, rx:7,
        fill:"#fff", stroke:st.color, "stroke-width":1, "stroke-opacity":.45
      }));
      gI.appendChild(el("rect", { x:cx, y:row.y+5, width:3, height:row.h-10, rx:1.5, fill:st.color }));
      const ilh = FS_ITEM*1.32;
      const isy = row.y + row.h/2 - (row.lines.length-1)*ilh/2;
      row.lines.forEach((ln,k) => {
        gI.appendChild(txt(cx+12, isy + k*ilh, ln, FS_ITEM, "#1f2937", 600));
      });
      if (row.it.details.length){
        gI.appendChild(el("circle", { cx:cx+ITEM_W-13, cy:row.y+row.h/2, r:6, fill:"#fff", stroke:st.color, "stroke-width":1, "stroke-opacity":.7 }));
        gI.appendChild(txt(cx+ITEM_W-13, row.y+row.h/2+0.5, row.open ? "−" : String(row.it.details.length), 8, st.color, 700, "middle"));
      } else {
        /* 无细节的环节 = 叶子，加学习状态按钮 */
        markBtn(gI, cx+ITEM_W-13, row.y+row.h/2, row.it.p, 6.5);
      }
      gI.style.cursor = "pointer";
      gI.addEventListener("click", ev => {
        ev.stopPropagation();
        if (!row.it.details.length) return;
        if (state.collapsedItem.has(row.key)) state.collapsedItem.delete(row.key);
        else state.collapsedItem.add(row.key);
        render(true);   // 保持当前缩放/平移，不重置视图
      });
      gN.appendChild(gI);

      // 细节
      row.dets.forEach(dd => {
        const dmk = markOf(dd.p);
        gN.appendChild(el("rect", {
          x:cx+14, y:dd.y, width:DETAIL_W, height:dd.h, rx:5,
          fill: dmk ? MARK_TINTS[dmk] : "#f6f4ef",
          stroke: dmk ? MARK_COLORS[dmk] : st.color,
          "stroke-width": dmk ? 1.4 : .8,
          "stroke-opacity": dmk ? .9 : .28
        }));
        const dlh = FS_DETAIL*1.3;
        const dsy = dd.y + dd.h/2 - (dd.lines.length-1)*dlh/2;
        dd.lines.forEach((ln,kk) => {
          gN.appendChild(txt(cx+22, dsy + kk*dlh, ln, FS_DETAIL, dmk === 1 ? "#b91c1c" : "#5b6472", 400));
        });
        markBtn(gN, cx+14+DETAIL_W-13, dd.y+dd.h/2, dd.p, 6.5);
      });
    });
  });
  scene.appendChild(gN);

  if (keep){ state.scale = keep.s; state.tx = keep.x; state.ty = keep.y; apply(); }
  else { CONTENT.w = 0; }

  // 记录精确内容框，供 fit() 使用（getBBox 在这种大量分组下不准）
  CONTENT.w = (main.length-1)*(CARD_W+COL_GAP) + CARD_W;
  CONTENT.y0 = 0;
  CONTENT.h = topPad + maxH + 46;
  if (keep){ state.scale = keep.s; state.tx = keep.x; state.ty = keep.y; apply(); }
  else fit();
  updateStats();
}

function CAPTION_BG(i, c){
  // 直接用阶段色，稍作区分
  return c;
}

function apply(){
  scene.setAttribute("transform", `translate(${state.tx},${state.ty}) scale(${state.scale})`);
  document.getElementById("zoomval").textContent = Math.round(state.scale*100)+"%";
}

function fit(){
  const W = svg.clientWidth, H = svg.clientHeight;
  const clean = (new URLSearchParams(location.search)).get("clean") === "1";
  const padX = clean ? 40 : 54, padTop = clean ? 34 : topPadPx(20), padBottom = 46;
  if (!CONTENT.w) return;
  const s = Math.min((W-padX*2)/CONTENT.w, (H-padTop-padBottom)/CONTENT.h, 3);
  state.scale = Math.max(s, 0.12);
  const cw = CONTENT.w*state.scale, ch = CONTENT.h*state.scale;
  state.tx = Math.round((W - cw)/2);
  state.ty = Math.round(padTop + (H - padTop - padBottom - ch)/2 - CONTENT.y0*state.scale);
  apply();
  window.__MM_GEOM = {scale:state.scale,tx:state.tx,ty:state.ty,cw:CONTENT.w,ch:CONTENT.h,vw:svg.clientWidth,vh:svg.clientHeight};
}



return { render: render, fit: fit, apply: apply, state: state };
})();

      : "<b>点阶段</b>收起/展开环节 · <b>点环节</b>看细节 · <b>滚轮</b>缩放 · <b>拖拽</b>平移") + seedNote;

}
function setMode(m, silent){
  MODE = (m === "chain") ? "chain" : "mind";
  updateChrome();
  const keep = seen[MODE];
  seen[MODE] = true;
  redraw(keep);
  if (!silent){
    try { localStorage.setItem(LS_MODE, MODE); } catch(e){}
    try {
      const u = new URL(location.href);
      if (MODE === "chain") u.searchParams.set("mode", "chain");
      else u.searchParams.delete("mode");
      history.replaceState(null, "", u.href);
    } catch(e){}
  }
}

/* ================= 导出 / 导入 ================= */
function exportMarks(){
  const keys = Object.keys(marks);
  const payload = {
    app: "前后端数据沟通全链路-学习标记",
    version: 1,
    exportedAt: new Date().toISOString(),
    total: keys.length,
    marks: marks
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const d = new Date();
  const ymd = d.getFullYear() + "-" +
              String(d.getMonth()+1).padStart(2,"0") + "-" +
              String(d.getDate()).padStart(2,"0");
  const a = document.createElement("a");
  a.href = url;
  a.download = "学习标记-" + ymd + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  alert("已导出 " + keys.length + " 条标记\n\n文件名：学习标记-" + ymd + ".json\n（在浏览器下载目录里）\n\n把它拷到 U 盘，换电脑时用「导入标记」恢复。");
}
function importMarks(file){
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const obj = JSON.parse(fr.result);
      const m = obj.marks || obj;
      if (typeof m !== "object" || m === null || Array.isArray(m)) throw new Error("不是有效的标记文件");
      const keys = Object.keys(m).filter(k => /^r(-\d+)+$/.test(k) && m[k] >= 1 && m[k] <= 3);
      if (!keys.length) throw new Error("文件里没有可用的标记");
      if (!confirm("将导入 " + keys.length + " 条标记。\n\n规则：同一知识点以导入文件为准，其余保留你当前的标记。\n\n继续？")) return;
      keys.forEach(k => { marks[k] = m[k]; });
      saveMarks(); redraw(true); updateStats();
      alert("导入完成。\n当前共 " + Object.keys(marks).length + " 条标记。");
    } catch (e) {
      alert("导入失败：" + e.message + "\n\n请确认选的是「导出标记」生成的 json 文件。");
    }
  };
  fr.readAsText(file, "utf-8");
}
$("btn-export").onclick = exportMarks;
$("btn-import").onclick = () => $("file-import").click();
$("file-import").addEventListener("change", ev => {
  const f = ev.target.files && ev.target.files[0];
  if (f) importMarks(f);
  ev.target.value = "";
});

/* ================= 缩放 / 平移交互（两种模式共用） ================= */
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = e.deltaY < 0 ? 1.12 : 1/1.12;
  const st = curState();
  const lo = MODE === "mind" ? 0.06 : 0.08;
  const ns = Math.min(Math.max(st.scale*k, lo), 3);
  const q = ns / st.scale;
  st.tx = mx - (mx - st.tx)*q;
  st.ty = my - (my - st.ty)*q;
  st.scale = ns;
  applyZoom();
}, { passive:false });

let drag = false, lx = 0, ly = 0;
svg.addEventListener("mousedown", e => { drag = true; lx = e.clientX; ly = e.clientY; svg.classList.add("dragging"); });
window.addEventListener("mousemove", e => {
  if (!drag) return;
  const st = curState();
  st.tx += e.clientX - lx; st.ty += e.clientY - ly;
  lx = e.clientX; ly = e.clientY;
  applyZoom();
});
window.addEventListener("mouseup", () => { drag = false; svg.classList.remove("dragging"); });
window.addEventListener("resize", () => { clearTimeout(window._t); window._t = setTimeout(applyZoom, 120); });

/* ================= 初始化 ================= */
(function(){
  const q = new URLSearchParams(location.search);

  /* 导图：默认展开到环节 */
  mindState.collapsed.clear();
  const v = q.get("view") || "items";
  if (v === "items"){
    const walk = (n, d) => { if (d >= 2) mindState.collapsed.add(n); (n.c||[]).forEach(ch => walk(ch, d+1)); };
    DATA.c.forEach(st => walk(st, 1));
  } else if (v === "collapse"){
    DATA.c.forEach(st => mindState.collapsed.add(st));
  }

  /* 长链图：默认展开到环节（细节折叠） */
  ChainView.state.collapsedStage.clear();
  ChainView.state.collapsedItem.clear();
  if (q.get("detail") !== "1"){
    CHAIN.forEach((st, i) => st.items.forEach((it, j) => {
      if (it.details.length) ChainView.state.collapsedItem.add(i + "-" + j);
    }));
  }

  /* 净图模式：隐藏所有界面元素，便于截图 */
  if (q.get("clean") === "1"){
    CLEAN = true;
    document.querySelector(".topbar").style.display = "none";
    $("hint").style.display = "none";
    $("legend").style.display = "none";
    $("btn-mode").style.display = "none";
    document.body.style.backgroundImage = "none";
  }

  /* 首次访问：把作者标记作为初始状态 */
  const seeded = seedAuthorMarks();
  if (seeded) seedNote = ' · <b>已载入作者 ' + seeded + ' 条标记</b>';

  /* 初始模式：URL 优先，其次记住上次 */
  let m = "mind";
  if (q.get("mode") === "mind") m = "mind";
  else m = "chain";            /* 讲解版默认长链，?mode=mind 可切回脑图 */
  setMode(m, true);
})();
