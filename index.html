<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>前后端数据沟通全链路 · 思维导图</title>
<style>
  :root{
    --bg:#faf9f6; --ink:#111827; --muted:#6b7280;
    --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans CJK SC",system-ui,-apple-system,"Segoe UI",sans-serif;
    --shadow:0 1px 2px rgba(17,24,39,.05),0 10px 30px rgba(17,24,39,.07);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--font);
    background-image:radial-gradient(circle at 1px 1px,#e6e3dc 1px,transparent 0);
    background-size:24px 24px;
  }
  #app{position:fixed;inset:0}

  .topbar{
    position:fixed;top:0;left:0;right:0;min-height:60px;z-index:20;
    display:flex;align-items:center;gap:12px;padding:8px 20px;flex-wrap:wrap;row-gap:6px;
    background:linear-gradient(180deg,rgba(250,249,246,.97),rgba(250,249,246,.80));
    backdrop-filter:blur(10px); border-bottom:1px solid #e8e5de;
  }
  .brand{display:flex;align-items:baseline;gap:9px}
  .brand h1{margin:0;font-size:15.5px;font-weight:800;letter-spacing:.3px}
  .brand .sub{font-size:11px;color:var(--muted);letter-spacing:.4px}
  .spacer{flex:1}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  button{
    font-family:inherit;font-size:12px;font-weight:600;color:#374151;
    background:#fff;border:1px solid #dedad2;padding:6px 10px;border-radius:7px;
    cursor:pointer;transition:.14s;box-shadow:0 1px 1px rgba(17,24,39,.03);white-space:nowrap;
  }
  button:hover{background:#f2efe9;border-color:#c9c4ba}
  .zoom{display:flex;align-items:center;border:1px solid #dedad2;border-radius:7px;overflow:hidden;background:#fff}
  .zoom button{border:0;border-radius:0;box-shadow:none;padding:6px 9px}
  .zoom .val{font-size:11px;color:var(--muted);padding:0 7px;min-width:42px;text-align:center}

  svg#map{width:100%;height:100%;display:block;cursor:grab}
  svg#map.dragging{cursor:grabbing}
  .node text{font-family:var(--font);dominant-baseline:middle;pointer-events:none}
  .node{cursor:pointer}

  .hint{
    position:fixed;left:20px;bottom:14px;z-index:20;font-size:11px;color:var(--muted);
    background:rgba(255,255,255,.88);border:1px solid #e8e5de;padding:6px 11px;
    border-radius:8px;box-shadow:var(--shadow);
  }
  .hint b{color:#374151}
  .legend{
    position:fixed;right:20px;bottom:66px;z-index:20;display:flex;gap:11px;flex-wrap:wrap;
    max-width:56vw;font-size:10.5px;color:var(--muted);background:rgba(255,255,255,.88);
    border:1px solid #e8e5de;padding:6px 11px;border-radius:8px;box-shadow:var(--shadow);
  }
  .legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
  /* 学习状态 */
  .stats{display:flex;flex:none;gap:11px;align-items:center;font-size:11.5px;color:var(--muted);white-space:nowrap}
  .stats b{color:#374151;font-weight:700}
  .stats .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
  .mark{cursor:pointer}
  .mark:hover circle{stroke-width:2.4}
  /* 视图切换 */
  .seg{display:flex;flex:none;background:#efece6;border:1px solid #dedad2;border-radius:8px;padding:2px;gap:2px}
  .seg a{font-size:12px;font-weight:600;color:#6b7280;text-decoration:none;padding:5px 11px;border-radius:6px;transition:.15s;white-space:nowrap}
  .seg a:hover{color:#374151;background:rgba(255,255,255,.6)}
  .seg a.on{background:#fff;color:#111827;box-shadow:0 1px 3px rgba(17,24,39,.14)}

  /* 长链图的标记按钮 */
  .mk{cursor:pointer}
  .mk:hover circle{stroke-width:2.6}
  /* 右下角：模式切换 */
  .modeswitch{
    position:fixed;right:20px;bottom:14px;z-index:22;
    display:flex;align-items:center;gap:8px;
    font-family:var(--font);font-size:12.5px;font-weight:700;color:#fff;
    background:#111827;border:1px solid #111827;
    padding:9px 16px;border-radius:999px;cursor:pointer;
    box-shadow:0 6px 18px rgba(17,24,39,.20);transition:.16s;
  }
  .modeswitch:hover{background:#1f2937;transform:translateY(-1px);box-shadow:0 9px 24px rgba(17,24,39,.26)}
  .modeswitch .ico{font-size:14px;line-height:1;opacity:.85}
  .modeswitch:focus-visible{outline:2px solid #93c5fd;outline-offset:2px}
  .golink{position:fixed;left:20px;bottom:52px;z-index:20;font-size:11px;font-weight:700;color:#374151;
    text-decoration:none;background:rgba(255,255,255,.9);border:1px solid #dedad2;padding:6px 11px;
    border-radius:8px;box-shadow:var(--shadow);transition:.15s}
  .golink:hover{background:#fff;border-color:#c9c4ba;color:#111827}

  /* 窄屏：先让出副标题，再整体收紧，尽量保持一行 */
  @media (max-width:1580px){ .brand .sub{display:none} }
  @media (max-width:1420px){
    .topbar{gap:9px;padding:7px 14px}
    button{padding:5px 8px;font-size:11.5px}
    .seg a{padding:4px 9px;font-size:11.5px}
    .stats{font-size:11px;gap:8px}
  }
/* === 移动端切换栏 grid 修复（4 等分）=== */
@media (max-width: 900px){
  .topbar{flex-wrap:wrap !important;height:auto !important;overflow:visible !important;
          padding:6px 8px !important;gap:5px !important}
  .brand{flex:1 0 100% !important;margin-bottom:2px}
  .spacer{display:none !important}
  .seg{display:grid !important;grid-template-columns:repeat(4,1fr) !important;
       gap:4px !important;width:100% !important;flex:1 0 100% !important;
       order:-1 !important;padding:3px !important;box-sizing:border-box}
  .seg a{min-width:0 !important;width:auto !important;flex:none !important;
         text-align:center !important;padding:7px 2px !important;
         font-size:11.5px !important;line-height:1.2;white-space:nowrap;
         overflow:hidden;text-overflow:ellipsis;background:transparent;border-radius:6px}
  .seg a.on{background:#fff;box-shadow:0 1px 3px rgba(17,24,39,.14)}
  .btns{flex-wrap:nowrap !important;overflow-x:auto !important;width:100%}
  .btns::-webkit-scrollbar{display:none}
  button{flex:none;font-size:11px;padding:5px 8px;white-space:nowrap}
  .stats{flex:1 0 100% !important;justify-content:center !important;font-size:9.5px !important}
  .legend{display:none !important}
  .hint{font-size:10px;left:8px;bottom:8px;padding:4px 8px;max-width:calc(100% - 16px)}
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">

<script>
/* ================= 共享层：元素、标记、缩放、模式 ================= */
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("map");
const scene = document.getElementById("scene");
function el(tag, attrs){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
const $ = id => document.getElementById(id);
/* 顶栏可能因窗口变窄而换行：按实测高度留上边距，避免内容被顶栏压住 */
function topPadPx(extra){
  const b = document.querySelector(".topbar");
  const h = (b && b.offsetHeight) ? b.offsetHeight : 60;
  return h + extra;
}

/* ================= 文字测量与折行（两种模式共用一套） =================
   用 Canvas measureText 真实测量宽度（不是按字符数估算），
   再按「CJK 单字成词、英文按空格切词」折行，避免把 Axios 劈成 A / xios。 */
function isCJK(ch){ return /[\u3000-\u303f\u4e00-\u9fff\uff00-\uffef]/.test(ch); }
const _mc = document.createElement("canvas").getContext("2d");
let _fontFam = null;
const _wCache = new Map();
function textW(s, fs, weight){
  const w = weight || 400;
  const key = w + "|" + fs + "|" + s;
  const hit = _wCache.get(key);
  if (hit !== undefined) return hit;
  if (_fontFam === null) _fontFam = getComputedStyle(document.body).fontFamily;
  _mc.font = w + " " + fs + "px " + _fontFam;
  const v = _mc.measureText(s).width;
  _wCache.set(key, v);
  return v;
}
function tokenize(s){
  // CJK/标点 单字成词；英文按空格切词（空格并入前一词，作为断行点）
  const out = []; let buf = "";
  for (const ch of s){
    if (isCJK(ch)){
      if (buf){ out.push(buf); buf = ""; }
      out.push(ch);
    } else if (ch === " "){
      buf += ch; out.push(buf); buf = "";
    } else {
      buf += ch;
    }
  }
  if (buf) out.push(buf);
  // 收尾标点并到前一个词，避免“）”单独占一行
  const merged = [];
  for (const tk of out){
    if (merged.length && /^[）】」』，。、；：？！\)\]%]+$/.test(tk)) merged[merged.length-1] += tk;
    else merged.push(tk);
  }
  return merged;
}
/* 单词本身就比行宽还长时（超长标识符），才退化成按字符切 */
function splitLong(tk, fs, budget, weight){
  if (textW(tk, fs, weight) <= budget) return [tk];
  const out = []; let rest = tk;
  while (rest){
    let n = 1;
    while (n < rest.length && textW(rest.slice(0, n+1), fs, weight) <= budget) n++;
    out.push(rest.slice(0, n));
    rest = rest.slice(n);
  }
  return out;
}
function wrap2(s, fs, budget, maxL, weight){
  const toks = [];
  tokenize(s).forEach(tk => splitLong(tk, fs, budget, weight).forEach(x => toks.push(x)));
  const lines = []; let cur = "";
  for (const tk of toks){
    const test = cur + tk;
    if (cur && textW(test, fs, weight) > budget){
      lines.push(cur); cur = tk;
      if (lines.length >= maxL){ cur = ""; break; }
    } else cur = test;
  }
  if (cur && lines.length < maxL) lines.push(cur);
  // 用「去空白后的字符数」判断是否真的有内容没放下（避免空格导致误判）
  const full = toks.join("").replace(/\s/g, "");
  const used = lines.join("").replace(/\s/g, "");
  if (used.length < full.length && lines.length){
    let last = lines[lines.length-1];
    while (last.length > 1 && textW(last+"…", fs, weight) > budget) last = last.slice(0,-1);
    lines[lines.length-1] = last + "…";
  }
  return lines;
}

const MARK_COLORS = ["#9ca3af", "#DC2626", "#F59E0B", "#16A34A"];
const MARK_TINTS  = ["#ffffff", "#FEF2F2", "#FFFBEB", "#F0FDF4"];
const MARK_NAMES  = ["未标记", "不会", "仅了解", "理解"];
const LS_KEY = "mm-marks-v1";
const LS_SEEDED = "mm-marks-seeded-v1";
const LS_MODE = "mm-mode-v1";

/* ================= 思维导图引擎 ================= */
const FS   = {0:17, 1:13.5, 2:12, 3:11};
const PADX = {0:22, 1:15, 2:12, 3:10};
const PADY = {0:15, 1:10, 2:7.5, 3:6.5};
const GAPY = {0:22, 1:9, 2:5, 3:4};
const GAPX = {0:78, 1:52, 2:40, 3:34};
const MAXW = {0:360, 1:300, 2:300, 3:400};
const MAXL = {0:99, 1:99, 2:99, 3:99};   // 不再截断：文字按需换行，全部显示（原来是 1/2/2/3 行，超出加省略号）

function measure(node, level, path){
  node._level = level;
  node._path = path;
  node._lines = wrap(node.t, level);
  node._w = Math.max(0, ...node._lines.map(l => textW(l, FS[level], WEIGHT[level]))) + PADX[level]*2;
  node._h = node._lines.length * (FS[level]*1.4) + PADY[level]*2;
  node._open = !mindState.collapsed.has(node) && node.c && node.c.length > 0;
  if (node._open) node.c.forEach((ch,i) => measure(ch, level+1, path + "-" + i));
}

function layoutSide(nodes, dir, x0){
  let cursor = 0;
  function place(node, level, colX){
    // colX: 该节点列的「锚点」：右向为左边缘，左向为右边缘
    node._dir = dir;
    if (dir > 0){ node._x = colX; }
    else { node._x = colX - node._w; }
    if (!node._open || !node.c || !node.c.length){
      node._y = cursor;
      cursor += node._h + GAPY[Math.min(level,3)];
      return node._y + node._h/2;
    }
    const nextX = dir > 0
      ? colX + node._w + GAPX[Math.min(level,3)]
      : colX - node._w - GAPX[Math.min(level,3)];
    const centers = node.c.map(ch => place(ch, level+1, nextX));
    node._y = (Math.min(...centers) + Math.max(...centers))/2 - node._h/2;
    return node._y + node._h/2;
  }
  nodes.forEach(st => place(st, 1, x0));
  return { height: cursor };
}

function collect(node, out){
  out.push(node);
  if (node._open) node.c.forEach(ch => collect(ch, out));
  return out;
}

function assignPaths(node, path){
  node._path = path;
  (node.c||[]).forEach((ch,i) => assignPaths(ch, path + "-" + i));
}

function build(){
  // 0. 先给全部节点分配路径（折叠的也要有，否则标记会串号）
  assignPaths(DATA, "r");
  // 1. 测量
  measure(DATA, 0, "r");
  // 2. 分左右（交替）
  const rightStages = [], leftStages = [];
  DATA.c.forEach((st, i) => { (i % 2 === 0 ? rightStages : leftStages).push(st); });
  // 3. 两侧布局（先在各自局部坐标）
  const R = layoutSide(rightStages, +1, 0);
  const L = layoutSide(leftStages, -1, 0);

  // 左内侧的局部 x 范围：最右是 0，最左是负值
  let leftMinX = 0, rightMaxX = 0;
  const walkX = (n, pick) => { pick(n); if (n._open) n.c.forEach(ch => walkX(ch, pick)); };
  leftStages.forEach(st => walkX(st, n => { leftMinX = Math.min(leftMinX, n._x); }));
  rightStages.forEach(st => walkX(st, n => { rightMaxX = Math.max(rightMaxX, n._x + n._w); }));

  const leftW = -leftMinX;
  const gapR = GAPX[0], rootW = DATA._w;
  // 水平位移：左侧整体平移到 0 起，根紧随其后
  const shiftLeft = leftW;
  const rootX = leftW + gapR;
  const shiftRight = rootX + rootW + gapR;

  const shiftSide = (stages, dx, dy) => {
    stages.forEach(st => {
      const walk = n => { n._x += dx; n._y += dy; if (n._open) n.c.forEach(walk); };
      walk(st);
    });
  };

  const H = Math.max(R.height, L.height);
  // 垂直居中：两侧各自居中
  const dyR = (H - R.height) / 2;
  const dyL = (H - L.height) / 2;
  shiftSide(rightStages, shiftRight, dyR);
  shiftSide(leftStages, shiftLeft, dyL);

  DATA._x = rootX;
  DATA._y = H/2 - DATA._h/2;

  // 收集所有可见节点
  const nodes = [];
  collect(DATA, nodes);

  return { nodes, rootX, rootW, totalH: H };
}

function renderMind(keepView){

  const { nodes } = build();

  const gE = el("g", {});
  const drawEdge = (p, c) => {
    const px = p._dir > 0 ? p._x + p._w : p._x;
    const py = p._y + p._h/2;

    gE.appendChild(el("path", {
      d:`M ${px} ${py} C ${mx} ${py}, ${mx} ${cy}, ${cx} ${cy}`,
      fill:"none", stroke:c.color || "#9ca3af",
      "stroke-width": c._level === 1 ? 2 : 1.2,
      "stroke-linecap":"round",
      opacity: c._level === 1 ? .9 : .5
    }));
  };
  nodes.forEach(n => { if (n._open && n.c) n.c.forEach(ch => drawEdge(n, ch)); });
  scene.appendChild(gE);

  const gN = el("g", {});
  nodes.forEach(n => {
    const lv = n._level;
    const g = el("g", { class:"node" });
    const isRoot = lv === 0;
    const isLeaf = !(n.c && n.c.length);
    const mk = (!isRoot && isLeaf) ? markGet(n._path) : 0;
    const fill0 = isRoot ? "#111827" : (lv === 1 ? (n.color || "#334155") : "#ffffff");
    const stroke0 = isRoot ? "#111827" : (lv === 1 ? (n.color || "#334155")
                   : (lv === 2 ? (n.color || "#d6d3ce") : (n.color || "#d6d3ce")));
    const rect = el("rect", {
      x:n._x, y:n._y, width:n._w, height:n._h,
      rx: isRoot ? 12 : 8,
      fill: mk ? MARK_TINTS[mk] : fill0,
      stroke: mk ? MARK_COLORS[mk] : stroke0,
      "stroke-width": mk ? 1.8 : (lv === 1 ? 0 : (lv === 2 ? 1.1 : 0.9)),
      "stroke-opacity": mk ? 1 : (lv >= 3 ? .35 : 1)
    });
    if (lv === 2 && !mk) rect.setAttribute("stroke-opacity", ".55");
    g.appendChild(rect);

    const fs = FS[lv], lh = fs*1.4;
    const totalH = n._lines.length * lh;
    const startY = n._y + (n._h - totalH)/2 + lh/2;
    n._lines.forEach((line, i) => {
      const t = el("text", {
        y: startY + i*lh,
        "font-size": fs,
        "font-weight": isRoot ? 800 : (lv === 1 ? 700 : (lv === 2 ? 600 : 400)),
        fill: isRoot ? "#ffffff" : (lv === 1 ? "#ffffff" : (lv === 2 ? "#1f2937" : "#4b5563"))
      });
      if (n._dir > 0 && !isRoot){
        t.setAttribute("x", n._x + PADX[lv]);
        t.setAttribute("text-anchor", "start");
      } else if (n._dir < 0 && !isRoot){
        t.setAttribute("x", n._x + n._w - PADX[lv]);
        t.setAttribute("text-anchor", "end");
      } else {
        t.setAttribute("x", n._x + PADX[lv]);
        t.setAttribute("text-anchor", "start");
      }
      t.textContent = line;
      g.appendChild(t);
    });

    if (n.c && n.c.length){
      const cx = n._dir > 0 || isRoot ? n._x + n._w + 12 : n._x - 12;
      const cy = n._y + n._h/2;
      g.appendChild(el("circle", { cx, cy, r:7.5, fill:"#fff",
        stroke:n.color || "#9ca3af", "stroke-width":1.2 }));
      const tt = el("text", { x:cx, y:cy+0.5, "text-anchor":"middle",
        "font-size":9.5, "font-weight":700, fill:n.color || "#9ca3af" });
      tt.textContent = n._open ? "−" : String(n.c.length);
      g.appendChild(tt);
    } else {
      /* ----- 叶子节点：学习状态小圆按钮 ----- */
      const cx = (n._dir > 0 || isRoot) ? n._x + n._w + 12 : n._x - 12;
      const cy = n._y + n._h/2;
      const gm = el("g", { class:"mark" });
      gm.appendChild(el("circle", {
        cx, cy, r:8,
        fill: mk ? MARK_COLORS[mk] : "#ffffff",
        stroke: mk ? MARK_COLORS[mk] : "#c3c9d2",
        "stroke-width": mk ? 1 : 1.3,
        "stroke-dasharray": mk ? "0" : "2.2 2.2"
      }));
      if (mk){
        const chk = el("text", {
          x:cx, y:cy+0.6, "text-anchor":"middle",
          "font-size":9, "font-weight":800, fill:"#ffffff"
        });
        chk.textContent = mk === 3 ? "✓" : (mk === 2 ? "~" : "✕");
        gm.appendChild(chk);
      }
      const ttl = el("title", {});
      ttl.textContent = `【${MARK_NAMES[mk]}】点击切换：不会 → 仅了解 → 理解 → 取消`;
      gm.appendChild(ttl);
      gm.addEventListener("click", ev => { ev.stopPropagation(); markCyclePath(n._path); });
      g.appendChild(gm);
    }

    const title = el("title", {}); title.textContent = n.t; g.appendChild(title);
    g.addEventListener("click", ev => {
      ev.stopPropagation();
      if (n.c && n.c.length){
        if (mindState.collapsed.has(n)) mindState.collapsed.delete(n); else mindState.collapsed.add(n);
        renderKeepNode(n);
      }
    });
    gN.appendChild(g);
  });
  scene.appendChild(gN);
  if (keep){ mindState.scale = keep.s; mindState.tx = keep.x; mindState.ty = keep.y; applyZoom(); }
  else fitMind();
  buildLegend();
  updateStats();
}

function renderKeepNode(n){
  if (!n || n._x == null || n._y == null){ renderMind(true); return; }
  const ax = mindState.tx + n._x * mindState.scale;     // 点击节点在屏幕上的位置（渲染前）
  const ay = mindState.ty + n._y * mindState.scale;
  renderMind(true);                                  // true = 沿用当前缩放/平移
  if (n._x == null || n._y == null) return;
  mindState.tx += ax - (mindState.tx + n._x * mindState.scale);   // 把同一个节点挪回原处
  mindState.ty += ay - (mindState.ty + n._y * mindState.scale);
  applyZoom();
}

function fitMind(){
  const bb = scene.getBBox();
  if (!bb.width) return;
  const W = svg.clientWidth, H = svg.clientHeight;
  const padX = 70, padTop = topPadPx(26), padBottom = 62;
  const s = Math.min((W - padX*2)/bb.width, (H - padTop - padBottom)/bb.height, 1.25);
  mindState.scale = Math.max(s, 0.1);
  mindState.tx = (W - bb.width*mindState.scale)/2 - bb.x*mindState.scale;
  mindState.ty = padTop + (H - padTop - padBottom - bb.height*mindState.scale)/2 - bb.y*mindState.scale;
  applyZoom();
}

function buildLegend(){
  const box = document.getElementById("legend"); box.innerHTML = "";

      const ilh = FS_ITEM*1.32;
      const isy = row.y + row.h/2 - (row.lines.length-1)*ilh/2;
      row.lines.forEach((ln,k) => {
        gI.appendChild(txt(cx+12, isy + k*ilh, ln, FS_ITEM, "#1f2937", 600));
      });
      if (row.it.details.length){
        gI.appendChild(el("circle", { cx:cx+ITEM_W-13, cy:row.y+row.h/2, r:6, fill:"#fff", stroke:st.color, "stroke-width":1, "stroke-opacity":.7 }));
        gI.appendChild(txt(cx+ITEM_W-13, row.y+row.h/2+0.5, row.open ? "−" : String(row.it.details.length), 8, st.color, 700, "middle"));
      } else {
        /* 无细节的环节 = 叶子，加学习状态按钮 */
        markBtn(gI, cx+ITEM_W-13, row.y+row.h/2, row.it.p, 6.5);
      }
      gI.style.cursor = "pointer";
      gI.addEventListener("click", ev => {
        ev.stopPropagation();
        if (!row.it.details.length) return;
        if (state.collapsedItem.has(row.key)) state.collapsedItem.delete(row.key);
        else state.collapsedItem.add(row.key);
        render(true);   // 保持当前缩放/平移，不重置视图
      });
      gN.appendChild(gI);

      // 细节
      row.dets.forEach(dd => {
        const dmk = markOf(dd.p);
        gN.appendChild(el("rect", {
          x:cx+14, y:dd.y, width:DETAIL_W, height:dd.h, rx:5,
          fill: dmk ? MARK_TINTS[dmk] : "#f6f4ef",
          stroke: dmk ? MARK_COLORS[dmk] : st.color,
          "stroke-width": dmk ? 1.4 : .8,
          "stroke-opacity": dmk ? .9 : .28
        }));
        const dlh = FS_DETAIL*1.3;
        const dsy = dd.y + dd.h/2 - (dd.lines.length-1)*dlh/2;
        dd.lines.forEach((ln,kk) => {
          gN.appendChild(txt(cx+22, dsy + kk*dlh, ln, FS_DETAIL, dmk === 1 ? "#b91c1c" : "#5b6472", 400));
        });
        markBtn(gN, cx+14+DETAIL_W-13, dd.y+dd.h/2, dd.p, 6.5);
      });
    });
  });
  scene.appendChild(gN);

  if (keep){ state.scale = keep.s; state.tx = keep.x; state.ty = keep.y; apply(); }
  else { CONTENT.w = 0; }

  // 记录精确内容框，供 fit() 使用（getBBox 在这种大量分组下不准）
  CONTENT.w = (main.length-1)*(CARD_W+COL_GAP) + CARD_W;
  CONTENT.y0 = 0;
  CONTENT.h = topPad + maxH + 46;
  if (keep){ state.scale = keep.s; state.tx = keep.x; state.ty = keep.y; apply(); }
  else fit();
  updateStats();
}

function CAPTION_BG(i, c){
  // 直接用阶段色，稍作区分
  return c;
}

function apply(){
  scene.setAttribute("transform", `translate(${state.tx},${state.ty}) scale(${state.scale})`);
  document.getElementById("zoomval").textContent = Math.round(state.scale*100)+"%";
}

function fit(){
  const W = svg.clientWidth, H = svg.clientHeight;
  const clean = (new URLSearchParams(location.search)).get("clean") === "1";
  const padX = clean ? 40 : 54, padTop = clean ? 34 : topPadPx(20), padBottom = 46;
  if (!CONTENT.w) return;
  const s = Math.min((W-padX*2)/CONTENT.w, (H-padTop-padBottom)/CONTENT.h, 3);
  state.scale = Math.max(s, 0.12);
  const cw = CONTENT.w*state.scale, ch = CONTENT.h*state.scale;
  state.tx = Math.round((W - cw)/2);
  state.ty = Math.round(padTop + (H - padTop - padBottom - ch)/2 - CONTENT.y0*state.scale);
  apply();
  window.__MM_GEOM = {scale:state.scale,tx:state.tx,ty:state.ty,cw:CONTENT.w,ch:CONTENT.h,vw:svg.clientWidth,vh:svg.clientHeight};
}



return { render: render, fit: fit, apply: apply, state: state };
})();

/* ================= 顶栏文案 / 图例 / 模式按钮 ================= */
let CLEAN = false;
let seedNote = "";
function updateChrome(){
  const mind = MODE === "mind";
  $("btn-mode-label").textContent = mind ? "切到长链图" : "切到思维导图";
  $("btn-mode").title = mind ? "切换到长链图模式" : "切换到思维导图模式";
  $("brandsub").textContent = mind ? "用户注册案例 · 六段式时序" : "用户注册案例 · 一条链走完 6 个阶段";
  $("btn-expand").textContent = mind ? "全部展开" : "展开细节";
  $("hint").innerHTML = (mind
      ? "<b>点击节点</b>展开/折叠 · <b>滚轮</b>缩放 · <b>拖拽</b>平移"
      : "<b>点阶段</b>收起/展开环节 · <b>点环节</b>看细节 · <b>滚轮</b>缩放 · <b>拖拽</b>平移") + seedNote;
  $("legend").style.display = (mind && !CLEAN) ? "" : "none";
  document.title = "前后端数据沟通全链路 · " + (mind ? "思维导图" : "长链图");
}
function setMode(m, silent){
  MODE = (m === "chain") ? "chain" : "mind";
  updateChrome();
  const keep = seen[MODE];
  seen[MODE] = true;
  redraw(keep);
  if (!silent){
    try { localStorage.setItem(LS_MODE, MODE); } catch(e){}
    try {
      const u = new URL(location.href);
      if (MODE === "chain") u.searchParams.set("mode", "chain");
      else u.searchParams.delete("mode");
      history.replaceState(null, "", u.href);
    } catch(e){}
  }
}
$("btn-mode").onclick = () => setMode(MODE === "mind" ? "chain" : "mind");

/* ================= 工具栏 ================= */
$("btn-expand").onclick = () => {
  if (MODE === "mind") mindSetAll(() => false);
  else { ChainView.state.collapsedStage.clear(); ChainView.state.collapsedItem.clear(); ChainView.render(false); }
};
$("btn-collapse").onclick = () => {
  if (MODE === "mind") mindSetAll((n, d) => d >= 1);
  else {
    ChainView.state.collapsedStage.clear(); ChainView.state.collapsedItem.clear();
    CHAIN.forEach((_, i) => ChainView.state.collapsedStage.add(i));
    ChainView.render(false);
  }
};
$("btn-items").onclick = () => {
  if (MODE === "mind") mindSetAll((n, d) => d >= 2);
  else {
    ChainView.state.collapsedStage.clear(); ChainView.state.collapsedItem.clear();
    CHAIN.forEach((st, i) => st.items.forEach((it, j) => {
      if (it.details.length) ChainView.state.collapsedItem.add(i + "-" + j);
    }));
    ChainView.render(false);
  }
};
$("btn-fit").onclick = () => redraw(false);
$("btn-in").onclick = () => { const st = curState(); st.scale = Math.min(st.scale*1.18, 3); applyZoom(); };
$("btn-out").onclick = () => { const st = curState(); st.scale = Math.max(st.scale/1.18, MODE === "mind" ? 0.06 : 0.08); applyZoom(); };
$("btn-reset").onclick = () => {
  if (!confirm("确定清空所有学习状态标记？")) return;
  marks = {}; saveMarks();
  try { localStorage.setItem(LS_SEEDED, "1"); } catch(e){}
  redraw(true); updateStats();
};
$("btn-author").onclick = loadAuthorMarks;

/* ================= 导出 / 导入 ================= */
function exportMarks(){
  const keys = Object.keys(marks);
  const payload = {
    app: "前后端数据沟通全链路-学习标记",
    version: 1,
    exportedAt: new Date().toISOString(),
    total: keys.length,
    marks: marks
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const d = new Date();
  const ymd = d.getFullYear() + "-" +
              String(d.getMonth()+1).padStart(2,"0") + "-" +
              String(d.getDate()).padStart(2,"0");
  const a = document.createElement("a");
  a.href = url;
  a.download = "学习标记-" + ymd + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  alert("已导出 " + keys.length + " 条标记\n\n文件名：学习标记-" + ymd + ".json\n（在浏览器下载目录里）\n\n把它拷到 U 盘，换电脑时用「导入标记」恢复。");
}
function importMarks(file){
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const obj = JSON.parse(fr.result);
      const m = obj.marks || obj;
      if (typeof m !== "object" || m === null || Array.isArray(m)) throw new Error("不是有效的标记文件");
      const keys = Object.keys(m).filter(k => /^r(-\d+)+$/.test(k) && m[k] >= 1 && m[k] <= 3);
      if (!keys.length) throw new Error("文件里没有可用的标记");
      if (!confirm("将导入 " + keys.length + " 条标记。\n\n规则：同一知识点以导入文件为准，其余保留你当前的标记。\n\n继续？")) return;
      keys.forEach(k => { marks[k] = m[k]; });
      saveMarks(); redraw(true); updateStats();
      alert("导入完成。\n当前共 " + Object.keys(marks).length + " 条标记。");
    } catch (e) {
      alert("导入失败：" + e.message + "\n\n请确认选的是「导出标记」生成的 json 文件。");
    }
  };
  fr.readAsText(file, "utf-8");
}
$("btn-export").onclick = exportMarks;
$("btn-import").onclick = () => $("file-import").click();
$("file-import").addEventListener("change", ev => {
  const f = ev.target.files && ev.target.files[0];
  if (f) importMarks(f);
  ev.target.value = "";
});

/* ================= 缩放 / 平移交互（两种模式共用） ================= */
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = e.deltaY < 0 ? 1.12 : 1/1.12;
  const st = curState();
  const lo = MODE === "mind" ? 0.06 : 0.08;
  const ns = Math.min(Math.max(st.scale*k, lo), 3);
  const q = ns / st.scale;
  st.tx = mx - (mx - st.tx)*q;
  st.ty = my - (my - st.ty)*q;
  st.scale = ns;
  applyZoom();
}, { passive:false });

let drag = false, lx = 0, ly = 0;
svg.addEventListener("mousedown", e => { drag = true; lx = e.clientX; ly = e.clientY; svg.classList.add("dragging"); });
window.addEventListener("mousemove", e => {
  if (!drag) return;
  const st = curState();
  st.tx += e.clientX - lx; st.ty += e.clientY - ly;
  lx = e.clientX; ly = e.clientY;
  applyZoom();
});
window.addEventListener("mouseup", () => { drag = false; svg.classList.remove("dragging"); });
window.addEventListener("resize", () => { clearTimeout(window._t); window._t = setTimeout(applyZoom, 120); });

/* ================= 初始化 ================= */
(function(){
  const q = new URLSearchParams(location.search);

  /* 导图：默认展开到环节 */
  mindState.collapsed.clear();
  const v = q.get("view") || "items";
  if (v === "items"){
    const walk = (n, d) => { if (d >= 2) mindState.collapsed.add(n); (n.c||[]).forEach(ch => walk(ch, d+1)); };
    DATA.c.forEach(st => walk(st, 1));
  } else if (v === "collapse"){
    DATA.c.forEach(st => mindState.collapsed.add(st));
  }

  /* 长链图：默认展开到环节（细节折叠） */
  ChainView.state.collapsedStage.clear();
  ChainView.state.collapsedItem.clear();
  if (q.get("detail") !== "1"){
    CHAIN.forEach((st, i) => st.items.forEach((it, j) => {
      if (it.details.length) ChainView.state.collapsedItem.add(i + "-" + j);
    }));
  }

  /* 净图模式：隐藏所有界面元素，便于截图 */
  if (q.get("clean") === "1"){
    CLEAN = true;
    document.querySelector(".topbar").style.display = "none";
    $("hint").style.display = "none";
    $("legend").style.display = "none";
    $("btn-mode").style.display = "none";
    document.body.style.backgroundImage = "none";
  }

  /* 首次访问：把作者标记作为初始状态 */
  const seeded = seedAuthorMarks();
  if (seeded) seedNote = ' · <b>已载入作者 ' + seeded + ' 条标记</b>';

  /* 初始模式：URL 优先，其次记住上次 */
  let m = "mind";
  if (q.get("mode") === "chain" || q.get("detail") === "1") m = "chain";
  else if (q.get("view")) m = "mind";
  else { try { if (localStorage.getItem(LS_MODE) === "chain") m = "chain"; } catch(e){} }
  setMode(m, true);
})();
</script>
